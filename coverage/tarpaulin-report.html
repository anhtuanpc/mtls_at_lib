dress":[2917062],"length":1,"stats":{"Line":2}},{"line":382,"address":[2952365],"length":1,"stats":{"Line":2}},{"line":383,"address":[2952372],"length":1,"stats":{"Line":2}},{"line":384,"address":[2952379],"length":1,"stats":{"Line":2}},{"line":385,"address":[2952386],"length":1,"stats":{"Line":2}},{"line":386,"address":[2865641],"length":1,"stats":{"Line":2}},{"line":387,"address":[2917104],"length":1,"stats":{"Line":2}},{"line":388,"address":[2927783],"length":1,"stats":{"Line":2}},{"line":389,"address":[2865662],"length":1,"stats":{"Line":2}},{"line":390,"address":[2865592],"length":1,"stats":{"Line":1}},{"line":396,"address":[2927808],"length":1,"stats":{"Line":1}},{"line":397,"address":[2865705],"length":1,"stats":{"Line":1}},{"line":398,"address":[2952488],"length":1,"stats":{"Line":1}},{"line":399,"address":[2917218],"length":1,"stats":{"Line":1}},{"line":400,"address":[2927916],"length":1,"stats":{"Line":1}},{"line":401,"address":[2865814],"length":1,"stats":{"Line":1}},{"line":402,"address":[2865840],"length":1,"stats":{"Line":1}},{"line":403,"address":[2917319],"length":1,"stats":{"Line":1}},{"line":404,"address":[2917342],"length":1,"stats":{"Line":1}},{"line":405,"address":[2928037],"length":1,"stats":{"Line":1}},{"line":406,"address":[2917388],"length":1,"stats":{"Line":1}},{"line":407,"address":[2917411],"length":1,"stats":{"Line":1}},{"line":409,"address":[2917432],"length":1,"stats":{"Line":1}}],"covered":55,"coverable":55},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","tests","cert_e2e.rs"],"content":"//! End-to-End Tests for Certificate Module\n//!\n//! This test suite validates complete certificate workflows including:\n//! - Self-signed certificate generation and validation\n//! - CA certificate creation and certificate chain building\n//! - Certificate signing with CA\n//! - Certificate verification and validation\n//! - Real-world scenarios with proper key management\n\nuse mtls_at_lib::cert::CertificateBuilder;\nuse mtls_at_lib::csr::CsrBuilder;\nuse mtls_at_lib::types::{KeyUsage, ExtendedKeyUsage};\nuse rcgen::KeyPair;\nuse x509_parser::prelude::*;\n\n/// Helper to verify certificate PEM format\nfn verify_cert_pem_format(pem: \u0026str) {\n    assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n    assert!(pem.contains(\"-----END CERTIFICATE-----\"));\n    assert!(pem.lines().count() \u003e 3); // Header + content + footer\n}\n\n/// Helper to verify certificate DER format\nfn verify_cert_der_format(der: \u0026[u8]) {\n    assert!(!der.is_empty());\n    // DER certificates start with SEQUENCE (0x30)\n    assert_eq!(der[0], 0x30);\n}\n\n/// Helper to parse certificate DER\nfn parse_cert(der: \u0026[u8]) -\u003e X509Certificate\u003c'_\u003e {\n    let (_, cert) = X509Certificate::from_der(der).expect(\"Failed to parse certificate\");\n    cert\n}\n\n#[test]\nfn test_e2e_self_signed_certificate_workflow() {\n    // Scenario: Generate a self-signed certificate for a web server\n    println!(\"\\n=== E2E Test: Self-Signed Certificate Workflow ===\");\n    \n    // Step 1: Create a CSR for the server\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=server.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"server.example.com\")\n        .add_san(\"www.example.com\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created for server.example.com\");\n    \n    // Step 2: Create a self-signed certificate from the CSR\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build self-signed certificate\");\n    \n    println!(\"✓ Step 2: Self-signed certificate created\");\n    \n    // Step 3: Verify the certificate properties\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    verify_cert_der_format(\u0026server_cert.to_der());\n    \n    // Should have private key (self-signed includes it)\n    assert!(server_cert.private_key_pem().is_some());\n    assert!(!server_cert.private_key_pem().unwrap().is_empty());\n    \n    // Parse certificate and validate subject DN matches input\n    let parsed = parse_cert(server_cert.to_der());\n    let subject = parsed.subject();\n    let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n    assert_eq!(cn, \"server.example.com\", \"CN should match input\");\n    let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n    assert_eq!(o, \"Example Corp\", \"Organization should match input\");\n    let c = subject.iter_country().next().unwrap().as_str().unwrap();\n    assert_eq!(c, \"US\", \"Country should match input\");\n    \n    println!(\"✓ Step 3: Certificate validated with DN data\");\n    \n    // Step 4: Save to files (simulated)\n    let cert_pem = server_cert.to_pem();\n    let key_pem = server_cert.private_key_pem().unwrap();\n    \n    assert!(cert_pem.len() \u003e 100);\n    assert!(key_pem.len() \u003e 100);\n    \n    println!(\"✓ Step 4: Certificate and key ready for deployment\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_ca_and_server_certificate_chain() {\n    // Scenario: Create a CA certificate and use it to sign a server certificate\n    println!(\"\\n=== E2E Test: CA Certificate Chain Workflow ===\");\n    \n    // Step 1: Create CA certificate (self-signed root CA)\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Example Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    println!(\"✓ Step 1: CA CSR created\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 2: Root CA certificate created (self-signed)\");\n    \n    // Step 2: Create a server CSR with a different key\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=api.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"api.example.com\")\n        .add_san(\"api-v2.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    println!(\"✓ Step 3: Server CSR created with different key\");\n    \n    // Step 3: Sign the server certificate with CA\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=Example Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate with CA\");\n    \n    println!(\"✓ Step 4: Server certificate signed by CA\");\n    \n    // Step 4: Verify the certificates\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    \n    // CA cert should have private key (it's self-signed)\n    assert!(ca_cert.private_key_pem().is_some());\n    \n    // Server cert should NOT have private key (CA-signed)\n    assert!(server_cert.private_key_pem().is_none());\n    \n    // Server still has its own private key from CSR\n    assert!(!server_csr.private_key_pem().is_empty());\n    \n    println!(\"✓ Step 5: Certificate chain validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_intermediate_ca_chain() {\n    // Scenario: Root CA -\u003e Intermediate CA -\u003e Server Certificate\n    println!(\"\\n=== E2E Test: Three-Level Certificate Chain ===\");\n    \n    // Step 1: Create Root CA\n    let root_ca_csr = CsrBuilder::new()\n        .subject(\"CN=Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set root CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build root CA CSR\");\n    \n    let root_ca_cert = CertificateBuilder::new()\n        .from_der(root_ca_csr.to_der())\n        .expect(\"Failed to load root CA CSR\")\n        .signing_key(root_ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build root CA certificate\");\n    \n    println!(\"✓ Step 1: Root CA created\");\n    \n    // Step 2: Create Intermediate CA CSR\n    let intermediate_ca_csr = CsrBuilder::new()\n        .subject(\"CN=Intermediate CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set intermediate CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build intermediate CA CSR\");\n    \n    println!(\"✓ Step 2: Intermediate CA CSR created\");\n    \n    // Step 3: Sign Intermediate CA with Root CA\n    let intermediate_ca_cert = CertificateBuilder::new()\n        .from_der(intermediate_ca_csr.to_der())\n        .expect(\"Failed to load intermediate CA CSR\")\n        .signing_key(root_ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign intermediate CA with root CA\");\n    \n    println!(\"✓ Step 3: Intermediate CA signed by Root CA\");\n    \n    // Step 4: Create Server CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=secure.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"secure.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    println!(\"✓ Step 4: Server CSR created\");\n    \n    // Step 5: Sign Server Certificate with Intermediate CA\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(intermediate_ca_csr.private_key_pem().to_string())\n        .build_ca_signed(\"CN=Intermediate CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate with intermediate CA\");\n    \n    println!(\"✓ Step 5: Server certificate signed by Intermediate CA\");\n    \n    // Step 6: Verify the chain\n    verify_cert_pem_format(\u0026root_ca_cert.to_pem());\n    verify_cert_pem_format(\u0026intermediate_ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    \n    // Only root CA should have its private key in the cert object\n    assert!(root_ca_cert.private_key_pem().is_some());\n    assert!(intermediate_ca_cert.private_key_pem().is_none());\n    assert!(server_cert.private_key_pem().is_none());\n    \n    println!(\"✓ Step 6: Three-level certificate chain validated\");\n    println!(\"  - Root CA (self-signed)\");\n    println!(\"  - Intermediate CA (signed by Root CA)\");\n    println!(\"  - Server Certificate (signed by Intermediate CA)\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_multiple_servers_same_ca() {\n    // Scenario: One CA signing multiple server certificates\n    println!(\"\\n=== E2E Test: Multiple Servers with Same CA ===\");\n    \n    // Step 1: Create CA\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Shared CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 1: Shared CA created\");\n    \n    // Step 2: Create multiple server certificates\n    let servers = vec![\n        (\"server1.example.com\", \"Server 1\"),\n        (\"server2.example.com\", \"Server 2\"),\n        (\"server3.example.com\", \"Server 3\"),\n    ];\n    \n    let mut server_certs = Vec::new();\n    \n    for (domain, name) in servers {\n        // Create CSR for each server\n        let server_csr = CsrBuilder::new()\n            .subject(\u0026format!(\"CN={},O=Example Corp,C=US\", domain))\n            .expect(\"Failed to set server subject\")\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(domain)\n            .build()\n            .expect(\"Failed to build server CSR\");\n        \n        // Sign with CA\n        let server_cert = CertificateBuilder::new()\n            .from_der(server_csr.to_der())\n            .expect(\"Failed to load server CSR\")\n            .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n            .build_ca_signed(\"CN=Shared CA,O=Example Corp,C=US\")\n            .expect(\"Failed to sign server certificate\");\n        \n        verify_cert_pem_format(\u0026server_cert.to_pem());\n        assert!(server_cert.private_key_pem().is_none());\n        \n        server_certs.push((name, server_cert));\n        println!(\"✓ Step 2.{}: {} certificate signed\", server_certs.len(), name);\n    }\n    \n    // Step 3: Verify all certificates are valid\n    assert_eq!(server_certs.len(), 3);\n    for (name, cert) in \u0026server_certs {\n        assert!(!cert.to_pem().is_empty(), \"{} cert is empty\", name);\n        assert!(!cert.to_der().is_empty(), \"{} cert DER is empty\", name);\n    }\n    \n    println!(\"✓ Step 3: All server certificates validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_client_certificate_for_mtls() {\n    // Scenario: Generate client certificate for mutual TLS (mTLS)\n    println!(\"\\n=== E2E Test: Client Certificate for mTLS ===\");\n    \n    // Step 1: Create CA\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 1: CA certificate created\");\n    \n    // Step 2: Create server certificate\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=mtls.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"mtls.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate\");\n    \n    println!(\"✓ Step 2: Server certificate created\");\n    \n    // Step 3: Create client certificate\n    let client_csr = CsrBuilder::new()\n        .subject(\"CN=client-app,O=Example Corp,C=US\")\n        .expect(\"Failed to set client subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_agreement())\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to build client CSR\");\n    \n    let client_cert = CertificateBuilder::new()\n        .from_der(client_csr.to_der())\n        .expect(\"Failed to load client CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign client certificate\");\n    \n    println!(\"✓ Step 3: Client certificate created\");\n    \n    // Step 4: Verify mTLS setup\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    verify_cert_pem_format(\u0026client_cert.to_pem());\n    \n    // Verify key management\n    assert!(ca_cert.private_key_pem().is_some(), \"CA should have private key\");\n    assert!(server_cert.private_key_pem().is_none(), \"Server cert shouldn't include private key\");\n    assert!(client_cert.private_key_pem().is_none(), \"Client cert shouldn't include private key\");\n    \n    // Server and client keep their own private keys from CSRs\n    assert!(!server_csr.private_key_pem().is_empty(), \"Server should have its private key\");\n    assert!(!client_csr.private_key_pem().is_empty(), \"Client should have its private key\");\n    \n    println!(\"✓ Step 4: mTLS certificate chain validated\");\n    println!(\"  - CA certificate\");\n    println!(\"  - Server certificate (for server authentication)\");\n    println!(\"  - Client certificate (for client authentication)\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_certificate_with_san_multiple_domains() {\n    // Scenario: Create certificate with multiple SANs (Subject Alternative Names)\n    println!(\"\\n=== E2E Test: Certificate with Multiple SANs ===\");\n    \n    // Step 1: Create CSR with multiple SANs\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=multi.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"multi.example.com\")\n        .add_san(\"www.multi.example.com\")\n        .add_san(\"api.multi.example.com\")\n        .add_san(\"admin.multi.example.com\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created with 4 SANs\");\n    \n    // Step 2: Create self-signed certificate\n    let cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build certificate\");\n    \n    println!(\"✓ Step 2: Certificate created\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    assert!(cert.private_key_pem().is_some());\n    \n    println!(\"✓ Step 3: Multi-SAN certificate validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_error_same_key_for_ca_signed() {\n    // Scenario: Verify that using the same key for CA-signed cert fails\n    println!(\"\\n=== E2E Test: Error Handling - Same Key for CA-Signed ===\");\n    \n    // Step 1: Create a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Try to create CA-signed cert with the same key (should fail)\n    let result = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_ca_signed(\"CN=Test CA,O=Example Corp,C=US\");\n    \n    println!(\"✓ Step 2: Attempted to sign with same key\");\n    \n    // Step 3: Verify it fails with the correct error\n    assert!(result.is_err(), \"Should fail when using same key for CA-signed\");\n    \n    match result {\n        Err(mtls_at_lib::error::CertError::PublicKeyMismatch(msg)) =\u003e {\n            assert!(msg.contains(\"Public key in CSR matches CA signing key\"));\n            println!(\"✓ Step 3: Correctly rejected with PublicKeyMismatch error\");\n            println!(\"  Error message: {}\", msg);\n        }\n        _ =\u003e panic!(\"Expected PublicKeyMismatch error\"),\n    }\n    \n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_error_different_key_for_self_signed() {\n    // Scenario: Verify that using a different key for self-signed cert fails\n    println!(\"\\n=== E2E Test: Error Handling - Different Key for Self-Signed ===\");\n    \n    // Step 1: Create a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Generate a different key\n    let different_key = KeyPair::generate().expect(\"Failed to generate key\");\n    let different_key_pem = different_key.serialize_pem();\n    \n    println!(\"✓ Step 2: Different key generated\");\n    \n    // Step 3: Try to create self-signed cert with different key (should fail)\n    let result = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(different_key_pem)\n        .build_self_signed();\n    \n    println!(\"✓ Step 3: Attempted to self-sign with different key\");\n    \n    // Step 4: Verify it fails with the correct error\n    assert!(result.is_err(), \"Should fail when using different key for self-signed\");\n    \n    match result {\n        Err(mtls_at_lib::error::CertError::PublicKeyMismatch(msg)) =\u003e {\n            assert!(msg.contains(\"Public key in CSR does not match signing key\"));\n            println!(\"✓ Step 4: Correctly rejected with PublicKeyMismatch error\");\n            println!(\"  Error message: {}\", msg);\n        }\n        _ =\u003e panic!(\"Expected PublicKeyMismatch error, got: {:?}\", result),\n    }\n    \n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_load_from_pem_and_der() {\n    // Scenario: Test loading CSR from both PEM and DER formats\n    println!(\"\\n=== E2E Test: Load CSR from PEM and DER ===\");\n    \n    // Step 1: Create a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=format-test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Load from DER\n    let cert_from_der = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load from DER\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build cert from DER\");\n    \n    println!(\"✓ Step 2: Certificate built from DER format\");\n    \n    // Step 3: Load from PEM\n    let cert_from_pem = CertificateBuilder::new()\n        .from_pem(\u0026csr.to_pem())\n        .expect(\"Failed to load from PEM\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build cert from PEM\");\n    \n    println!(\"✓ Step 3: Certificate built from PEM format\");\n    \n    // Step 4: Verify both certificates are valid\n    verify_cert_pem_format(\u0026cert_from_der.to_pem());\n    verify_cert_pem_format(\u0026cert_from_pem.to_pem());\n    \n    assert!(!cert_from_der.to_der().is_empty());\n    assert!(!cert_from_pem.to_der().is_empty());\n    \n    println!(\"✓ Step 4: Both certificates validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_certificate_with_validity_period() {\n    use std::time::{SystemTime, Duration};\n    \n    println!(\"\\n=== E2E Test: Certificate with Explicit Validity Period ===\");\n    \n    // Step 1: Create CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=validity-test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Create certificate with specific validity period\n    let now = SystemTime::now();\n    let one_year_later = now + Duration::from_secs(365 * 24 * 60 * 60);\n    \n    let cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .not_before(now)\n        .not_after(one_year_later)\n        .build_self_signed()\n        .expect(\"Failed to build certificate with validity period\");\n    \n    println!(\"✓ Step 2: Certificate created with 1-year validity period\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    verify_cert_der_format(\u0026cert.to_der());\n    assert!(cert.private_key_pem().is_some());\n    \n    println!(\"✓ Step 3: Certificate with validity period validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_certificate_with_validity_duration() {\n    use std::time::Duration;\n    \n    println!(\"\\n=== E2E Test: Certificate with Validity Duration ===\");\n    \n    // Step 1: Create CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=duration-test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature())\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Create certificate with 90-day validity\n    let ninety_days = Duration::from_secs(90 * 24 * 60 * 60);\n    \n    let cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .validity_duration(ninety_days)\n        .build_self_signed()\n        .expect(\"Failed to build certificate with validity duration\");\n    \n    println!(\"✓ Step 2: Certificate created with 90-day validity duration\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    assert!(!cert.to_der().is_empty());\n    \n    println!(\"✓ Step 3: Certificate validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_certificate_with_crl_distribution_points() {\n    println!(\"\\n=== E2E Test: Certificate with CRL Distribution Points ===\");\n    \n    // Step 1: Create CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=crl-enabled.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Create certificate with CRL distribution points\n    let cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .add_crl_distribution_point(\"http://crl.example.com/ca.crl\")\n        .add_crl_distribution_point(\"http://backup-crl.example.com/ca.crl\")\n        .add_crl_distribution_point(\"ldap://ldap.example.com/cn=CA,dc=example,dc=com\")\n        .build_self_signed()\n        .expect(\"Failed to build certificate with CRL DPs\");\n    \n    println!(\"✓ Step 2: Certificate created with 3 CRL distribution points:\");\n    println!(\"  - http://crl.example.com/ca.crl\");\n    println!(\"  - http://backup-crl.example.com/ca.crl\");\n    println!(\"  - ldap://ldap.example.com/cn=CA,dc=example,dc=com\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    verify_cert_der_format(\u0026cert.to_der());\n    \n    println!(\"✓ Step 3: Certificate with CRL DPs validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_ca_signed_certificate_with_all_features() {\n    use std::time::{SystemTime, Duration};\n    \n    println!(\"\\n=== E2E Test: CA-Signed Certificate with All Features ===\");\n    \n    // Step 1: Create CA\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Full Featured CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .validity_duration(Duration::from_secs(10 * 365 * 24 * 60 * 60)) // 10 years\n        .add_crl_distribution_point(\"http://root-ca.example.com/ca.crl\")\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 1: CA certificate created with 10-year validity and CRL DP\");\n    \n    // Step 2: Create server CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=full-featured.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH, ExtendedKeyUsage::CLIENT_AUTH])\n        .add_san(\"full-featured.example.com\")\n        .add_san(\"www.full-featured.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    println!(\"✓ Step 2: Server CSR created\");\n    \n    // Step 3: Sign server certificate with CA including all features\n    let now = SystemTime::now();\n    let two_years = Duration::from_secs(2 * 365 * 24 * 60 * 60);\n    \n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .not_before(now)\n        .not_after(now + two_years)\n        .add_crl_distribution_point(\"http://server-crl.example.com/server.crl\")\n        .add_crl_distribution_point(\"ldap://ldap.example.com/cn=Server,dc=example,dc=com\")\n        .build_ca_signed(\"CN=Full Featured CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate\");\n    \n    println!(\"✓ Step 3: Server certificate signed by CA with:\");\n    println!(\"  - 2-year validity period\");\n    println!(\"  - 2 CRL distribution points\");\n    \n    // Step 4: Verify complete chain\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    \n    assert!(ca_cert.private_key_pem().is_some());\n    assert!(server_cert.private_key_pem().is_none());\n    assert!(!server_csr.private_key_pem().is_empty());\n    \n    println!(\"✓ Step 4: Complete certificate chain validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_short_lived_certificate() {\n    use std::time::Duration;\n    \n    println!(\"\\n=== E2E Test: Short-Lived Certificate (7 days) ===\");\n    \n    // Step 1: Create CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=short-lived.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature())\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created for short-lived certificate\");\n    \n    // Step 2: Create certificate with 7-day validity\n    let seven_days = Duration::from_secs(7 * 24 * 60 * 60);\n    \n    let cert = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(csr.private_key_pem().to_string())\n        .validity_duration(seven_days)\n        .build_self_signed()\n        .expect(\"Failed to build short-lived certificate\");\n    \n    println!(\"✓ Step 2: Short-lived certificate created (7-day validity)\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    assert!(cert.private_key_pem().is_some());\n    \n    println!(\"✓ Step 3: Short-lived certificate validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_long_lived_ca_certificate() {\n    use std::time::Duration;\n    \n    println!(\"\\n=== E2E Test: Long-Lived CA Certificate (20 years) ===\");\n    \n    // Step 1: Create CA CSR\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Long-Lived Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    println!(\"✓ Step 1: CA CSR created\");\n    \n    // Step 2: Create CA certificate with 20-year validity\n    let twenty_years = Duration::from_secs(20 * 365 * 24 * 60 * 60);\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .validity_duration(twenty_years)\n        .add_crl_distribution_point(\"http://long-lived-ca.example.com/root.crl\")\n        .build_self_signed()\n        .expect(\"Failed to build long-lived CA certificate\");\n    \n    println!(\"✓ Step 2: CA certificate created with 20-year validity\");\n    \n    // Step 3: Verify CA certificate\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_der_format(\u0026ca_cert.to_der());\n    assert!(ca_cert.private_key_pem().is_some());\n    \n    println!(\"✓ Step 3: Long-lived CA certificate validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_multiple_crl_distribution_points() {\n    println!(\"\\n=== E2E Test: Certificate with Multiple CRL Protocols ===\");\n    \n    // Step 1: Create CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=multi-crl.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Create certificate with CRL DPs using different protocols\n    let crl_uris = vec![\n        \"http://crl.example.com/ca.crl\".to_string(),\n        \"https://secure-crl.example.com/ca.crl\".to_string(),\n        \"ldap://ldap.example.com/cn=CA,dc=example,dc=com\".to_string(),\n        \"ftp://ftp.example.com/crl/ca.crl\".to_string(),\n    ];\n    \n    let cert = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(csr.private_key_pem().to_string())\n        .crl_distribution_points(crl_uris)\n        .build_self_signed()\n        .expect(\"Failed to build certificate with multiple CRL protocols\");\n    \n    println!(\"✓ Step 2: Certificate created with 4 CRL distribution points:\");\n    println!(\"  - HTTP protocol\");\n    println!(\"  - HTTPS protocol\");\n    println!(\"  - LDAP protocol\");\n    println!(\"  - FTP protocol\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    assert!(!cert.to_der().is_empty());\n    \n    println!(\"✓ Step 3: Certificate with multi-protocol CRL DPs validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","tests","crl_e2e.rs"],"content":"//! E2E tests for CRL module - validates input/output data\n\nuse mtls_at_lib::cert::{Certificate, CertificateBuilder};\nuse mtls_at_lib::crl::{CrlBuilder, RevokedCertificate};\nuse mtls_at_lib::csr::CsrBuilder;\nuse mtls_at_lib::types::{KeyUsage, RevocationReason};\nuse rcgen::SerialNumber;\nuse x509_parser::prelude::*;\n\nfn create_test_ca() -\u003e Certificate {\n    let csr = CsrBuilder::new()\n        .subject(\"CN=Test CA\").unwrap()\n        .is_ca(true)\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build().unwrap();\n    \n    CertificateBuilder::new()\n        .from_der(csr.to_der()).unwrap()\n        .signing_key(csr.private_key_pem().to_string())\n        .build_self_signed().unwrap()\n}\n\nfn parse_crl(der: \u0026[u8]) -\u003e CertificateRevocationList\u003c'_\u003e {\n    let (_, crl) = CertificateRevocationList::from_der(der).unwrap();\n    crl\n}\n\n#[test]\nfn test_empty_crl() {\n    // Input: CA key, no revoked certs\n    let ca = create_test_ca();\n    \n    // Output: Empty CRL\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .validity_days(7)\n        .build().unwrap();\n    \n    // Validate: Parse CRL and verify it contains 0 revoked certs\n    let parsed = parse_crl(crl.to_der());\n    assert_eq!(parsed.iter_revoked_certificates().count(), 0);\n    \n    let pem = crl.to_pem();\n    assert!(pem.starts_with(\"-----BEGIN X509 CRL-----\"));\n}\n\n#[test]\nfn test_crl_with_single_revoked_cert() {\n    // Input: serial 12345 with reason KEY_COMPROMISE\n    let ca = create_test_ca();\n    let input_serial = 12345u64;\n    let input_reason = RevocationReason::KEY_COMPROMISE;\n    \n    let revoked = RevokedCertificate::new(SerialNumber::from(input_serial))\n        .with_reason(input_reason);\n    \n    // Output: CRL with revoked cert\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(revoked)\n        .validity_days(7)\n        .build().unwrap();\n    \n    // Validate: Parse CRL and verify serial matches input\n    let parsed = parse_crl(crl.to_der());\n    let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n    assert_eq!(revoked_certs.len(), 1);\n    \n    let serial_in_crl = revoked_certs[0].user_certificate.to_bytes_be();\n    let expected = input_serial.to_be_bytes();\n    let expected_stripped = \u0026expected[expected.iter().position(|\u0026b| b != 0).unwrap_or(expected.len() - 1)..];\n    assert_eq!(serial_in_crl.as_slice(), expected_stripped);\n}\n\n#[test]\nfn test_crl_with_multiple_revoked_certs() {\n    // Input: 4 serials (100, 200, 300, 400) with different reasons\n    let ca = create_test_ca();\n    let inputs = vec![\n        (100u64, RevocationReason::KEY_COMPROMISE),\n        (200u64, RevocationReason::SUPERSEDED),\n        (300u64, RevocationReason::AFFILIATION_CHANGED),\n        (400u64, RevocationReason::CESSATION_OF_OPERATION),\n    ];\n    \n    let mut builder = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap();\n    \n    for (serial, reason) in \u0026inputs {\n        builder = builder.add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(*serial)).with_reason(*reason)\n        );\n    }\n    \n    // Output: CRL with 4 revoked certs\n    let crl = builder.validity_days(30).build().unwrap();\n    \n    // Validate: Parse CRL and verify all 4 serials are present\n    let parsed = parse_crl(crl.to_der());\n    let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n    assert_eq!(revoked_certs.len(), inputs.len());\n    \n    for (i, revoked_cert) in revoked_certs.iter().enumerate() {\n        let serial_in_crl = revoked_cert.user_certificate.to_bytes_be();\n        let expected = inputs[i].0.to_be_bytes();\n        let expected_stripped = \u0026expected[expected.iter().position(|\u0026b| b != 0).unwrap_or(expected.len() - 1)..];\n        assert_eq!(serial_in_crl.as_slice(), expected_stripped);\n    }\n}\n\n#[test]\nfn test_crl_all_revocation_reasons() {\n    // Input: 10 certs with all 10 revocation reason types\n    let ca = create_test_ca();\n    let reasons = vec![\n        RevocationReason::UNSPECIFIED,\n        RevocationReason::KEY_COMPROMISE,\n        RevocationReason::CA_COMPROMISE,\n        RevocationReason::AFFILIATION_CHANGED,\n        RevocationReason::SUPERSEDED,\n        RevocationReason::CESSATION_OF_OPERATION,\n        RevocationReason::CERTIFICATE_HOLD,\n        RevocationReason::REMOVE_FROM_CRL,\n        RevocationReason::PRIVILEGE_WITHDRAWN,\n        RevocationReason::AA_COMPROMISE,\n    ];\n    \n    let mut builder = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap();\n    \n    for (i, reason) in reasons.iter().enumerate() {\n        builder = builder.add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from((i + 1) as u64)).with_reason(*reason)\n        );\n    }\n    \n    // Output: CRL with all reason types\n    let crl = builder.build().unwrap();\n    \n    // Validate: Parse CRL and verify all 10 certs are present\n    let parsed = parse_crl(crl.to_der());\n    assert_eq!(parsed.iter_revoked_certificates().count(), reasons.len());\n}\n\n#[test]\nfn test_crl_custom_validity() {\n    // Input: CA key + custom validity period (90 days)\n    let ca = create_test_ca();\n    let input_validity = 90u32;\n    let input_this_update = ::time::OffsetDateTime::now_utc();\n    \n    let revoked = RevokedCertificate::new(SerialNumber::from(999u64))\n        .with_reason(RevocationReason::KEY_COMPROMISE);\n    \n    // Output: CRL with 90-day validity\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(revoked)\n        .this_update(input_this_update)\n        .validity_days(input_validity)\n        .build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_batch_revoked_certs() {\n    // Input: CA key + 20 revoked certs\n    let ca = create_test_ca();\n    let input_count = 20;\n    \n    let revoked_list: Vec\u003c_\u003e = (1..=input_count)\n        .map(|i| RevokedCertificate::new(SerialNumber::from(i))\n            .with_reason(RevocationReason::KEY_COMPROMISE))\n        .collect();\n    \n    // Output: CRL with 20 revoked certs\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_certs(revoked_list)\n        .validity_days(14)\n        .build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_custom_revocation_times() {\n    // Input: 3 revoked certs with different revocation times\n    let ca = create_test_ca();\n    let now = ::time::OffsetDateTime::now_utc();\n    \n    let inputs = vec![\n        (1001u64, now - ::time::Duration::days(1)),\n        (1002u64, now - ::time::Duration::days(7)),\n        (1003u64, now - ::time::Duration::days(30)),\n    ];\n    \n    let mut builder = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap();\n    \n    for (serial, time) in inputs {\n        builder = builder.add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(serial))\n                .with_time(time)\n                .with_reason(RevocationReason::KEY_COMPROMISE)\n        );\n    }\n    \n    // Output: CRL with custom revocation times\n    let crl = builder.build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_without_reasons() {\n    // Input: 3 revoked certs without reasons\n    let ca = create_test_ca();\n    \n    let revoked_list = vec![\n        RevokedCertificate::new(SerialNumber::from(5001u64)),\n        RevokedCertificate::new(SerialNumber::from(5002u64)),\n        RevokedCertificate::new(SerialNumber::from(5003u64)),\n    ];\n    \n    // Output: CRL without revocation reasons\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_certs(revoked_list)\n        .build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_short_validity() {\n    // Input: 1-day validity\n    let ca = create_test_ca();\n    let input_validity = 1u32;\n    \n    // Output: Short-lived CRL\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(9001u64))\n                .with_reason(RevocationReason::KEY_COMPROMISE)\n        )\n        .validity_days(input_validity)\n        .build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_long_validity() {\n    // Input: 180-day validity\n    let ca = create_test_ca();\n    let input_validity = 180u32;\n    \n    // Output: Long-lived CRL\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(9002u64))\n                .with_reason(RevocationReason::SUPERSEDED)\n        )\n        .validity_days(input_validity)\n        .build().unwrap();\n    \n    // Validate: CRL generated\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_crl_default_builder() {\n    // Input: Default builder settings\n    let ca = create_test_ca();\n    \n    // Output: CRL with defaults\n    let crl = CrlBuilder::default()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .build().unwrap();\n    \n    // Validate: CRL generated with defaults\n    assert!(!crl.to_der().is_empty());\n}\n\n#[test]\nfn test_error_missing_issuer_key() {\n    // Input: No issuer key\n    // Output: Error\n    let result = CrlBuilder::new().validity_days(7).build();\n    \n    // Validate: MissingField error\n    assert!(result.is_err());\n    let err = result.unwrap_err();\n    assert!(matches!(err, mtls_at_lib::error::CrlError::MissingField(_)));\n}\n\n#[test]\nfn test_error_invalid_issuer_key() {\n    // Input: Invalid key string\n    // Output: Error\n    let result = CrlBuilder::new()\n        .issuer_key_from_pem(\"invalid key data\");\n    \n    // Validate: SigningError\n    assert!(result.is_err());\n    let err = result.unwrap_err();\n    assert!(matches!(err, mtls_at_lib::error::CrlError::SigningError(_)));\n}\n\n#[test]\nfn test_crl_pem_der_formats() {\n    // Input: CA key\n    let ca = create_test_ca();\n    \n    // Output: CRL in both formats\n    let crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(8888u64))\n                .with_reason(RevocationReason::KEY_COMPROMISE)\n        )\n        .build().unwrap();\n    \n    // Validate: Both formats are valid\n    let pem = crl.to_pem();\n    let der = crl.to_der();\n    \n    assert!(pem.starts_with(\"-----BEGIN X509 CRL-----\"));\n    assert!(pem.contains(\"-----END X509 CRL-----\"));\n    assert_eq!(der[0], 0x30); // SEQUENCE tag\n    assert!(!der.is_empty());\n}\n\n#[test]\nfn test_crl_update_scenario() {\n    // Input: Initial CRL with 1 cert, then updated with 3 certs\n    let ca = create_test_ca();\n    \n    // Initial CRL\n    let initial_crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_cert(\n            RevokedCertificate::new(SerialNumber::from(2001u64))\n                .with_reason(RevocationReason::KEY_COMPROMISE)\n        )\n        .build().unwrap();\n    \n    // Updated CRL\n    let update_time = ::time::OffsetDateTime::now_utc() + ::time::Duration::hours(24);\n    let updated_crl = CrlBuilder::new()\n        .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n        .add_revoked_certs(vec![\n            RevokedCertificate::new(SerialNumber::from(2001u64))\n                .with_reason(RevocationReason::KEY_COMPROMISE),\n            RevokedCertificate::new(SerialNumber::from(2002u64))\n                .with_reason(RevocationReason::SUPERSEDED),\n            RevokedCertificate::new(SerialNumber::from(2003u64))\n                .with_reason(RevocationReason::AFFILIATION_CHANGED),\n        ])\n        .this_update(update_time)\n        .build().unwrap();\n    \n    // Validate: Both CRLs generated\n    assert!(!initial_crl.to_der().is_empty());\n    assert!(!updated_crl.to_der().is_empty());\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","tests","csr_generation.rs"],"content":"//! Integration tests for CSR generation\n//!\n//! These tests verify that CSR generation meets all qualification requirements.\n\nuse mtls_at_lib::csr::CsrBuilder;\nuse mtls_at_lib::types::{ExtendedKeyUsage, KeyUsage};\nuse x509_parser::prelude::*;\n\n/// Helper to parse CSR DER\nfn parse_csr(der: \u0026[u8]) -\u003e X509CertificationRequest\u003c'_\u003e {\n    let (_, csr) = X509CertificationRequest::from_der(der).expect(\"Failed to parse CSR\");\n    csr\n}\n\n#[test]\nfn test_csr_generation_with_ku_and_eku_for_ca() {\n    // Qualification requirement 1.1: Create X509 CSR with KU and EKU extensions (CA)\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Test Root CA,O=Test Organization,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .is_ca(true)\n        .build()\n        .expect(\"Failed to generate CA CSR\");\n\n    // Verify CSR was generated\n    let der = ca_csr.to_der();\n    assert!(!der.is_empty(), \"CSR DER should not be empty\");\n\n    // Verify PEM encoding\n    let pem = ca_csr.to_pem();\n    assert!(\n        pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"),\n        \"PEM should start with CSR header\"\n    );\n    assert!(\n        pem.contains(\"-----END CERTIFICATE REQUEST-----\"),\n        \"PEM should contain CSR footer\"\n    );\n\n    // Verify private key was generated\n    let private_key_der = ca_csr.private_key_der();\n    assert!(\n        !private_key_der.is_empty(),\n        \"Private key DER should not be empty\"\n    );\n\n    let private_key_pem = ca_csr.private_key_pem();\n    assert!(\n        private_key_pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"),\n        \"Private key PEM should start with key header\"\n    );\n    \n    // Parse CSR and validate subject DN matches input\n    let parsed = parse_csr(\u0026der);\n    let subject = parsed.certification_request_info.subject;\n    let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n    assert_eq!(cn, \"Test Root CA\", \"CN should match input\");\n    let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n    assert_eq!(o, \"Test Organization\", \"Organization should match input\");\n    let c = subject.iter_country().next().unwrap().as_str().unwrap();\n    assert_eq!(c, \"US\", \"Country should match input\");\n\n    println!(\"✓ CA CSR generated successfully with Key Usage extensions and validated DN\");\n}\n\n#[test]\nfn test_csr_generation_with_ku_and_eku_for_standard_cert() {\n    // Qualification requirement 1.2: Create X509 CSR with KU and EKU extensions (standard)\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=server.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"www.example.com\")\n        .add_san(\"api.example.com\")\n        .build()\n        .expect(\"Failed to generate server CSR\");\n\n    // Verify CSR was generated\n    let der = server_csr.to_der();\n    assert!(!der.is_empty(), \"CSR DER should not be empty\");\n\n    // Verify PEM encoding\n    let pem = server_csr.to_pem();\n    assert!(\n        pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"),\n        \"PEM should start with CSR header\"\n    );\n\n    // Verify private key\n    assert!(\n        !server_csr.private_key_der().is_empty(),\n        \"Private key should be generated\"\n    );\n    \n    // Parse CSR and validate subject DN matches input\n    let parsed = parse_csr(server_csr.to_der());\n    let subject = parsed.certification_request_info.subject;\n    let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n    assert_eq!(cn, \"server.example.com\", \"CN should match input\");\n    let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n    assert_eq!(o, \"Example Corp\", \"Organization should match input\");\n    let c = subject.iter_country().next().unwrap().as_str().unwrap();\n    assert_eq!(c, \"US\", \"Country should match input\");\n\n    println!(\"✓ Server CSR generated successfully with Key Usage and Extended Key Usage, DN validated\");\n}\n\n#[test]\nfn test_csr_generation_for_client_auth() {\n    // Create a client authentication CSR\n    let client_csr = CsrBuilder::new()\n        .subject(\"CN=client.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature())\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to generate client CSR\");\n\n    // Verify CSR was generated\n    assert!(!client_csr.to_der().is_empty(), \"Client CSR should be generated\");\n\n    println!(\"✓ Client CSR generated successfully for mTLS client authentication\");\n}\n\n#[test]\nfn test_csr_generation_without_optional_extensions() {\n    // Generate a basic CSR without Key Usage or Extended Key Usage\n    let basic_csr = CsrBuilder::new()\n        .subject(\"CN=basic.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate basic CSR\");\n\n    // Verify CSR was generated\n    assert!(!basic_csr.to_der().is_empty(), \"Basic CSR should be generated\");\n    assert!(\n        basic_csr.to_pem().contains(\"CERTIFICATE REQUEST\"),\n        \"Should be a valid CSR\"\n    );\n\n    println!(\"✓ Basic CSR generated successfully without extensions\");\n}\n\n#[test]\nfn test_csr_generation_with_multiple_eku() {\n    // Generate CSR with multiple Extended Key Usage values\n    let multi_eku_csr = CsrBuilder::new()\n        .subject(\"CN=multi.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![\n            ExtendedKeyUsage::SERVER_AUTH,\n            ExtendedKeyUsage::CLIENT_AUTH,\n        ])\n        .build()\n        .expect(\"Failed to generate multi-EKU CSR\");\n\n    assert!(!multi_eku_csr.to_der().is_empty(), \"Multi-EKU CSR should be generated\");\n\n    println!(\"✓ CSR generated successfully with multiple Extended Key Usage values\");\n}\n\n#[test]\nfn test_csr_missing_subject_returns_error() {\n    // Verify that CSR generation fails without a subject\n    let result = CsrBuilder::new().build();\n\n    assert!(result.is_err(), \"CSR generation should fail without subject\");\n    if let Err(e) = result {\n        println!(\"✓ Error correctly returned for missing subject: {}\", e);\n    }\n}\n\n#[test]\nfn test_csr_invalid_subject_returns_error() {\n    // Verify that invalid subject format returns an error\n    let result = CsrBuilder::new().subject(\"\");\n\n    assert!(result.is_err(), \"Empty subject should return an error\");\n    if let Err(e) = result {\n        println!(\"✓ Error correctly returned for empty subject: {}\", e);\n    }\n}\n\n#[test]\nfn test_key_pair_is_different_for_each_csr() {\n    // Generate two CSRs and verify they have different key pairs\n    let csr1 = CsrBuilder::new()\n        .subject(\"CN=test1.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR 1\");\n\n    let csr2 = CsrBuilder::new()\n        .subject(\"CN=test2.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR 2\");\n\n    // Verify that the private keys are different\n    assert_ne!(\n        csr1.private_key_der(),\n        csr2.private_key_der(),\n        \"Each CSR should have a unique private key\"\n    );\n\n    println!(\"✓ Each CSR generates a unique key pair\");\n}\n\n#[test]\nfn test_csr_with_all_key_usage_flags() {\n    // Test CSR with all Key Usage flags set\n    let all_ku = KeyUsage::digital_signature()\n        | KeyUsage::non_repudiation()\n        | KeyUsage::key_encipherment()\n        | KeyUsage::data_encipherment()\n        | KeyUsage::key_agreement()\n        | KeyUsage::key_cert_sign()\n        | KeyUsage::crl_sign()\n        | KeyUsage::encipher_only()\n        | KeyUsage::decipher_only();\n\n    let csr = CsrBuilder::new()\n        .subject(\"CN=all-ku.example.com\")\n        .expect(\"Failed to set subject\")\n        .key_usage(all_ku)\n        .build()\n        .expect(\"Failed to generate CSR with all KU flags\");\n\n    assert!(!csr.to_der().is_empty(), \"CSR with all KU flags should be generated\");\n\n    println!(\"✓ CSR generated successfully with all Key Usage flags\");\n}\n\n#[test]\nfn test_csr_with_all_extended_key_usage_types() {\n    // Test CSR with all Extended Key Usage types individually\n    \n    // Test SERVER_AUTH\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=server-auth.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .build()\n        .expect(\"Failed to generate CSR with SERVER_AUTH\");\n    assert!(!server_csr.to_der().is_empty(), \"SERVER_AUTH CSR should be generated\");\n    println!(\"✓ CSR generated with SERVER_AUTH\");\n\n    // Test CLIENT_AUTH\n    let client_csr = CsrBuilder::new()\n        .subject(\"CN=client-auth.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to generate CSR with CLIENT_AUTH\");\n    assert!(!client_csr.to_der().is_empty(), \"CLIENT_AUTH CSR should be generated\");\n    println!(\"✓ CSR generated with CLIENT_AUTH\");\n\n    // Test CODE_SIGNING\n    let code_signing_csr = CsrBuilder::new()\n        .subject(\"CN=code-signing.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::CODE_SIGNING])\n        .build()\n        .expect(\"Failed to generate CSR with CODE_SIGNING\");\n    assert!(!code_signing_csr.to_der().is_empty(), \"CODE_SIGNING CSR should be generated\");\n    println!(\"✓ CSR generated with CODE_SIGNING\");\n\n    // Test EMAIL_PROTECTION\n    let email_csr = CsrBuilder::new()\n        .subject(\"CN=email-protection.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::EMAIL_PROTECTION])\n        .build()\n        .expect(\"Failed to generate CSR with EMAIL_PROTECTION\");\n    assert!(!email_csr.to_der().is_empty(), \"EMAIL_PROTECTION CSR should be generated\");\n    println!(\"✓ CSR generated with EMAIL_PROTECTION\");\n\n    // Test TIME_STAMPING\n    let time_stamping_csr = CsrBuilder::new()\n        .subject(\"CN=time-stamping.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::TIME_STAMPING])\n        .build()\n        .expect(\"Failed to generate CSR with TIME_STAMPING\");\n    assert!(!time_stamping_csr.to_der().is_empty(), \"TIME_STAMPING CSR should be generated\");\n    println!(\"✓ CSR generated with TIME_STAMPING\");\n\n    // Test OCSP_SIGNING\n    let ocsp_csr = CsrBuilder::new()\n        .subject(\"CN=ocsp-signing.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::OCSP_SIGNING])\n        .build()\n        .expect(\"Failed to generate CSR with OCSP_SIGNING\");\n    assert!(!ocsp_csr.to_der().is_empty(), \"OCSP_SIGNING CSR should be generated\");\n    println!(\"✓ CSR generated with OCSP_SIGNING\");\n\n    // Test combination of all EKU types\n    let all_eku_csr = CsrBuilder::new()\n        .subject(\"CN=all-eku.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![\n            ExtendedKeyUsage::SERVER_AUTH,\n            ExtendedKeyUsage::CLIENT_AUTH,\n            ExtendedKeyUsage::CODE_SIGNING,\n            ExtendedKeyUsage::EMAIL_PROTECTION,\n            ExtendedKeyUsage::TIME_STAMPING,\n            ExtendedKeyUsage::OCSP_SIGNING,\n        ])\n        .build()\n        .expect(\"Failed to generate CSR with all EKU types\");\n    assert!(!all_eku_csr.to_der().is_empty(), \"CSR with all EKU types should be generated\");\n    println!(\"✓ CSR generated successfully with all Extended Key Usage types combined\");\n}\n\n#[test]\nfn test_csr_with_custom_key() {\n    use rcgen::KeyPair;\n    \n    // Generate a key pair first\n    let key_pair = KeyPair::generate().expect(\"Failed to generate key pair\");\n    let key_pem = key_pair.serialize_pem();\n    \n    // Create a CSR using the custom key\n    let csr = CsrBuilder::new()\n        .subject(\"CN=custom-key.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\u0026key_pem)\n        .expect(\"Failed to set custom key\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .build()\n        .expect(\"Failed to generate CSR with custom key\");\n    \n    // Verify the CSR was created\n    assert!(!csr.to_der().is_empty(), \"CSR with custom key should be generated\");\n    \n    // Verify the private key matches the one we provided\n    let csr_key_pem = csr.private_key_pem();\n    assert_eq!(key_pem, csr_key_pem, \"CSR private key should match the provided key\");\n    \n    println!(\"✓ CSR generated successfully with custom key pair\");\n}\n\n#[test]\nfn test_csr_with_invalid_key_returns_error() {\n    // Try to create a CSR with an invalid key\n    let result = CsrBuilder::new()\n        .subject(\"CN=invalid-key.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\"invalid key format\");\n    \n    assert!(result.is_err(), \"CSR with invalid key should return error\");\n    println!(\"✓ Invalid key correctly rejected\");\n}\n\n#[test]\nfn test_multiple_csrs_with_same_key() {\n    use rcgen::KeyPair;\n    \n    // Generate a single key pair\n    let key_pair = KeyPair::generate().expect(\"Failed to generate key pair\");\n    let key_pem = key_pair.serialize_pem();\n    \n    // Create two CSRs using the same key\n    let csr1 = CsrBuilder::new()\n        .subject(\"CN=first.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\u0026key_pem)\n        .expect(\"Failed to set custom key\")\n        .build()\n        .expect(\"Failed to generate first CSR\");\n    \n    let csr2 = CsrBuilder::new()\n        .subject(\"CN=second.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\u0026key_pem)\n        .expect(\"Failed to set custom key\")\n        .build()\n        .expect(\"Failed to generate second CSR\");\n    \n    // Verify both CSRs were created\n    assert!(!csr1.to_der().is_empty(), \"First CSR should be generated\");\n    assert!(!csr2.to_der().is_empty(), \"Second CSR should be generated\");\n    \n    // Verify both CSRs use the same key\n    assert_eq!(csr1.private_key_pem(), csr2.private_key_pem(), \n               \"Both CSRs should use the same private key\");\n    \n    println!(\"✓ Multiple CSRs created successfully with the same key pair\");\n}\n\n#[test]\nfn test_csr_with_path_len_constraint() {\n    // Test intermediate CA CSR with path length constraint of 1\n    let intermediate_csr = CsrBuilder::new()\n        .subject(\"CN=Intermediate CA,O=Test Organization,OU=PKI,C=US\")\n        .expect(\"Failed to set subject\")\n        .is_ca(true)\n        .path_len_constraint(1)\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to generate intermediate CA CSR with path_len_constraint\");\n    \n    // Verify CSR was generated\n    let der = intermediate_csr.to_der();\n    assert!(!der.is_empty(), \"Intermediate CA CSR should be generated\");\n    \n    // Parse and validate subject\n    let parsed = parse_csr(\u0026der);\n    let subject = parsed.certification_request_info.subject;\n    let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n    assert_eq!(cn, \"Intermediate CA\", \"CN should match input\");\n    \n    // Test leaf CA with path length constraint of 0 (no subordinate CAs)\n    let leaf_ca_csr = CsrBuilder::new()\n        .subject(\"CN=Leaf CA,O=Test Organization,C=US\")\n        .expect(\"Failed to set subject\")\n        .is_ca(true)\n        .path_len_constraint(0)\n        .key_usage(KeyUsage::key_cert_sign())\n        .build()\n        .expect(\"Failed to generate leaf CA CSR\");\n    \n    assert!(!leaf_ca_csr.to_der().is_empty(), \"Leaf CA CSR should be generated\");\n    \n    println!(\"✓ CSRs with path_len_constraint generated successfully\");\n}\n\n#[test]\nfn test_csr_with_state_and_locality() {\n    // Test CSR with State (ST) and Locality (L) DN components\n    let csr_st = CsrBuilder::new()\n        .subject(\"CN=Regional Server,ST=California,L=San Francisco,O=Tech Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .build()\n        .expect(\"Failed to generate CSR with ST and L\");\n    \n    // Parse and validate all DN components\n    let parsed = parse_csr(csr_st.to_der());\n    let subject = parsed.certification_request_info.subject;\n    \n    let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n    assert_eq!(cn, \"Regional Server\", \"CN should match\");\n    \n    let state = subject.iter_state_or_province().next().unwrap().as_str().unwrap();\n    assert_eq!(state, \"California\", \"State should match\");\n    \n    let locality = subject.iter_locality().next().unwrap().as_str().unwrap();\n    assert_eq!(locality, \"San Francisco\", \"Locality should match\");\n    \n    let org = subject.iter_organization().next().unwrap().as_str().unwrap();\n    assert_eq!(org, \"Tech Corp\", \"Organization should match\");\n    \n    // Test with 'S' instead of 'ST'\n    let csr_s = CsrBuilder::new()\n        .subject(\"CN=Another Server,S=New York,L=Manhattan,O=Finance Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR with S and L\");\n    \n    let parsed_s = parse_csr(csr_s.to_der());\n    let subject_s = parsed_s.certification_request_info.subject;\n    \n    let state_s = subject_s.iter_state_or_province().next().unwrap().as_str().unwrap();\n    assert_eq!(state_s, \"New York\", \"State (S) should match\");\n    \n    let locality_s = subject_s.iter_locality().next().unwrap().as_str().unwrap();\n    assert_eq!(locality_s, \"Manhattan\", \"Locality should match\");\n    \n    println!(\"✓ CSRs with State and Locality DN components validated successfully\");\n}\n\n#[test]\nfn test_csr_private_key_reference() {\n    use rcgen::KeyPair;\n    \n    // Generate a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=key-reference-test.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR\");\n    \n    // Get reference to the private key\n    let key_ref = csr.private_key();\n    \n    // Verify we can use the reference to serialize the key\n    let pem_from_ref = key_ref.serialize_pem();\n    assert!(pem_from_ref.starts_with(\"-----BEGIN PRIVATE KEY-----\"), \n            \"Key from reference should serialize to valid PEM\");\n    \n    // Verify it matches the direct method\n    let pem_direct = csr.private_key_pem();\n    assert_eq!(pem_from_ref, pem_direct, \n               \"Key reference should provide same data as direct method\");\n    \n    // Test DER format too\n    let der_from_ref = key_ref.serialize_der();\n    let der_direct = csr.private_key_der();\n    assert_eq!(der_from_ref, der_direct, \n               \"DER from reference should match direct access\");\n    \n    // Verify we can create another key from the PEM and they're equivalent\n    let key_pair_reconstructed = KeyPair::from_pem(\u0026pem_from_ref)\n        .expect(\"Should be able to reconstruct key from PEM\");\n    let reconstructed_pem = key_pair_reconstructed.serialize_pem();\n    assert_eq!(pem_from_ref, reconstructed_pem, \n               \"Reconstructed key should match original\");\n    \n    println!(\"✓ private_key() reference method works correctly\");\n}","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e(
        'code',
        {
          className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        },
        line,
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
