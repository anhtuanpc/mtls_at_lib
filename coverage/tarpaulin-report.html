tes a new CRL\n    pub(crate) fn new(crl_der: Vec\u003cu8\u003e) -\u003e Self {\n        Self { crl_der }\n    }\n    \n    /// Returns the CRL in DER format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::CrlBuilder;\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// // Create a CA\n    /// let ca_csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .is_ca(true)\n    ///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n    ///     .build()?;\n    ///\n    /// let ca = CertificateBuilder::new()\n    ///     .from_der(ca_csr.to_der())?\n    ///     .signing_key(ca_csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// // Generate CRL\n    /// let crl = CrlBuilder::new()\n    ///     .issuer_key_from_pem(ca.private_key_pem().unwrap())?\n    ///     .build()?;\n    ///     \n    /// let der = crl.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.crl_der\n    }\n    \n    /// Returns the CRL in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::CrlBuilder;\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let ca_csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .is_ca(true)\n    ///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n    ///     .build()?;\n    ///\n    /// let ca = CertificateBuilder::new()\n    ///     .from_der(ca_csr.to_der())?\n    ///     .signing_key(ca_csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let crl = CrlBuilder::new()\n    ///     .issuer_key_from_pem(ca.private_key_pem().unwrap())?\n    ///     .build()?;\n    ///     \n    /// let pem = crl.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN X509 CRL-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"X509 CRL\", self.crl_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n}","traces":[{"line":17,"address":[2838224],"length":1,"stats":{"Line":5}},{"line":54,"address":[3052352],"length":1,"stats":{"Line":10}},{"line":55,"address":[3052357],"length":1,"stats":{"Line":5}},{"line":89,"address":[3052368,3052542,3052536],"length":1,"stats":{"Line":2}},{"line":92,"address":[3052392],"length":1,"stats":{"Line":3}},{"line":93,"address":[3052464],"length":1,"stats":{"Line":2}}],"covered":6,"coverable":6},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","csr","builder.rs"],"content":"//! CSR Builder for constructing Certificate Signing Requests\n//!\n//! This module provides a type-safe builder API for creating CSRs with\n//! Key Usage and Extended Key Usage extensions.\n\nuse crate::error::CsrError;\nuse crate::types::{DistinguishedName, ExtendedKeyUsage, KeyUsage};\nuse super::Csr;\n\nuse rcgen::{\n    CertificateParams, DistinguishedName as RcgenDn, DnType, \n    KeyPair, KeyUsagePurpose, ExtendedKeyUsagePurpose, SanType\n};\n\n/// Builder for creating Certificate Signing Requests\n///\n/// This builder provides a fluent API for configuring and generating CSRs.\n/// It enforces the requirement that all CSRs must have a subject DN.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::csr::CsrBuilder;\n/// use mtls_at_lib::types::KeyUsage;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Create a CA CSR\n/// let ca_csr = CsrBuilder::new()\n///     .subject(\"CN=My Root CA,O=My Organization,C=US\")?\n///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n///     .is_ca(true)\n///     .build()?;\n///     \n/// // Create a server certificate CSR\n/// let server_csr = CsrBuilder::new()\n///     .subject(\"CN=server.example.com\")?\n///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n///     .build()?;\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug)]\npub struct CsrBuilder {\n    /// Subject Distinguished Name (required)\n    subject: Option\u003cDistinguishedName\u003e,\n    \n    /// Key Usage extension\n    key_usage: Option\u003cKeyUsage\u003e,\n    \n    /// Extended Key Usage extension\n    extended_key_usage: Vec\u003cExtendedKeyUsage\u003e,\n    \n    /// CA flag for BasicConstraints extension\n    is_ca: bool,\n    \n    /// Path length constraint for CA certificates\n    path_len_constraint: Option\u003cu8\u003e,\n    \n    /// Subject Alternative Names\n    subject_alt_names: Vec\u003cString\u003e,\n    \n    /// Optional custom key pair (if not provided, a new one will be generated)\n    key_pair: Option\u003cKeyPair\u003e,\n}\n\nimpl CsrBuilder {\n    /// Creates a new CSR builder\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// let builder = CsrBuilder::new();\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            subject: None,\n            key_usage: None,\n            extended_key_usage: Vec::new(),\n            is_ca: false,\n            path_len_constraint: None,\n            subject_alt_names: Vec::new(),\n            key_pair: None,\n        }\n    }\n    \n    /// Sets the subject Distinguished Name\n    ///\n    /// The subject is required for all CSRs.\n    ///\n    /// # Arguments\n    ///\n    /// * `dn` - Distinguished Name string (e.g., \"CN=example.com,O=My Org,C=US\")\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com,O=Example Inc,C=US\")?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn subject(mut self, dn: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        self.subject = Some(DistinguishedName::from_str(dn)?);\n        Ok(self)\n    }\n    \n    /// Sets a custom key pair to use for the CSR\n    ///\n    /// If not provided, a new ECDSA P-256 key pair will be generated automatically.\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - Private key in PKCS#8 PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use rcgen::KeyPair;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let key_pair = KeyPair::generate()?;\n    /// let key_pem = key_pair.serialize_pem();\n    ///\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .with_key(\u0026key_pem)?\n    ///     .build()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn with_key(mut self, key_pem: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        let key_pair = KeyPair::from_pem(key_pem)\n            .map_err(|e| CsrError::KeyGenerationFailed(format!(\"Invalid key: {}\", e)))?;\n        self.key_pair = Some(key_pair);\n        Ok(self)\n    }\n    \n    /// Sets the Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `usage` - KeyUsage flags (can be combined with `|`)\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn key_usage(mut self, usage: KeyUsage) -\u003e Self {\n        self.key_usage = Some(usage);\n        self\n    }\n    \n    /// Sets the Extended Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `ext_usage` - Vec of ExtendedKeyUsage values\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::ExtendedKeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH]);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn extended_key_usage(mut self, ext_usage: Vec\u003cExtendedKeyUsage\u003e) -\u003e Self {\n        self.extended_key_usage = ext_usage;\n        self\n    }\n    \n    /// Marks this CSR for a CA certificate\n    ///\n    /// This sets the CA flag in the BasicConstraints extension.\n    ///\n    /// # Arguments\n    ///\n    /// * `is_ca` - Whether this is for a CA certificate\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=My Root CA\")?\n    ///     .is_ca(true);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn is_ca(mut self, is_ca: bool) -\u003e Self {\n        self.is_ca = is_ca;\n        self\n    }\n    \n    /// Sets the path length constraint for CA certificates\n    ///\n    /// This restricts how many intermediate CAs can appear in a chain\n    /// below this CA.\n    ///\n    /// # Arguments\n    ///\n    /// * `path_len` - Maximum number of intermediate CAs\n    pub fn path_len_constraint(mut self, path_len: u8) -\u003e Self {\n        self.path_len_constraint = Some(path_len);\n        self\n    }\n    \n    /// Adds a Subject Alternative Name (SAN)\n    ///\n    /// # Arguments\n    ///\n    /// * `san` - DNS name, IP address, or URI\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .add_san(\"www.example.com\")\n    ///     .add_san(\"api.example.com\");\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn add_san(mut self, san: impl Into\u003cString\u003e) -\u003e Self {\n        self.subject_alt_names.push(san.into());\n        self\n    }\n    \n    /// Builds the CSR and generates a new key pair\n    ///\n    /// This generates a new ECDSA P-256 key pair, configures the certificate\n    /// parameters according to the builder settings, and creates a CSR.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - The subject DN is not set\n    /// - Key pair generation fails\n    /// - CSR serialization fails\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// // CSR is now ready to use\n    /// let pem = csr.to_pem();\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn build(self) -\u003e Result\u003cCsr, CsrError\u003e {\n        // Validate required fields\n        let subject = self.subject.ok_or_else(|| {\n            CsrError::InvalidSubjectName(\"Subject name is required\".to_string())\n        })?;\n        \n        // Use provided key pair or generate a new one (ECDSA P-256 for security and performance)\n        let key_pair = if let Some(kp) = self.key_pair {\n            kp\n        } else {\n            KeyPair::generate()\n                .map_err(|e| CsrError::KeyGenerationFailed(e.to_string()))?\n        };\n        \n        // Create certificate parameters\n        let mut params = CertificateParams::default();\n        \n        // Set subject DN - convert our DistinguishedName to rcgen format\n        params.distinguished_name = Self::convert_dn(\u0026subject)?;\n        \n        // Set Key Usage if specified\n        if let Some(ku) = self.key_usage {\n            params.key_usages = Self::convert_key_usage(ku);\n        }\n        \n        // Set Extended Key Usage if specified\n        if !self.extended_key_usage.is_empty() {\n            params.extended_key_usages = Self::convert_extended_key_usage(\u0026self.extended_key_usage);\n        }\n        \n        // Note: BasicConstraints (is_ca) is a certificate parameter, not a CSR parameter\n        // It will be set when the certificate is issued from this CSR\n        // We store it here for future use but don't include it in the CSR\n        \n        // Set Subject Alternative Names\n        if !self.subject_alt_names.is_empty() {\n            params.subject_alt_names = self.subject_alt_names.iter()\n                .map(|s| SanType::DnsName(s.clone().try_into().unwrap()))\n                .collect();\n        }\n        \n        // Generate CSR\n        let csr = params.serialize_request(\u0026key_pair)\n            .map_err(|e| CsrError::EncodingError(e.to_string()))?;\n        \n        Ok(Csr::new(csr.der().to_vec(), key_pair))\n    }\n    \n    /// Converts our DistinguishedName to rcgen's format\n    fn convert_dn(dn: \u0026DistinguishedName) -\u003e Result\u003cRcgenDn, CsrError\u003e {\n        let mut rcgen_dn = RcgenDn::new();\n        \n        // Parse the DN string and add components\n        // Our DistinguishedName stores raw string, so we need to parse it\n        let dn_str = dn.as_str();\n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {}, // Ignore unknown attributes\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n    \n    /// Converts our KeyUsage flags to rcgen's format\n    fn convert_key_usage(ku: KeyUsage) -\u003e Vec\u003cKeyUsagePurpose\u003e {\n        let mut purposes = Vec::new();\n        \n        if ku.contains(KeyUsage::digital_signature()) {\n            purposes.push(KeyUsagePurpose::DigitalSignature);\n        }\n        if ku.contains(KeyUsage::non_repudiation()) {\n            purposes.push(KeyUsagePurpose::ContentCommitment);\n        }\n        if ku.contains(KeyUsage::key_encipherment()) {\n            purposes.push(KeyUsagePurpose::KeyEncipherment);\n        }\n        if ku.contains(KeyUsage::data_encipherment()) {\n            purposes.push(KeyUsagePurpose::DataEncipherment);\n        }\n        if ku.contains(KeyUsage::key_agreement()) {\n            purposes.push(KeyUsagePurpose::KeyAgreement);\n        }\n        if ku.contains(KeyUsage::key_cert_sign()) {\n            purposes.push(KeyUsagePurpose::KeyCertSign);\n        }\n        if ku.contains(KeyUsage::crl_sign()) {\n            purposes.push(KeyUsagePurpose::CrlSign);\n        }\n        if ku.contains(KeyUsage::encipher_only()) {\n            purposes.push(KeyUsagePurpose::EncipherOnly);\n        }\n        if ku.contains(KeyUsage::decipher_only()) {\n            purposes.push(KeyUsagePurpose::DecipherOnly);\n        }\n        \n        purposes\n    }\n    \n    /// Converts our ExtendedKeyUsage to rcgen's format\n    fn convert_extended_key_usage(eku_list: \u0026[ExtendedKeyUsage]) -\u003e Vec\u003cExtendedKeyUsagePurpose\u003e {\n        eku_list.iter().map(|eku| {\n            if eku == \u0026ExtendedKeyUsage::SERVER_AUTH {\n                ExtendedKeyUsagePurpose::ServerAuth\n            } else if eku == \u0026ExtendedKeyUsage::CLIENT_AUTH {\n                ExtendedKeyUsagePurpose::ClientAuth\n            } else if eku == \u0026ExtendedKeyUsage::CODE_SIGNING {\n                ExtendedKeyUsagePurpose::CodeSigning\n            } else if eku == \u0026ExtendedKeyUsage::EMAIL_PROTECTION {\n                ExtendedKeyUsagePurpose::EmailProtection\n            } else if eku == \u0026ExtendedKeyUsage::TIME_STAMPING {\n                ExtendedKeyUsagePurpose::TimeStamping\n            } else {\n                ExtendedKeyUsagePurpose::OcspSigning\n            }\n        }).collect()\n    }\n}\n\nimpl Default for CsrBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::{KeyUsage, ExtendedKeyUsage};\n    use x509_parser::prelude::*;\n    \n    /// Helper to parse CSR DER\n    fn parse_csr(der: \u0026[u8]) -\u003e X509CertificationRequest\u003c'_\u003e {\n        let (_, csr) = X509CertificationRequest::from_der(der).expect(\"Failed to parse CSR\");\n        csr\n    }\n    \n    #[test]\n    fn test_basic_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n        assert!(!csr.to_der().is_empty());\n        \n        // Parse CSR and validate subject DN matches input\n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"test.example.com\", \"CN should match input\");\n    }\n    \n    #[test]\n    fn test_ca_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test Root CA,O=Test Org,C=US\").unwrap()\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .is_ca(true)\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        \n        // Parse CSR and validate subject DN matches input\n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Test Root CA\");\n        let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n        assert_eq!(o, \"Test Org\");\n        let c = subject.iter_country().next().unwrap().as_str().unwrap();\n        assert_eq!(c, \"US\");\n    }\n    \n    #[test]\n    fn test_server_csr_with_eku() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=server.example.com\").unwrap()\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(\"www.example.com\")\n            .add_san(\"api.example.com\")\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        assert!(!csr.private_key_pem().is_empty());\n    }\n    \n    #[test]\n    fn test_missing_subject_error() {\n        let result = CsrBuilder::new().build();\n        assert!(matches!(result, Err(CsrError::InvalidSubjectName(_))));\n    }\n    \n    #[test]\n    fn test_private_key_export() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.private_key_pem();\n        assert!(pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"));\n        \n        let der = csr.private_key_der();\n        assert!(!der.is_empty());\n    }\n    \n    #[test]\n    fn test_path_len_constraint() {\n        // Test CA CSR with path length constraint\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Intermediate CA,O=Test Org,C=US\").unwrap()\n            .is_ca(true)\n            .path_len_constraint(1)\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        \n        // Verify CSR was created successfully\n        let parsed = parse_csr(csr.to_der());\n        let cn = parsed.certification_request_info.subject\n            .iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Intermediate CA\");\n    }\n    \n    #[test]\n    fn test_path_len_constraint_zero() {\n        // Test CA CSR with path length constraint of 0 (no subordinate CAs allowed)\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Leaf CA,O=Test Org,C=US\").unwrap()\n            .is_ca(true)\n            .path_len_constraint(0)\n            .key_usage(KeyUsage::key_cert_sign())\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n    }\n    \n    #[test]\n    fn test_dn_state_and_locality_parsing() {\n        // Test parsing of State (ST and S) and Locality (L) DN components\n        let csr_st = CsrBuilder::new()\n            .subject(\"CN=Test Server,ST=California,L=San Francisco,O=Test Corp,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed_st = parse_csr(csr_st.to_der());\n        let subject_st = parsed_st.certification_request_info.subject;\n        \n        // Verify CN matches\n        let cn = subject_st.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Test Server\");\n        \n        // Verify State (ST) matches\n        let state = subject_st.iter_state_or_province().next().unwrap().as_str().unwrap();\n        assert_eq!(state, \"California\", \"State (ST) should match input\");\n        \n        // Verify Locality (L) matches\n        let locality = subject_st.iter_locality().next().unwrap().as_str().unwrap();\n        assert_eq!(locality, \"San Francisco\", \"Locality (L) should match input\");\n        \n        // Test with 'S' instead of 'ST' for state\n        let csr_s = CsrBuilder::new()\n            .subject(\"CN=Test Server 2,S=New York,L=New York City,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed_s = parse_csr(csr_s.to_der());\n        let subject_s = parsed_s.certification_request_info.subject;\n        \n        let state_s = subject_s.iter_state_or_province().next().unwrap().as_str().unwrap();\n        assert_eq!(state_s, \"New York\", \"State (S) should match input\");\n        \n        let locality_s = subject_s.iter_locality().next().unwrap().as_str().unwrap();\n        assert_eq!(locality_s, \"New York City\", \"Locality should match input\");\n    }\n    \n    #[test]\n    fn test_dn_with_unknown_attributes_ignored() {\n        // Test that unknown DN attributes are ignored without causing errors\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test,UNKNOWN=Value,O=Org,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        \n        // Verify known attributes are parsed correctly\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Test\");\n        let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n        assert_eq!(o, \"Org\");\n    }\n    \n    #[test]\n    fn test_extended_key_usage_fallback() {\n        // This test verifies the fallback behavior in convert_extended_key_usage\n        // While we can't directly test an unknown EKU value (since ExtendedKeyUsage is an enum),\n        // we can test that all known EKU values are correctly converted\n        let all_ekus = vec![\n            ExtendedKeyUsage::SERVER_AUTH,\n            ExtendedKeyUsage::CLIENT_AUTH,\n            ExtendedKeyUsage::CODE_SIGNING,\n            ExtendedKeyUsage::EMAIL_PROTECTION,\n            ExtendedKeyUsage::TIME_STAMPING,\n            ExtendedKeyUsage::OCSP_SIGNING,\n        ];\n        \n        let csr = CsrBuilder::new()\n            .subject(\"CN=test-all-eku.example.com\").unwrap()\n            .extended_key_usage(all_ekus)\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty(), \"CSR with all EKU types should be generated\");\n        \n        // Parse and verify CSR is valid\n        let parsed = parse_csr(csr.to_der());\n        let cn = parsed.certification_request_info.subject\n            .iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"test-all-eku.example.com\");\n    }\n    \n    #[test]\n    fn test_default_trait() {\n        // Test that Default::default() creates the same instance as new()\n        let builder1 = CsrBuilder::new();\n        let builder2 = CsrBuilder::default();\n        \n        // Both should successfully build a CSR with the same configuration\n        let csr1 = builder1.subject(\"CN=default-test.com\").unwrap().build().unwrap();\n        let csr2 = builder2.subject(\"CN=default-test.com\").unwrap().build().unwrap();\n        \n        assert!(!csr1.to_der().is_empty());\n        assert!(!csr2.to_der().is_empty());\n        \n        // Both CSRs should have the same subject\n        let parsed1 = parse_csr(csr1.to_der());\n        let parsed2 = parse_csr(csr2.to_der());\n        \n        let cn1 = parsed1.certification_request_info.subject.iter_common_name().next().unwrap().as_str().unwrap();\n        let cn2 = parsed2.certification_request_info.subject.iter_common_name().next().unwrap().as_str().unwrap();\n        \n        assert_eq!(cn1, cn2, \"Both builders should create CSRs with same subject\");\n    }\n    \n    #[test]\n    fn test_private_key_reference() {\n        // Test the private_key() method that returns a reference to KeyPair\n        let csr = CsrBuilder::new()\n            .subject(\"CN=key-ref-test.example.com\").unwrap()\n            .build().unwrap();\n            \n        // Get reference to private key\n        let key_ref = csr.private_key();\n        \n        // Verify we can serialize from the reference\n        let pem_from_ref = key_ref.serialize_pem();\n        assert!(pem_from_ref.starts_with(\"-----BEGIN PRIVATE KEY-----\"));\n        \n        // Verify it matches the direct method\n        let pem_direct = csr.private_key_pem();\n        assert_eq!(pem_from_ref, pem_direct, \"Key reference should match direct access\");\n        \n        // Verify DER format also matches\n        let der_from_ref = key_ref.serialize_der();\n        let der_direct = csr.private_key_der();\n        assert_eq!(der_from_ref, der_direct, \"DER from reference should match direct access\");\n    }\n}\n","traces":[{"line":76,"address":[2908336,2908647,2908653],"length":1,"stats":{"Line":62}},{"line":80,"address":[2919040],"length":1,"stats":{"Line":62}},{"line":83,"address":[2943721],"length":1,"stats":{"Line":63}},{"line":107,"address":[2919801,2919344],"length":1,"stats":{"Line":62}},{"line":108,"address":[2944032,2944089],"length":1,"stats":{"Line":124}},{"line":109,"address":[2909062],"length":1,"stats":{"Line":61}},{"line":137,"address":[2945102,2945075,2944448] r = csr.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.csr_der\n    }\n    \n    /// Returns the CSR in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// let pem = csr.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"CERTIFICATE REQUEST\", self.csr_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n    \n    /// Returns a reference to the private key\n    ///\n    /// # Security Warning\n    ///\n    /// The private key should be kept secure and never transmitted or logged.\n    pub fn private_key(\u0026self) -\u003e \u0026KeyPair {\n        \u0026self.key_pair\n    }\n    \n    /// Serializes the private key to PKCS#8 DER format\n    ///\n    /// # Security Warning\n    ///\n    /// This exports the private key. Use only when necessary and ensure\n    /// the output is properly protected.\n    pub fn private_key_der(\u0026self) -\u003e Vec\u003cu8\u003e {\n        self.key_pair.serialize_der()\n    }\n    \n    /// Serializes the private key to PKCS#8 PEM format\n    ///\n    /// # Security Warning\n    ///\n    /// This exports the private key. Use only when necessary and ensure\n    /// the output is properly protected.\n    pub fn private_key_pem(\u0026self) -\u003e String {\n        self.key_pair.serialize_pem()\n    }\n}\n","traces":[{"line":33,"address":[2879296],"length":1,"stats":{"Line":28}},{"line":54,"address":[3052816],"length":1,"stats":{"Line":35}},{"line":55,"addr lNumberError(String),\n\n    /// Public key mismatch error\n    #[error(\"Public key mismatch: {0}\")]\n    PublicKeyMismatch(String),\n}\n\n/// Errors that can occur during CRL (Certificate Revocation List) operations\n#[derive(Error, Debug)]\npub enum CrlError {\n    /// Missing required field\n    #[error(\"Missing required field: {0}\")]\n    MissingField(String),\n\n    /// Signing error\n    #[error(\"CRL signing failed: {0}\")]\n    SigningError(String),\n}","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","lib.rs"],"content":"//! # mtls_at_lib\n//!\n//! A safe, memory-safe Rust library for mTLS operations with comprehensive certificate management.\n//!\n//! This library provides fail-safe utilities for:\n//! - X.509 Certificate Signing Request (CSR) generation with Key Usage and Extended Key Usage extensions\n//! - Certificate issuance (both CA-signed and self-signed)\n//! - Certificate Revocation List (CRL) generation and validation\n//! - Certificate chain verification with CRL Distribution Point (CDP) support\n//! - Mutual TLS (mTLS) connections with comprehensive validation\n//!\n//! ## Design Principles\n//!\n//! - **Memory Safety**: 100% safe Rust with minimal FFI usage\n//! - **Type Safety**: Leverage Rust's type system to prevent misuse\n//! - **Fail-Safe Defaults**: Secure by default, explicit opt-in for weaker security\n//! - **Comprehensive Validation**: All certificates validated for expiry, revocation, key usage, and signatures\n//!\n//! ## Quick Start\n//!\n//! ### Creating a Certificate Signing Request\n//!\n//! ```rust\n//! use mtls_at_lib::csr::CsrBuilder;\n//! use mtls_at_lib::types::{KeyUsage, ExtendedKeyUsage};\n//!\n//! # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n//! // Create a CSR for a server certificate\n//! let csr = CsrBuilder::new()\n//!     .subject(\"CN=example.com,O=Example Corp,C=US\")?\n//!     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n//!     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n//!     .build()?;\n//! # Ok(())\n//! # }\n//! ```\n//!\n//! ### Creating a Self-Signed CA Certificate\n//!\n//! ```rust\n//! use mtls_at_lib::cert::CertificateBuilder;\n//! use mtls_at_lib::csr::CsrBuilder;\n//! use mtls_at_lib::types::KeyUsage;\n//!\n//! # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n//! // Create a CSR for root CA certificate\n//! let ca_csr = CsrBuilder::new()\n//!     .subject(\"CN=Root CA,O=Example Corp,C=US\")?\n//!     .is_ca(true)\n//!     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n//!     .build()?;\n//!\n//! // Create self-signed certificate from CSR\n//! let ca_cert = CertificateBuilder::new()\n//!     .from_csr(ca_csr.to_der())?\n//!     .signing_key(ca_csr.private_key_pem().to_string())\n//!     .build_self_signed()?;\n//! # Ok(())\n//! # }\n//! ```\n//!\n//! ## Features\n//!\n//! - `cdp-fetch`: Enable CRL fetching from distribution points (requires network access)\n//!\n//! ## Safety Guarantees\n//!\n//! All cryptographic operations use pure Rust implementations:\n//! - `rustls` for TLS 1.3\n//! - `rcgen` for certificate generation\n//! - `x509-parser` for certificate parsing\n//!\n//! No unsafe code in the public API surface. Any FFI usage is:\n//! - Minimal and well-documented\n//! - Memory-safety verified\n//! - Thoroughly tested\n\n#![deny(unsafe_code)]\n#![warn(missing_docs)]\n#![warn(clippy::all)]\npub mod error;\npub mod types;\npub mod csr;\npub mod cert;\npub mod crl;\n\npub use error::*;\npub use types::*;\npub use crl::*;","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","types.rs"],"content":"//! Common types used throughout the library\n//!\n//! This module defines type-safe wrappers for cryptographic concepts\n//! like Key Usage, Extended Key Usage, Distinguished Names, and Serial Numbers.\n\nuse std::fmt;\n\n/// Key Usage extension flags (RFC 5280, Section 4.2.1.3)\n///\n/// Defines the cryptographic operations for which a certificate's public key may be used.\n/// This is a critical extension for CA certificates.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::KeyUsage;\n///\n/// // For a server certificate\n/// let server_usage = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n///\n/// // For a CA certificate\n/// let ca_usage = KeyUsage::key_cert_sign() | KeyUsage::crl_sign();\n///\n/// // Check if a specific usage is set\n/// assert!(server_usage.contains(KeyUsage::digital_signature()));\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct KeyUsage(u16);\n\nimpl KeyUsage {\n    /// Digital signature (bit 0)\n    ///\n    /// Used for verifying digital signatures (excluding certificates and CRLs).\n    /// Required for TLS client and server authentication.\n    pub const fn digital_signature() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 0)\n    }\n\n    /// Non-repudiation / Content commitment (bit 1)\n    ///\n    /// Used for non-repudiation services which protect against false denial of actions.\n    pub const fn non_repudiation() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 1)\n    }\n\n    /// Key encipherment (bit 2)\n    ///\n    /// Used for encrypting keys for key transport.\n    /// Required for RSA key exchange in TLS 1.2.\n    pub const fn key_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 2)\n    }\n\n    /// Data encipherment (bit 3)\n    ///\n    /// Used for encrypting user data (rare in practice).\n    pub const fn data_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 3)\n    }\n\n    /// Key agreement (bit 4)\n    ///\n    /// Used for key agreement protocols like ECDH.\n    pub const fn key_agreement() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 4)\n    }\n\n    /// Key certificate sign (bit 5)\n    ///\n    /// **Required for CA certificates** to sign other certificates.\n    /// Must be marked as critical.\n    pub const fn key_cert_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 5)\n    }\n\n    /// CRL sign (bit 6)\n    ///\n    /// Required for certificates that sign Certificate Revocation Lists.\n    /// Typically used by CA certificates.\n    pub const fn crl_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 6)\n    }\n\n    /// Encipher only (bit 7)\n    ///\n    /// Only used with keyAgreement. Key is only used for enciphering data.\n    pub const fn encipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 7)\n    }\n\n    /// Decipher only (bit 8)\n    ///\n    /// Only used with keyAgreement. Key is only used for deciphering data.\n    pub const fn decipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 8)\n    }\n\n    /// Checks if this KeyUsage contains the specified usage\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// let usage = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n    /// assert!(usage.contains(KeyUsage::digital_signature()));\n    /// assert!(!usage.contains(KeyUsage::key_cert_sign()));\n    /// ```\n    pub const fn contains(self, other: KeyUsage) -\u003e bool {\n        (self.0 \u0026 other.0) == other.0\n    }\n\n    /// Returns the raw bit flags\n    pub const fn bits(self) -\u003e u16 {\n        self.0\n    }\n\n    /// Creates KeyUsage from raw bits\n    pub const fn from_bits(bits: u16) -\u003e Self {\n        KeyUsage(bits)\n    }\n}\n\n// Implement bitwise OR for combining key usage flags\nimpl std::ops::BitOr for KeyUsage {\n    type Output = Self;\n\n    fn bitor(self, rhs: Self) -\u003e Self::Output {\n        KeyUsage(self.0 | rhs.0)\n    }\n}\n\n/// Extended Key Usage extension (RFC 5280, Section 4.2.1.12)\n///\n/// Specifies the purposes for which the certified public key may be used.\n/// This provides more specific usage restrictions than Key Usage.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::ExtendedKeyUsage;\n///\n/// // For a server certificate\n/// let server_eku = vec![ExtendedKeyUsage::SERVER_AUTH];\n///\n/// // For a client certificate\n/// let client_eku = vec![ExtendedKeyUsage::CLIENT_AUTH];\n///\n/// // For both client and server\n/// let both_eku = vec![\n///     ExtendedKeyUsage::SERVER_AUTH,\n///     ExtendedKeyUsage::CLIENT_AUTH,\n/// ];\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ExtendedKeyUsage {\n    oid: \u0026'static str,\n    name: \u0026'static str,\n}\n\nimpl ExtendedKeyUsage {\n    /// TLS server authentication (OID: 1.3.6.1.5.5.7.3.1)\n    ///\n    /// Required for TLS server certificates.\n    pub const SERVER_AUTH: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.1\",\n        name: \"serverAuth\",\n    };\n\n    /// TLS client authentication (OID: 1.3.6.1.5.5.7.3.2)\n    ///\n    /// Required for TLS client certificates in mTLS.\n    pub const CLIENT_AUTH: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.2\",\n        name: \"clientAuth\",\n    };\n\n    /// Code signing (OID: 1.3.6.1.5.5.7.3.3)\n    pub const CODE_SIGNING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.3\",\n        name: \"codeSigning\",\n    };\n\n    /// Email protection (OID: 1.3.6.1.5.5.7.3.4)\n    ///\n    /// Used for S/MIME email encryption and signing.\n    pub const EMAIL_PROTECTION: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.4\",\n        name: \"emailProtection\",\n    };\n\n    /// Time stamping (OID: 1.3.6.1.5.5.7.3.8)\n    pub const TIME_STAMPING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.8\",\n        name: \"timeStamping\",\n    };\n\n    /// OCSP signing (OID: 1.3.6.1.5.5.7.3.9)\n    pub const OCSP_SIGNING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.9\",\n        name: \"ocspSigning\",\n    };\n\n    /// Returns the OID string\n    pub fn oid(\u0026self) -\u003e \u0026str {\n        self.oid\n    }\n\n    /// Returns the human-readable name\n    pub fn name(\u0026self) -\u003e \u0026str {\n        self.name\n    }\n}\n\nimpl fmt::Display for ExtendedKeyUsage {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{} ({})\", self.name, self.oid)\n    }\n}\n\n/// X.509 Distinguished Name\n///\n/// Represents an X.500 Distinguished Name used in certificate subjects and issuers.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::DistinguishedName;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// let dn = DistinguishedName::from_str(\"CN=example.com,O=Example Corp,C=US\")?;\n/// assert_eq!(dn.common_name(), Some(\"example.com\"));\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct DistinguishedName {\n    // Internal representation - to be implemented\n    raw: String,\n}\n\nimpl DistinguishedName {\n    /// Parses a Distinguished Name from string format\n    ///\n    /// # Format\n    ///\n    /// The string should be in the format: \"CN=name,O=org,C=country\"\n    ///\n    /// Supported attributes:\n    /// - CN: Common Name\n    /// - O: Organization\n    /// - OU: Organizational Unit\n    /// - C: Country\n    /// - ST: State/Province\n    /// - L: Locality\n    ///\n    /// # Errors\n    ///\n    /// Returns error if the DN string is malformed.\n    pub fn from_str(s: \u0026str) -\u003e Result\u003cSelf, crate::error::CsrError\u003e {\n        // Basic validation - detailed parsing to be implemented\n        if s.is_empty() {\n            return Err(crate::error::CsrError::InvalidSubjectName(\n                \"Distinguished name cannot be empty\".to_string(),\n            ));\n        }\n\n        Ok(DistinguishedName {\n            raw: s.to_string(),\n        })\n    }\n\n    /// Returns the Common Name (CN) if present\n    pub fn common_name(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        // Simplified extraction - to be properly implemented\n        self.raw\n            .split(',')\n            .find(|part| part.trim().starts_with(\"CN=\"))\n            .and_then(|cn_part| cn_part.split('=').nth(1))\n            .map(|s| s.trim())\n    }\n\n    /// Returns the raw DN string\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.raw\n    }\n}\n\nimpl fmt::Display for DistinguishedName {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.raw)\n    }\n}\n\n\n/// Revocation reason codes (RFC 5280, Section 5.3.1)\n///\n/// Indicates why a certificate was revoked.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum RevocationReason {\n    /// Unspecified reason (0)\n    Unspecified = 0,\n    \n    /// Private key has been compromised (1)\n    ///\n    /// **Critical**: Immediate revocation required.\n    /// Past signatures may be suspect.\n    KeyCompromise = 1,\n    \n    /// CA key has been compromised (2)\n    ///\n    /// **Critical**: All certificates issued by this CA are suspect.\n    CaCompromise = 2,\n    \n    /// Subject's affiliation has changed (3)\n    AffiliationChanged = 3,\n    \n    /// Certificate has been superseded (4)\n    Superseded = 4,\n    \n    /// Certificate is no longer needed (5)\n    CessationOfOperation = 5,\n    \n    /// Certificate is temporarily suspended (6)\n    ///\n    /// May be un-revoked later with removeFromCRL.\n    CertificateHold = 6,\n    \n    /// Remove from CRL (8)\n    ///\n    /// Un-revoke a certificate that was on hold.\n    RemoveFromCrl = 8,\n    \n    /// Privilege has been withdrawn (9)\n    PrivilegeWithdrawn = 9,\n    \n    /// Attribute Authority key compromised (10)\n    AaCompromise = 10,\n}\n\nimpl RevocationReason {\n    /// Unspecified revocation reason\n    pub const UNSPECIFIED: Self = Self::Unspecified;\n    \n    /// Private key has been compromised\n    pub const KEY_COMPROMISE: Self = Self::KeyCompromise;\n    \n    /// CA key has been compromised\n    pub const CA_COMPROMISE: Self = Self::CaCompromise;\n    \n    /// Subject's affiliation has changed\n    pub const AFFILIATION_CHANGED: Self = Self::AffiliationChanged;\n    \n    /// Certificate has been superseded\n    pub const SUPERSEDED: Self = Self::Superseded;\n    \n    /// Certificate is no longer needed\n    pub const CESSATION_OF_OPERATION: Self = Self::CessationOfOperation;\n    \n    /// Certificate is temporarily suspended\n    pub const CERTIFICATE_HOLD: Self = Self::CertificateHold;\n    \n    /// Remove from CRL\n    pub const REMOVE_FROM_CRL: Self = Self::RemoveFromCrl;\n    \n    /// Privilege has been withdrawn\n    pub const PRIVILEGE_WITHDRAWN: Self = Self::PrivilegeWithdrawn;\n    \n    /// Attribute Authority key compromised\n    pub const AA_COMPROMISE: Self = Self::AaCompromise;\n    \n    /// Returns the numeric code\n    pub const fn code(self) -\u003e u8 {\n        self as u8\n    }\n\n    /// Creates from numeric code\n    pub fn from_code(code: u8) -\u003e Option\u003cSelf\u003e {\n        match code {\n            0 =\u003e Some(RevocationReason::Unspecified),\n            1 =\u003e Some(RevocationReason::KeyCompromise),\n            2 =\u003e Some(RevocationReason::CaCompromise),\n            3 =\u003e Some(RevocationReason::AffiliationChanged),\n            4 =\u003e Some(RevocationReason::Superseded),\n            5 =\u003e Some(RevocationReason::CessationOfOperation),\n            6 =\u003e Some(RevocationReason::CertificateHold),\n            8 =\u003e Some(RevocationReason::RemoveFromCrl),\n            9 =\u003e Some(RevocationReason::PrivilegeWithdrawn),\n            10 =\u003e Some(RevocationReason::AaCompromise),\n            _ =\u003e None,\n        }\n    }\n}\n\nimpl fmt::Display for RevocationReason {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        let name = match self {\n            RevocationReason::Unspecified =\u003e \"Unspecified\",\n            RevocationReason::KeyCompromise =\u003e \"Key Compromise\",\n            RevocationReason::CaCompromise =\u003e \"CA Compromise\",\n            RevocationReason::AffiliationChanged =\u003e \"Affiliation Changed\",\n            RevocationReason::Superseded =\u003e \"Superseded\",\n            RevocationReason::CessationOfOperation =\u003e \"Cessation of Operation\",\n            RevocationReason::CertificateHold =\u003e \"Certificate Hold\",\n            RevocationReason::RemoveFromCrl =\u003e \"Remove from CRL\",\n            RevocationReason::PrivilegeWithdrawn =\u003e \"Privilege Withdrawn\",\n            RevocationReason::AaCompromise =\u003e \"AA Compromise\",\n        };\n        write!(f, \"{}\", name)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    // KeyUsage tests\n    #[test]\n    fn test_key_usage_bits() {\n        // Test that bits() returns the correct raw value\n        let ku = KeyUsage::digital_signature();\n        assert_eq!(ku.bits(), 1, \"digital_signature should have bit value 1\");\n\n        let ku = KeyUsage::key_cert_sign();\n        assert_eq!(ku.bits(), 32, \"key_cert_sign should have bit value 32 (1 \u003c\u003c 5)\");\n\n        let combined = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n        assert_eq!(combined.bits(), 5, \"Combined flags should have value 5 (1 | 4)\");\n    }\n\n    #[test]\n    fn test_key_usage_from_bits() {\n        // Test creating KeyUsage from raw bits\n        let ku = KeyUsage::from_bits(1);\n        assert_eq!(ku.bits(), 1, \"from_bits(1) should create digital_signature\");\n        assert!(ku.contains(KeyUsage::digital_signature()));\n\n        let ku = KeyUsage::from_bits(32);\n        assert_eq!(ku.bits(), 32, \"from_bits(32) should create key_cert_sign\");\n        assert!(ku.contains(KeyUsage::key_cert_sign()));\n\n        // Test combined bits\n        let ku = KeyUsage::from_bits(5); // digital_signature | key_encipherment\n        assert!(ku.contains(KeyUsage::digital_signature()));\n        assert!(ku.contains(KeyUsage::key_encipherment()));\n        assert!(!ku.contains(KeyUsage::crl_sign()));\n    }\n\n    #[test]\n    fn test_key_usage_bits_roundtrip() {\n        // Test that bits() and from_bits() are inverses\n        let original = KeyUsage::digital_signature() | KeyUsage::key_cert_sign() | KeyUsage::crl_sign();\n        let bits = original.bits();\n        let reconstructed = KeyUsage::from_bits(bits);\n        \n        assert_eq!(original.bits(), reconstructed.bits(), \"Roundtrip should preserve bits\");\n        assert!(reconstructed.contains(KeyUsage::digital_signature()));\n        assert!(reconstructed.contains(KeyUsage::key_cert_sign()));\n        assert!(reconstructed.contains(KeyUsage::crl_sign()));\n    }\n\n    #[test]\n    fn test_key_usage_all_flags_bits() {\n        // Test all individual flag bit values\n        assert_eq!(KeyUsage::digital_signature().bits(), 1);\n        assert_eq!(KeyUsage::non_repudiation().bits(), 2);\n        assert_eq!(KeyUsage::key_encipherment().bits(), 4);\n        assert_eq!(KeyUsage::data_encipherment().bits(), 8);\n        assert_eq!(KeyUsage::key_agreement().bits(), 16);\n        assert_eq!(KeyUsage::key_cert_sign().bits(), 32);\n        assert_eq!(KeyUsage::crl_sign().bits(), 64);\n        assert_eq!(KeyUsage::encipher_only().bits(), 128);\n        assert_eq!(KeyUsage::decipher_only().bits(), 256);\n    }\n\n    // ExtendedKeyUsage tests\n    #[test]\n    fn test_extended_key_usage_oid() {\n        // Test that oid() returns the correct OID string\n        assert_eq!(ExtendedKeyUsage::SERVER_AUTH.oid(), \"1.3.6.1.5.5.7.3.1\");\n        assert_eq!(ExtendedKeyUsage::CLIENT_AUTH.oid(), \"1.3.6.1.5.5.7.3.2\");\n        assert_eq!(ExtendedKeyUsage::CODE_SIGNING.oid(), \"1.3.6.1.5.5.7.3.3\");\n        assert_eq!(ExtendedKeyUsage::EMAIL_PROTECTION.oid(), \"1.3.6.1.5.5.7.3.4\");\n        assert_eq!(ExtendedKeyUsage::TIME_STAMPING.oid(), \"1.3.6.1.5.5.7.3.8\");\n        assert_eq!(ExtendedKeyUsage::OCSP_SIGNING.oid(), \"1.3.6.1.5.5.7.3.9\");\n    }\n\n    #[test]\n    fn test_extended_key_usage_name() {\n        // Test that name() returns the correct human-readable name\n        assert_eq!(ExtendedKeyUsage::SERVER_AUTH.name(), \"serverAuth\");\n        assert_eq!(ExtendedKeyUsage::CLIENT_AUTH.name(), \"clientAuth\");\n        assert_eq!(ExtendedKeyUsage::CODE_SIGNING.name(), \"codeSigning\");\n        assert_eq!(ExtendedKeyUsage::EMAIL_PROTECTION.name(), \"emailProtection\");\n        assert_eq!(ExtendedKeyUsage::TIME_STAMPING.name(), \"timeStamping\");\n        assert_eq!(ExtendedKeyUsage::OCSP_SIGNING.name(), \"ocspSigning\");\n    }\n\n    #[test]\n    fn test_extended_key_usage_display() {\n        // Test the Display trait implementation\n        let server_auth = ExtendedKeyUsage::SERVER_AUTH;\n        let display_str = format!(\"{}\", server_auth);\n        assert_eq!(display_str, \"serverAuth (1.3.6.1.5.5.7.3.1)\");\n\n        let client_auth = ExtendedKeyUsage::CLIENT_AUTH;\n        let display_str = format!(\"{}\", client_auth);\n        assert_eq!(display_str, \"clientAuth (1.3.6.1.5.5.7.3.2)\");\n\n        let code_signing = ExtendedKeyUsage::CODE_SIGNING;\n        let display_str = format!(\"{}\", code_signing);\n        assert_eq!(display_str, \"codeSigning (1.3.6.1.5.5.7.3.3)\");\n    }\n\n    #[test]\n    fn test_extended_key_usage_all_types_display() {\n        // Test Display for all EKU types\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::SERVER_AUTH), \"serverAuth (1.3.6.1.5.5.7.3.1)\");\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::CLIENT_AUTH), \"clientAuth (1.3.6.1.5.5.7.3.2)\");\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::CODE_SIGNING), \"codeSigning (1.3.6.1.5.5.7.3.3)\");\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::EMAIL_PROTECTION), \"emailProtection (1.3.6.1.5.5.7.3.4)\");\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::TIME_STAMPING), \"timeStamping (1.3.6.1.5.5.7.3.8)\");\n        assert_eq!(format!(\"{}\", ExtendedKeyUsage::OCSP_SIGNING), \"ocspSigning (1.3.6.1.5.5.7.3.9)\");\n    }\n\n    // DistinguishedName tests\n    #[test]\n    fn test_distinguished_name_common_name() {\n        // Test extracting common name from DN\n        let dn = DistinguishedName::from_str(\"CN=example.com,O=Example Corp,C=US\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(dn.common_name(), Some(\"example.com\"));\n\n        // Test with spaces\n        let dn = DistinguishedName::from_str(\"CN=test.example.com, O=Test Org, C=US\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(dn.common_name(), Some(\"test.example.com\"));\n\n        // Test with only CN\n        let dn = DistinguishedName::from_str(\"CN=simple.com\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(dn.common_name(), Some(\"simple.com\"));\n    }\n\n    #[test]\n    fn test_distinguished_name_common_name_missing() {\n        // Test DN without CN\n        let dn = DistinguishedName::from_str(\"O=Example Corp,C=US\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(dn.common_name(), None, \"DN without CN should return None\");\n    }\n\n    #[test]\n    fn test_distinguished_name_common_name_with_complex_dn() {\n        // Test with full DN including state and locality\n        let dn = DistinguishedName::from_str(\"CN=server.example.com,OU=IT,O=Example Corp,L=San Francisco,ST=California,C=US\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(dn.common_name(), Some(\"server.example.com\"));\n    }\n\n    #[test]\n    fn test_distinguished_name_display() {\n        // Test the Display trait implementation\n        let dn = DistinguishedName::from_str(\"CN=example.com,O=Example Corp,C=US\")\n            .expect(\"Failed to parse DN\");\n        let display_str = format!(\"{}\", dn);\n        assert_eq!(display_str, \"CN=example.com,O=Example Corp,C=US\");\n\n        // Test with different DN format\n        let dn = DistinguishedName::from_str(\"CN=test.com\")\n            .expect(\"Failed to parse DN\");\n        assert_eq!(format!(\"{}\", dn), \"CN=test.com\");\n    }\n\n    #[test]\n    fn test_distinguished_name_display_preserves_format() {\n        // Test that Display preserves the original format\n        let original = \"CN=server.example.com,OU=Engineering,O=Tech Corp,L=New York,ST=NY,C=US\";\n        let dn = DistinguishedName::from_str(original)\n            .expect(\"Failed to parse DN\");\n        assert_eq!(format!(\"{}\", dn), original, \"Display should preserve original format\");\n    }\n\n    // RevocationReason tests\n    #[test]\n    fn test_revocation_reason_code() {\n        // Test that code() returns the correct numeric code\n        assert_eq!(RevocationReason::Unspecified.code(), 0);\n        assert_eq!(RevocationReason::KeyCompromise.code(), 1);\n        assert_eq!(RevocationReason::CaCompromise.code(), 2);\n        assert_eq!(RevocationReason::AffiliationChanged.code(), 3);\n        assert_eq!(RevocationReason::Superseded.code(), 4);\n        assert_eq!(RevocationReason::CessationOfOperation.code(), 5);\n        assert_eq!(RevocationReason::CertificateHold.code(), 6);\n        assert_eq!(RevocationReason::RemoveFromCrl.code(), 8);\n        assert_eq!(RevocationReason::PrivilegeWithdrawn.code(), 9);\n        assert_eq!(RevocationReason::AaCompromise.code(), 10);\n    }\n\n    #[test]\n    fn test_revocation_reason_from_code() {\n        // Test creating RevocationReason from code\n        assert_eq!(RevocationReason::from_code(0), Some(RevocationReason::Unspecified));\n        assert_eq!(RevocationReason::from_code(1), Some(RevocationReason::KeyCompromise));\n        assert_eq!(RevocationReason::from_code(2), Some(RevocationReason::CaCompromise));\n        assert_eq!(RevocationReason::from_code(3), Some(RevocationReason::AffiliationChanged));\n        assert_eq!(RevocationReason::from_code(4), Some(RevocationReason::Superseded));\n        assert_eq!(RevocationReason::from_code(5), Some(RevocationReason::CessationOfOperation));\n        assert_eq!(RevocationReason::from_code(6), Some(RevocationReason::CertificateHold));\n        assert_eq!(RevocationReason::from_code(8), Some(RevocationReason::RemoveFromCrl));\n        assert_eq!(RevocationReason::from_code(9), Some(RevocationReason::PrivilegeWithdrawn));\n        assert_eq!(RevocationReason::from_code(10), Some(RevocationReason::AaCompromise));\n\n        // Test invalid codes\n        assert_eq!(RevocationReason::from_code(7), None, \"Code 7 is not defined\");\n        assert_eq!(RevocationReason::from_code(11), None, \"Code 11 is not defined\");\n        assert_eq!(RevocationReason::from_code(255), None, \"Invalid code should return None\");\n    }\n\n    #[test]\n    fn test_revocation_reason_code_roundtrip() {\n        // Test that code() and from_code() are inverses\n        let reasons = vec![\n            RevocationReason::Unspecified,\n            RevocationReason::KeyCompromise,\n            RevocationReason::CaCompromise,\n            RevocationReason::AffiliationChanged,\n            RevocationReason::Superseded,\n            RevocationReason::CessationOfOperation,\n            RevocationReason::CertificateHold,\n            RevocationReason::RemoveFromCrl,\n            RevocationReason::PrivilegeWithdrawn,\n            RevocationReason::AaCompromise,\n        ];\n\n        for reason in reasons {\n            let code = reason.code();\n            let reconstructed = RevocationReason::from_code(code);\n            assert_eq!(reconstructed, Some(reason), \"Roundtrip should preserve reason\");\n        }\n    }\n\n    #[test]\n    fn test_revocation_reason_display() {\n        // Test the Display trait implementation\n        assert_eq!(format!(\"{}\", RevocationReason::Unspecified), \"Unspecified\");\n        assert_eq!(format!(\"{}\", RevocationReason::KeyCompromise), \"Key Compromise\");\n        assert_eq!(format!(\"{}\", RevocationReason::CaCompromise), \"CA Compromise\");\n        assert_eq!(format!(\"{}\", RevocationReason::AffiliationChanged), \"Affiliation Changed\");\n        assert_eq!(format!(\"{}\", RevocationReason::Superseded), \"Superseded\");\n        assert_eq!(format!(\"{}\", RevocationReason::CessationOfOperation), \"Cessation of Operation\");\n        assert_eq!(format!(\"{}\", RevocationReason::CertificateHold), \"Certificate Hold\");\n        assert_eq!(format!(\"{}\", RevocationReason::RemoveFromCrl), \"Remove from CRL\");\n        assert_eq!(format!(\"{}\", RevocationReason::PrivilegeWithdrawn), \"Privilege Withdrawn\");\n        assert_eq!(format!(\"{}\", RevocationReason::AaCompromise), \"AA Compromise\");\n    }\n\n    #[test]\n    fn test_revocation_reason_constants() {\n        // Test that the constant aliases match their enum values\n        assert_eq!(RevocationReason::UNSPECIFIED, RevocationReason::Unspecified);\n        assert_eq!(RevocationReason::KEY_COMPROMISE, RevocationReason::KeyCompromise);\n        assert_eq!(RevocationReason::CA_COMPROMISE, RevocationReason::CaCompromise);\n        assert_eq!(RevocationReason::AFFILIATION_CHANGED, RevocationReason::AffiliationChanged);\n        assert_eq!(RevocationReason::SUPERSEDED, RevocationReason::Superseded);\n        assert_eq!(RevocationReason::CESSATION_OF_OPERATION, RevocationReason::CessationOfOperation);\n        assert_eq!(RevocationReason::CERTIFICATE_HOLD, RevocationReason::CertificateHold);\n        assert_eq!(RevocationReason::REMOVE_FROM_CRL, RevocationReason::RemoveFromCrl);\n        assert_eq!(RevocationReason::PRIVILEGE_WITHDRAWN, RevocationReason::PrivilegeWithdrawn);\n        assert_eq!(RevocationReason::AA_COMPROMISE, RevocationReason::AaCompromise);\n    }\n}","traces":[{"line":109,"address":[2916176],"length":1,"stats":{"Line":23}},{"line":110,"address":[2864752],"length":1,"stats":{"Line":36}},{"line":114,"address":[2951504],"length":1,"stats":{"Line":1}},{"line":119,"address":[2916224],"leng
