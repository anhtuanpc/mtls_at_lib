\n}\n\n#[test]\nfn test_csr_private_key_reference() {\n    use rcgen::KeyPair;\n    \n    // Generate a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=key-reference-test.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR\");\n    \n    // Get reference to the private key\n    let key_ref = csr.private_key();\n    \n    // Verify we can use the reference to serialize the key\n    let pem_from_ref = key_ref.serialize_pem();\n    assert!(pem_from_ref.starts_with(\"-----BEGIN PRIVATE KEY-----\"), \n            \"Key from reference should serialize to valid PEM\");\n    \n    // Verify it matches the direct method\n    let pem_direct = csr.private_key_pem();\n    assert_eq!(pem_from_ref, pem_direct, \n               \"Key reference should provide same data as direct method\");\n    \n    // Test DER format too\n    let der_from_ref = key_ref.serialize_der();\n    let der_direct = csr.private_key_der();\n    assert_eq!(der_from_ref, der_direct, \n               \"DER from reference should match direct access\");\n    \n    // Verify we can create another key from the PEM and they're equivalent\n    let key_pair_reconstructed = KeyPair::from_pem(\u0026pem_from_ref)\n        .expect(\"Should be able to reconstruct key from PEM\");\n    let reconstructed_pem = key_pair_reconstructed.serialize_pem();\n    assert_eq!(pem_from_ref, reconstructed_pem, \n               \"Reconstructed key should match original\");\n    \n    println!(\"✓ private_key() reference method works correctly\");\n}","traces":[],"covered":0,"coverable":0}]};
        var previousData = {"files":[{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","cert","builder.rs"],"content":"//! Certificate Builder for constructing X.509 certificates\n//!\n//! This module provides a type-safe builder API for creating both self-signed\n//! certificates and CA-signed certificates from CSRs.\n\nuse crate::error::CertError;\nuse super::Certificate;\n\nuse rcgen::{\n    CertificateParams, CertificateSigningRequestParams, Issuer, KeyPair, PublicKeyData\n};\n\n/// Builder for creating certificates from CSRs\n///\n/// This builder allows creating either self-signed certificates or CA-signed certificates\n/// from Certificate Signing Requests (CSRs). The builder maintains CSR parameters and\n/// signing key information.\n#[derive(Debug)]\npub struct CertificateBuilder {\n    signing_key: Option\u003cString\u003e,\n    csr_params: Option\u003cCertificateSigningRequestParams\u003e,\n    /// Not Before timestamp (certificate validity start time)\n    not_before: Option\u003cstd::time::SystemTime\u003e,\n    /// Not After timestamp (certificate validity end time)\n    not_after: Option\u003cstd::time::SystemTime\u003e,\n    /// CRL Distribution Points URIs\n    crl_distribution_points: Vec\u003cString\u003e,\n}\n\nimpl CertificateBuilder {\n    /// Creates a builder for a certificate from a CSR\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            signing_key: None,\n            csr_params: None,\n            not_before: None,\n            not_after: None,\n            crl_distribution_points: Vec::new(),\n        }\n    }\n    \n    /// Loads certificate parameters from a CSR in DER format\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_der` - The CSR in DER format\n    pub fn from_der(mut self, csr_der: \u0026[u8]) -\u003e Result\u003cSelf, CertError\u003e {\n        let csr_der_ref = csr_der.into();\n        let csr_params = CertificateSigningRequestParams::from_der(\u0026csr_der_ref)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR DER: {}\", e)))?;\n        \n        self.csr_params = Some(csr_params);\n        Ok(self)\n    }\n    \n    /// Loads certificate parameters from a CSR in PEM format\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_pem` - The CSR in PEM format\n    pub fn from_pem(self, csr_pem: \u0026str) -\u003e Result\u003cSelf, CertError\u003e {\n        // Parse PEM to get DER\n        let pem_data = pem::parse(csr_pem)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR PEM: {}\", e)))?;\n        \n        self.from_der(\u0026pem_data.contents())\n    }\n    \n    /// Convenience method for from_der\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_der` - The CSR in DER format\n    pub fn from_csr(self, csr_der: \u0026[u8]) -\u003e Result\u003cSelf, CertError\u003e {\n        self.from_der(csr_der)\n    }\n    \n    /// Sets the signing key for the certificate\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - The private key in PKCS#8 PEM format\n    pub fn signing_key(mut self, key_pem: String) -\u003e Self {\n        self.signing_key = Some(key_pem);\n        self\n    }\n    \n    /// Sets the Not Before timestamp (certificate validity start time)\n    ///\n    /// # Arguments\n    ///\n    /// * `not_before` - SystemTime when the certificate becomes valid\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use std::time::SystemTime;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let now = SystemTime::now();\n    /// let builder = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .not_before(now);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn not_before(mut self, not_before: std::time::SystemTime) -\u003e Self {\n        self.not_before = Some(not_before);\n        self\n    }\n    \n    /// Sets the Not After timestamp (certificate validity end time)\n    ///\n    /// # Arguments\n    ///\n    /// * `not_after` - SystemTime when the certificate expires\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use std::time::{SystemTime, Duration};\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let expiry = SystemTime::now() + Duration::from_secs(365 * 24 * 60 * 60);\n    /// let builder = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .not_after(expiry);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn not_after(mut self, not_after: std::time::SystemTime) -\u003e Self {\n        self.not_after = Some(not_after);\n        self\n    }\n    \n    /// Sets the validity period using a duration from now\n    ///\n    /// This is a convenience method that sets both not_before (to now) and\n    /// not_after (to now + duration).\n    ///\n    /// # Arguments\n    ///\n    /// * `duration` - How long the certificate should be valid\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use std::time::Duration;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let builder = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .validity_duration(Duration::from_secs(365 * 24 * 60 * 60)); // 1 year\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn validity_duration(mut self, duration: std::time::Duration) -\u003e Self {\n        let now = std::time::SystemTime::now();\n        self.not_before = Some(now);\n        self.not_after = Some(now + duration);\n        self\n    }\n    \n    /// Adds a CRL Distribution Point URI\n    ///\n    /// CRL Distribution Points specify where to obtain CRLs for checking\n    /// certificate revocation status.\n    ///\n    /// # Arguments\n    ///\n    /// * `uri` - URI of the CRL distribution point (e.g., \"http://crl.example.com/ca.crl\")\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let builder = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .add_crl_distribution_point(\"http://crl.example.com/ca.crl\")\n    ///     .add_crl_distribution_point(\"ldap://ldap.example.com/cn=CA,dc=example,dc=com\");\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn add_crl_distribution_point(mut self, uri: impl Into\u003cString\u003e) -\u003e Self {\n        self.crl_distribution_points.push(uri.into());\n        self\n    }\n    \n    /// Sets multiple CRL Distribution Point URIs\n    ///\n    /// # Arguments\n    ///\n    /// * `uris` - Vector of CRL distribution point URIs\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let builder = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .crl_distribution_points(vec![\n    ///         \"http://crl.example.com/ca.crl\".to_string(),\n    ///         \"http://backup-crl.example.com/ca.crl\".to_string(),\n    ///     ]);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn crl_distribution_points(mut self, uris: Vec\u003cString\u003e) -\u003e Self {\n        self.crl_distribution_points = uris;\n        self\n    }\n    \n    /// Builds a self-signed certificate\n    ///\n    /// For self-signed certificates, the public key in the CSR and the public key\n    /// extracted from the signing key must be identical.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys don't match\n    pub fn build_self_signed(self) -\u003e Result\u003cCertificate, CertError\u003e {\n        // Extract fields before consuming self\n        let not_before = self.not_before;\n        let not_after = self.not_after;\n        let crl_dps = self.crl_distribution_points.clone();\n        \n        let (mut csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // Apply validity period if specified\n        if let Some(nb) = not_before {\n            csr_params.params.not_before = Self::time_to_offset_datetime(nb)?;\n        }\n        if let Some(na) = not_after {\n            csr_params.params.not_after = Self::time_to_offset_datetime(na)?;\n        }\n        \n        // Apply CRL Distribution Points if specified\n        if !crl_dps.is_empty() {\n            use rcgen::CrlDistributionPoint;\n            csr_params.params.crl_distribution_points = crl_dps.iter()\n                .map(|uri| CrlDistributionPoint { uris: vec![uri.clone()] })\n                .collect();\n        }\n        \n        // Note: For self-signed certificates, the caller must ensure that the signing_key\n        // provided is the same key that was used to create the CSR. The CSR contains\n        // the public key, and the signing_key must have the matching private key.\n        // rcgen will use the CSR's public key in the certificate.\n        \n        // Create issuer with the same DN as the subject (self-signed)\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = csr_params.params.distinguished_name.clone();\n        let issuer = Issuer::new(issuer_params, \u0026signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026signing_key_pair) == false {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR does not match signing key\".to_string()\n            ));\n        }\n        \n        // Sign the certificate\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate with the private key\n        Ok(Certificate::new(cert_der, Some(signing_key_pem)))\n    }\n    \n    /// Builds a CA-signed or ICA-signed certificate\n    ///\n    /// For CA/ICA-signed certificates, the public key in the CSR and the public key\n    /// extracted from the CA/ICA signing key must be different.\n    ///\n    /// # Arguments\n    ///\n    /// * `ca_issuer_dn` - The issuer Distinguished Name (from CA certificate)\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys are identical (would be self-signed)\n    pub fn build_ca_signed(self, ca_issuer_dn: \u0026str) -\u003e Result\u003cCertificate, CertError\u003e {\n        // Extract fields before consuming self\n        let not_before = self.not_before;\n        let not_after = self.not_after;\n        let crl_dps = self.crl_distribution_points.clone();\n        \n        let (mut csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let ca_signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // Apply validity period if specified\n        if let Some(nb) = not_before {\n            csr_params.params.not_before = Self::time_to_offset_datetime(nb)?;\n        }\n        if let Some(na) = not_after {\n            csr_params.params.not_after = Self::time_to_offset_datetime(na)?;\n        }\n        \n        // Apply CRL Distribution Points if specified\n        if !crl_dps.is_empty() {\n            use rcgen::CrlDistributionPoint;\n            csr_params.params.crl_distribution_points = crl_dps.iter()\n                .map(|uri| CrlDistributionPoint { uris: vec![uri.clone()] })\n                .collect();\n        }\n        \n        // For CA-signed certificates, the CSR's public key should be different from CA's key\n        // Since rcgen doesn't expose direct public key comparison from CSR, we rely on\n        // the signing process which will use the CSR's embedded public key\n        \n        // Parse CA's distinguished name and create issuer\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = Self::parse_dn_string(ca_issuer_dn)?;\n        let issuer = Issuer::new(issuer_params, \u0026ca_signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026ca_signing_key_pair) {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR matches CA signing key; expected different keys for CA-signed cert\".to_string()\n            ));\n        }\n        \n        // Sign the certificate with CA's key\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate without private key (it stays with CSR creator)\n        Ok(Certificate::new(cert_der, None))\n    }\n\n    fn is_identical_pubkey(k1: \u0026impl PublicKeyData, k2: \u0026impl PublicKeyData) -\u003e bool {\n        let pk1 = k1.der_bytes();\n        let pk2 = k2.der_bytes();\n        pk1 == pk2\n    }\n    \n    /// Validates required fields and extracts CSR params and signing key\n    fn validate_and_extract(self) -\u003e Result\u003c(CertificateSigningRequestParams, String), CertError\u003e {\n        let csr_params = self.csr_params\n            .ok_or_else(|| CertError::MissingField(\"CSR parameters required\".to_string()))?;\n        \n        let signing_key_pem = self.signing_key\n            .ok_or_else(|| CertError::MissingField(\"Signing key required\".to_string()))?;\n        \n        Ok((csr_params, signing_key_pem))\n    }\n    \n    /// Parses a PEM-encoded private key\n    fn parse_key(key_pem: \u0026str) -\u003e Result\u003cKeyPair, CertError\u003e {\n        KeyPair::from_pem(key_pem)\n            .map_err(|e| CertError::SigningError(format!(\"Invalid signing key: {}\", e)))\n    }\n    \n    /// Helper function to convert SystemTime to OffsetDateTime for rcgen\n    fn time_to_offset_datetime(time: std::time::SystemTime) -\u003e Result\u003ctime::OffsetDateTime, CertError\u003e {\n        use time::OffsetDateTime;\n        \n        let duration = time.duration_since(std::time::UNIX_EPOCH)\n            .map_err(|e| CertError::SigningError(format!(\"Time before UNIX epoch: {}\", e)))?;\n        \n        OffsetDateTime::from_unix_timestamp(duration.as_secs() as i64)\n            .map_err(|e| CertError::SigningError(format!(\"Invalid timestamp: {}\", e)))\n    }\n    \n    /// Helper function to parse DN string into rcgen format\n    fn parse_dn_string(dn_str: \u0026str) -\u003e Result\u003crcgen::DistinguishedName, CertError\u003e {\n        use rcgen::{DistinguishedName as RcgenDn, DnType};\n        \n        let mut rcgen_dn = RcgenDn::new();\n        \n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {},\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::csr::CsrBuilder;\n    use x509_parser::prelude::*;\n    \n    /// Helper function to create a test CSR with its key\n    fn create_test_csr() -\u003e Result\u003c(Vec\u003cu8\u003e, String, String), Box\u003cdyn std::error::Error\u003e\u003e {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com,O=Test Org,C=US\")?\n            .build()?;\n        \n        Ok((csr.to_der().to_vec(), csr.private_key_pem().to_string(), csr.to_pem()))\n    }\n    \n    /// Helper function to create a CA certificate and key\n    fn create_ca_cert() -\u003e Result\u003c(String, String), Box\u003cdyn std::error::Error\u003e\u003e {\n        let ca_csr = CsrBuilder::new()\n            .subject(\"CN=Test CA,O=Test CA Org,C=US\")?\n            .build()?;\n        \n        let ca_cert = CertificateBuilder::new()\n            .from_csr(ca_csr.to_der())?\n            .signing_key(ca_csr.private_key_pem().to_string())\n            .build_self_signed()?;\n        \n        Ok((ca_csr.private_key_pem().to_string(), ca_cert.to_pem()))\n    }\n    \n    /// Helper function to parse certificate DER\n    fn parse_cert(der: \u0026[u8]) -\u003e X509Certificate\u003c'_\u003e {\n        let (_, cert) = X509Certificate::from_der(der).expect(\"Failed to parse certificate\");\n        cert\n    }\n    \n    #[test]\n    fn test_new_builder() {\n        let builder = CertificateBuilder::new();\n        assert!(builder.signing_key.is_none());\n        assert!(builder.csr_params.is_none());\n    }\n    \n    #[test]\n    fn test_from_der_valid() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_der(\u0026csr_der);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_der_invalid() {\n        let invalid_der = vec![0x00, 0x01, 0x02, 0x03];\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026invalid_der);\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::InvalidName(msg)) =\u003e {\n                assert!(msg.contains(\"Failed to parse CSR DER\"));\n            }\n            _ =\u003e panic!(\"Expected InvalidName error\"),\n        }\n    }\n    \n    #[test]\n    fn test_from_pem_valid() {\n        let (_, _, csr_pem) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_pem(\u0026csr_pem);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_pem_invalid() {\n        let invalid_pem = \"-----BEGIN CERTIFICATE REQUEST-----\\nInvalidData\\n-----END CERTIFICATE REQUEST-----\";\n        \n        let result = CertificateBuilder::new()\n            .from_pem(invalid_pem);\n        \n        assert!(result.is_err());\n    }\n    \n    #[test]\n    fn test_from_csr_valid() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_csr(\u0026csr_der);\n        \n        assert!(builder.is_ok());\n        assert!(builder.unwrap().csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_signing_key() {\n        let test_key = \"test_key_pem\".to_string();\n        let builder = CertificateBuilder::new()\n            .signing_key(test_key.clone());\n        \n        assert_eq!(builder.signing_key, Some(test_key));\n    }\n    \n    #[test]\n    fn test_build_self_signed_success() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed();\n        \n        assert!(cert.is_ok());\n        let cert = cert.unwrap();\n        \n        // Verify the certificate has a private key (self-signed includes private key)\n        assert!(cert.private_key_pem().is_some());\n        \n        // Verify we can get PEM and DER formats\n        assert!(!cert.to_pem().is_empty());\n        assert!(!cert.to_der().is_empty());\n        \n        // Parse certificate and validate DN matches input\n        let parsed = parse_cert(cert.to_der());\n        let subject = parsed.subject();\n        \n        // Verify subject DN contains expected values\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"test.example.com\");\n        \n        let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n        assert_eq!(o, \"Test Org\");\n        \n        let c = subject.iter_country().next().unwrap().as_str().unwrap();\n        assert_eq!(c, \"US\");\n    }\n    \n    #[test]\n    fn test_build_self_signed_missing_csr() {\n        let key_pair = KeyPair::generate().unwrap();\n        let key_pem = key_pair.serialize_pem();\n        \n        let result = CertificateBuilder::new()\n            .signing_key(key_pem)\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"CSR parameters required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_missing_key() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"Signing key required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_key_mismatch() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        // Generate a different key\n        let different_key = KeyPair::generate().unwrap();\n        let different_key_pem = different_key.serialize_pem();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(different_key_pem)\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::PublicKeyMismatch(msg)) =\u003e {\n                assert!(msg.contains(\"Public key in CSR does not match signing key\"));\n            }\n            _ =\u003e panic!(\"Expected PublicKeyMismatch error, got: {:?}\", result),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_invalid_key() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(\"invalid_key\".to_string())\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::SigningError(msg)) =\u003e {\n                assert!(msg.contains(\"Invalid signing key\"));\n            }\n            _ =\u003e panic!(\"Expected SigningError\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_ca_signed_success() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        let (ca_key_pem, _) = create_ca_cert().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(ca_key_pem)\n            .build_ca_signed(\"CN=Test CA,O=Test CA Org,C=US\");\n        \n        assert!(cert.is_ok());\n        let cert = cert.unwrap();\n        \n        // CA-signed cert should not include the private key\n        assert!(cert.private_key_pem().is_none());\n        \n        // Verify we can get PEM and DER formats\n        assert!(!cert.to_pem().is_empty());\n        assert!(!cert.to_ "home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","cert","mod.rs"],"content":"//! Certificate generation and management module\n//!\n//! This module provides functionality for creating X.509 certificates,\n//! supporting both self-signed certificates and CA-signed certificates from CSRs.\n\npub mod builder;\n\npub use builder::CertificateBuilder;\n\nuse rcgen::KeyPair;\n\n/// Represents an X.509 certificate\n///\n/// This structure holds the certificate in DER format and optionally the private key.\n#[derive(Debug)]\npub struct Certificate {\n    /// The certificate in DER format\n    cert_der: Vec\u003cu8\u003e,\n    \n    /// The private key in PKCS#8 PEM format (only for self-signed certs)\n    key_pem: Option\u003cString\u003e,\n}\n\nimpl Certificate {\n    /// Creates a new certificate\n    pub(crate) fn new(cert_der: Vec\u003cu8\u003e, key_pem: Option\u003cString\u003e) -\u003e Self {\n        Self { cert_der, key_pem }\n    }\n    \n    /// Returns the certificate in DER format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let der = cert.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.cert_der\n    }\n    \n    /// Returns the certificate in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let pem = cert.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"CERTIFICATE\", self.cert_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n    \n    /// Returns the private key in PKCS#8 DER format (if available)\n    pub fn private_key_der(\u0026self) -\u003e Option\u003cVec\u003cu8\u003e\u003e {\n        self.key_pem.as_ref().and_then(|pem| {\n            KeyPair::from_pem(pem).ok().map(|kp| kp.serialize_der())\n        })\n    }\n    \n    /// Returns the private key in PKCS#8 PEM format (if available)\n    pub fn private_key_pem(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        self.key_pem.as_deref()\n    }\n}\n","traces":[{"line":26,"address":[3114768],"length":1,"stats":{"Line":35}},{"line":53,"address":[3090208],"length":1,"stats":{"Line":8}},{"line":54,"address":[3090213],"length":1,"stats":{"Line":8}},{"line":80,"address":[3090392,3090224,3090398],"length":1,"stats":{"Line":8}},{"line":83,"address":[3114872],"length":1,"stats":{"Line":10}},{"line":84,"address":[2840816],"length":1,"stats":{"Line":14}},{"line":88,"address":[3090416],"length":1,"stats":{"Line":1}},{"line":89,"address":[3090448],"length":1,"stats":{"Line":2}},{"line":90,"address":[2928400,2928308,2928384],"length":1,"stats":{"Line":3}},{"line":95,"address":[3090496],"length":1,"stats":{"Line":12}},{"line":96,"address":[3090501],"length":1,"stats":{"Line":11}}],"covered":11,"coverable":11},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","crl","builder.rs"],"content":"use rcgen::{CertificateRevocationListParams, Issuer, KeyIdMethod, KeyPair, RevokedCertParams, SerialNumber};\nuse time::OffsetDateTime;\n\nuse crate::CrlError;\nuse crate::types::RevocationReason;\n\nuse super::Crl;\n\n/// A revoked certificate entry in a CRL\n#[derive(Debug, Clone)]\npub struct RevokedCertificate {\n    /// Serial number of the revoked certificate\n    pub serial_number: SerialNumber,\n    \n    /// Time when the certificate was revoked\n    pub revocation_time: OffsetDateTime,\n    \n    /// Reason for revocation\n    pub reason: Option\u003cRevocationReason\u003e,\n}\n\nimpl RevokedCertificate {\n    /// Creates a new revoked certificate entry\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::RevokedCertificate;\n    /// use mtls_at_lib::types::RevocationReason;\n    /// use rcgen::SerialNumber;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let serial = SerialNumber::from(12345u64);\n    /// let revoked = RevokedCertificate::new(serial)\n    ///     .with_reason(RevocationReason::KEY_COMPROMISE);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn new(serial_number: SerialNumber) -\u003e Self {\n        Self {\n            serial_number,\n            revocation_time: OffsetDateTime::now_utc(),\n            reason: None,\n        }\n    }\n    \n    /// Sets the revocation time\n    pub fn with_time(mut self, time: OffsetDateTime) -\u003e Self {\n        self.revocation_time = time;\n        self\n    }\n    \n    /// Sets the revocation reason\n    pub fn with_reason(mut self, reason: RevocationReason) -\u003e Self {\n        self.reason = Some(reason);\n        self\n    }\n}\n\n/// Builder for creating Certificate Revocation Lists\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::crl::{CrlBuilder, RevokedCertificate};\n/// use mtls_at_lib::cert::CertificateBuilder;\n/// use mtls_at_lib::csr::CsrBuilder;\n/// use mtls_at_lib::types::{KeyUsage, RevocationReason};\n/// use rcgen::SerialNumber;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Create a CA\n/// let ca_csr = CsrBuilder::new()\n///     .subject(\"CN=Test CA,O=Example Corp,C=US\")?\n///     .is_ca(true)\n///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n///     .build()?;\n///\n/// let ca = CertificateBuilder::new()\n///     .from_der(ca_csr.to_der())?\n///     .signing_key(ca_csr.private_key_pem().to_string())\n///     .build_self_signed()?;\n///\n/// // Create revoked certificate entries\n/// let serial1 = SerialNumber::from(12345u64);\n/// let revoked1 = RevokedCertificate::new(serial1)\n///     .with_reason(RevocationReason::KEY_COMPROMISE);\n///\n/// // Generate CRL\n/// let crl = CrlBuilder::new()\n///     .issuer_key_from_pem(ca.private_key_pem().unwrap())?\n///     .add_revoked_cert(revoked1)\n///     .validity_days(7)\n///     .build()?;\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug)]\npub struct CrlBuilder {\n    issuer_keypair: Option\u003cKeyPair\u003e,\n    revoked_certs: Vec\u003cRevokedCertificate\u003e,\n    this_update: Option\u003cOffsetDateTime\u003e,\n    next_update_days: u32,\n}\n\nimpl CrlBuilder {\n    /// Creates a new CRL builder\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::CrlBuilder;\n    ///\n    /// let builder = CrlBuilder::new();\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            issuer_keypair: None,\n            revoked_certs: Vec::new(),\n            this_update: None,\n            next_update_days: 7, // Default to 7 days\n        }\n    }\n    \n    /// Sets the issuer's private key from PEM format (required)\n    ///\n    /// # Arguments\n    ///\n    /// * `issuer_key_pem` - The issuer CA's private key in PKCS#8 PEM format\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the PEM key cannot be parsed\n    pub fn issuer_key_from_pem(mut self, issuer_key_pem: \u0026str) -\u003e Result\u003cSelf, CrlError\u003e {\n        let keypair = KeyPair::from_pem(issuer_key_pem)\n            .map_err(|e| CrlError::SigningError(format!(\"Invalid issuer key PEM: {}\", e)))?;\n        self.issuer_keypair = Some(keypair);\n        Ok(self)\n    }\n    \n    /// Sets the issuer's private key from DER format (required)\n    ///\n    /// # Arguments\n    ///\n    /// * `issuer_key_der` - The issuer CA's private key in PKCS#8 DER format\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the DER key cannot be parsed\n    pub fn issuer_key_from_der(mut self, issuer_key_der: \u0026[u8]) -\u003e Result\u003cSelf, CrlError\u003e {\n        // Convert DER bytes to PEM and then parse\n        let pem_str = pem::encode(\u0026pem::Pem::new(\"PRIVATE KEY\", issuer_key_der.to_vec()));\n        let keypair = KeyPair::from_pem(\u0026pem_str)\n            .map_err(|e| CrlError::SigningError(format!(\"Invalid issuer key DER: {}\", e)))?;\n        self.issuer_keypair = Some(keypair);\n        Ok(self)\n    }\n    \n    /// Adds a revoked certificate to the CRL\n    ///\n    /// # Arguments\n    ///\n    /// * `revoked` - The revoked certificate entry\n    pub fn add_revoked_cert(mut self, revoked: RevokedCertificate) -\u003e Self {\n        self.revoked_certs.push(revoked);\n        self\n    }\n    \n    /// Adds multiple revoked certificates to the CRL\n    ///\n    /// # Arguments\n    ///\n    /// * `revoked_list` - A vector of revoked certificate entries\n    pub fn add_revoked_certs(mut self, revoked_list: Vec\u003cRevokedCertificate\u003e) -\u003e Self {\n        self.revoked_certs.extend(revoked_list);\n        self\n    }\n    \n    /// Sets the \"This Update\" time (defaults to now)\n    ///\n    /// # Arguments\n    ///\n    /// * `time` - The time when this CRL was issued\n    pub fn this_update(mut self, time: OffsetDateTime) -\u003e Self {\n        self.this_update = Some(time);\n        self\n    }\n    \n    /// Sets the validity period in days (time until next CRL update)\n    ///\n    /// # Arguments\n    ///\n    /// * `days` - Number of days until the next CRL should be issued\n    pub fn validity_days(mut self, days: u32) -\u003e Self {\n        self.next_update_days = days;\n        self\n    }\n    \n    /// Builds the CRL\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the issuer key is missing or CRL generation fails.\n    pub fn build(self) -\u003e Result\u003cCrl, CrlError\u003e {\n        // Validate required fields\n        let issuer_key = self.issuer_keypair.ok_or_else(|| {\n            CrlError::MissingField(\"Issuer key is required\".to_string())\n        })?;\n        \n        // Set update times\n        let this_update = self.this_update.unwrap_or_else(OffsetDateTime::now_utc);\n        let next_update = this_update + time::Duration::days(self.next_update_days as i64);\n        \n        // Create CRL parameters\n        let params = CertificateRevocationListParams {\n            this_update,\n            next_update,\n            crl_number: SerialNumber::from(1u64),\n            issuing_distribution_point: None,\n            revoked_certs: self.revoked_certs.iter().map(|revoked| {\n                RevokedCertParams {\n                    serial_number: SerialNumber::from(revoked.serial_number.to_bytes().to_vec()),\n                    revocation_time: revoked.revocation_time,\n                    reason_code: revoked.reason.as_ref().map(Self::convert_reason),\n                    invalidity_date: None,\n                }\n            }).collect(),\n            key_identifier_method: KeyIdMethod::Sha256,\n        };\n        \n        // Create issuer - use default params since we only need the key\n        let issuer_params = rcgen::CertificateParams::default();\n        let issuer = Issuer::new(issuer_params, \u0026issuer_key);\n        \n        // Generate CRL\n        let crl_der = params.signed_by(\u0026issuer)\n            .map_err(|e| CrlError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        Ok(Crl::new(crl_der))\n    }\n    \n    /// Converts our RevocationReason to rcgen format\n    fn convert_reason(reason: \u0026RevocationReason) -\u003e rcgen::RevocationReason {\n        match reason {\n            RevocationReason::Unspecified =\u003e rcgen::RevocationReason::Unspecified,\n            RevocationReason::KeyCompromise =\u003e rcgen::RevocationReason::KeyCompromise,\n            RevocationReason::CaCompromise =\u003e rcgen::RevocationReason::CaCompromise,\n            RevocationReason::AffiliationChanged =\u003e rcgen::RevocationReason::AffiliationChanged,\n            RevocationReason::Superseded =\u003e rcgen::RevocationReason::Superseded,\n            RevocationReason::CessationOfOperation =\u003e rcgen::RevocationReason::CessationOfOperation,\n            RevocationReason::CertificateHold =\u003e rcgen::RevocationReason::CertificateHold,\n            RevocationReason::RemoveFromCrl =\u003e rcgen::RevocationReason::RemoveFromCrl,\n            RevocationReason::PrivilegeWithdrawn =\u003e rcgen::RevocationReason::PrivilegeWithdrawn,\n            RevocationReason::AaCompromise =\u003e rcgen::RevocationReason::AaCompromise,\n        }\n    }\n}\n\nimpl Default for CrlBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{CrlBuilder, RevokedCertificate};\n    use crate::cert::CertificateBuilder;\n    use crate::csr::CsrBuilder;\n    use crate::types::{KeyUsage, RevocationReason};\n    use crate::CrlError;\n    use rcgen::SerialNumber;\n    use x509_parser::prelude::*;\n\n    fn create_test_ca() -\u003e crate::cert::Certificate {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test CA\").unwrap()\n            .is_ca(true)\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .build().unwrap();\n        \n        CertificateBuilder::new()\n            .from_der(csr.to_der()).unwrap()\n            .signing_key(csr.private_key_pem().to_string())\n            .build_self_signed().unwrap()\n    }\n\n    fn parse_crl(der: \u0026[u8]) -\u003e CertificateRevocationList\u003c'_\u003e {\n        let (_, crl) = CertificateRevocationList::from_der(der).unwrap();\n        crl\n    }\n\n    #[test]\n    fn test_revoked_certificate_fields() {\n        // Input: serial, reason\n        let input_serial = SerialNumber::from(12345u64);\n        let input_reason = RevocationReason::KEY_COMPROMISE;\n        \n        // Output: RevokedCertificate\n        let revoked = RevokedCertificate::new(input_serial.clone())\n            .with_reason(input_reason);\n        \n        // Validate: fields match input\n        assert_eq!(revoked.serial_number.to_bytes(), input_serial.to_bytes());\n        assert_eq!(revoked.reason, Some(input_reason));\n    }\n\n    #[test]\n    fn test_revoked_certificate_time() {\n        // Input: custom time\n        use ::time::{OffsetDateTime, Duration};\n        let input_time = OffsetDateTime::now_utc() - Duration::days(7);\n        \n        // Output: RevokedCertificate\n        let revoked = RevokedCertificate::new(SerialNumber::from(1u64))\n            .with_time(input_time);\n        \n        // Validate: time matches input\n        assert_eq!(revoked.revocation_time, input_time);\n    }\n\n    #[test]\n    fn test_empty_crl() {\n        // Input: CA key, validity days = 7\n        let ca = create_test_ca();\n        let input_validity_days = 7u32;\n        \n        // Output: CRL with no revoked certs\n        let crl = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n            .validity_days(input_validity_days)\n            .build().unwrap();\n        \n        // Validate: Parse CRL and check it contains 0 revoked certs\n        let parsed = parse_crl(crl.to_der());\n        assert_eq!(parsed.iter_revoked_certificates().count(), 0);\n    }\n\n    #[test]\n    fn test_crl_with_single_revoked_cert() {\n        // Input: serial 12345, reason KEY_COMPROMISE\n        let ca = create_test_ca();\n        let input_serial = 12345u64;\n        let input_reason = RevocationReason::KEY_COMPROMISE;\n        \n        // Output: CRL with 1 revoked cert\n        let crl = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n            .add_revoked_cert(\n                RevokedCertificate::new(SerialNumber::from(input_serial)).with_reason(input_reason)\n            )\n            .build().unwrap();\n        \n        // Validate: Parse CRL and verify serial matches input\n        let parsed = parse_crl(crl.to_der());\n        let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n        assert_eq!(revoked_certs.len(), 1);\n        \n        let revoked_cert = \u0026revoked_certs[0];\n        let serial_in_crl = \u0026revoked_cert.user_certificate.to_bytes_be();\n        let expected_serial = input_serial.to_be_bytes();\n        // Compare as BigUint (handles leading zeros)\n        assert_eq!(serial_in_crl, \u0026expected_serial[expected_serial.iter().position(|\u0026b| b != 0).unwrap_or(expected_serial.len() - 1)..]);\n    }\n\n    #[test]\n    fn test_crl_with_multiple_revoked_certs() {\n        // Input: serials 1, 2, 3\n        let ca = create_test_ca();\n        let input_serials = vec![1u64, 2u64, 3u64];\n        let revoked_list: Vec\u003c_\u003e = input_serials.iter()\n            .map(|\u0026i| RevokedCertificate::new(SerialNumber::from(i)))\n            .collect();\n        \n        // Output: CRL with 3 revoked certs\n        let crl = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n            .add_revoked_certs(revoked_list)\n            .build().unwrap();\n        \n        // Validate: Parse CRL and verify all serials are present\n        let parsed = parse_crl(crl.to_der());\n        let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n        assert_eq!(revoked_certs.len(), input_serials.len());\n        \n        for (i, revoked_cert) in revoked_certs.iter().enumerate() {\n            let serial_in_crl = \u0026revoked_cert.user_certificate.to_bytes_be();\n            let expected = input_serials[i].to_be_bytes();\n            // Compare as BigUint (strips leading zeros)\n            let expected_stripped = \u0026expected[expected.iter().position(|\u0026b| b != 0).unwrap_or(expected.len() - 1)..];\n            assert_eq!(serial_in_crl.as_slice(), expected_stripped);\n        }\n    }\n\n    #[test]\n    fn test_crl_pem_format() {\n        // Input: CA key + 1 revoked cert\n        let ca = create_test_ca();\n        let input_serial = 999u64;\n        \n        // Output: CRL PEM\n        let crl = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n            .add_revoked_cert(RevokedCertificate::new(SerialNumber::from(input_serial)))\n            .build().unwrap();\n        \n        let pem = crl.to_pem();\n        \n        // Validate: PEM format correct and can parse back\n        assert!(pem.starts_with(\"-----BEGIN X509 CRL-----\"));\n        assert!(pem.contains(\"-----END X509 CRL-----\"));\n        \n        // Verify CRL contains the revoked cert\n        let parsed = parse_crl(crl.to_der());\n        assert_eq!(parsed.iter_revoked_certificates().count(), 1);\n    }\n\n    #[test]\n    fn test_crl_der_format() {\n        // Input: CA key + 2 revoked certs\n        let ca = create_test_ca();\n        let input_serials = vec![111u64, 222u64];\n        \n        // Output: CRL DER\n        let crl = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap()\n            .add_revoked_certs(vec![\n                RevokedCertificate::new(SerialNumber::from(input_serials[0])),\n                RevokedCertificate::new(SerialNumber::from(input_serials[1])),\n            ])\n            .build().unwrap();\n        let der = crl.to_der();\n        \n        // Validate: DER format correct (starts with SEQUENCE tag)\n        assert_eq!(der[0], 0x30);\n        assert!(!der.is_empty());\n        \n        // Validate: Parse DER and verify revoked certs\n        let parsed = parse_crl(der);\n        assert_eq!(parsed.iter_revoked_certificates().count(), input_serials.len());\n    }\n\n    #[test]\n    fn test_crl_all_revocation_reasons() {\n        // Input: 10 revoked certs with all reason codes\n        let ca = create_test_ca();\n        let input_count = 10;\n        let input_reasons = vec![\n            RevocationReason::UNSPECIFIED,\n            RevocationReason::KEY_COMPROMISE,\n            RevocationReason::CA_COMPROMISE,\n            RevocationReason::AFFILIATION_CHANGED,\n            RevocationReason::SUPERSEDED,\n            RevocationReason::CESSATION_OF_OPERATION,\n            RevocationReason::CERTIFICATE_HOLD,\n            RevocationReason::REMOVE_FROM_CRL,\n            RevocationReason::PRIVILEGE_WITHDRAWN,\n            RevocationReason::AA_COMPROMISE,\n        ];\n        \n        let mut builder = CrlBuilder::new()\n            .issuer_key_from_pem(ca.private_key_pem().unwrap()).unwrap();\n        \n        for (i, reason) in input_reasons.iter().enumerate() {\n            builder = builder.add_revoked_cert(\n                RevokedCertificate::new(SerialNumber::from(i as u64 + 1))\n                    .with_reason(*reason)\n            );\n        }\n        \n        // Output: CRL with all reason types\n        let crl = builder.build().unwrap();\n        \n        // Validate: Parse CRL and verify count matches input\n        let parsed = parse_crl(crl.to_der());\n        let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n        assert_eq!(revoked_certs.len( der.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.issuer_keypair.is_some());\n    }\n    \n    #[test]\n    fn test_crl_from_der_key() {\n        // Input: CA DER key + 1 revoked cert\n        let ca = create_test_ca();\n        let ca_key_der = ca.private_key_der().unwrap();\n        let input_serial = 54321u64;\n        \n        // Output: CRL built with DER key\n        let crl = CrlBuilder::new()\n            .issuer_key_from_der(\u0026ca_key_der).unwrap()\n            .add_revoked_cert(RevokedCertificate::new(SerialNumber::from(input_serial)))\n            .build().unwrap();\n        \n        // Validate: Parse CRL and verify serial\n        let parsed = parse_crl(crl.to_der());\n        let revoked_certs: Vec\u003c_\u003e = parsed.iter_revoked_certificates().collect();\n        assert_eq!(revoked_certs.len(), 1);\n        \n        let revoked_cert = \u0026revoked_certs[0];\n        let serial_in_crl = \u0026revoked_cert.user_certificate.to_bytes_be();\n        let expected_serial = input_serial.to_be_bytes();\n        assert_eq!(serial_in_crl, \u0026expected_serial[expected_serial.iter().position(|\u0026b| b != 0).unwrap_or(expected_serial.len() - 1)..]);\n    }\n\n    #[test]\n    fn test_builder_defaults() {\n        // Output: Default builder\n        let builder = CrlBuilder::default();\n        \n        // Validate: Default values\n        assert!(builder.issuer_keypair.is_none());\n        assert_eq!(builder.revoked_certs.len(), 0);\n        assert_eq!(builder.next_update_days, 7);\n    }\n}","traces":[{"line":39,"address":[3096464,3096600],"length":1,"stats":{"Line":5}},{"line":42,"address":[3096499],"length":1,"stats":{"Line":6}},{"line":48,"address":[3047232],"length":1,"stats":{"Line":2}},{"line":49,"address":[3047240],"length":1,"stats":{"Line":2}},{"line":50,"address":[3096647],"length":1,"stats":{"Line":2}},{"line":54,"address":[2620528],"length":1,"stats":{"Line":4}},{"line":55,"address":[3096690],"length":1,"sta  {\n    /// Creates a new CRL\n    pub(crate) fn new(crl_der: Vec\u003cu8\u003e) -\u003e Self {\n        Self { crl_der }\n    }\n    \n    /// Returns the CRL in DER format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::CrlBuilder;\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// // Create a CA\n    /// let ca_csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .is_ca(true)\n    ///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n    ///     .build()?;\n    ///\n    /// let ca = CertificateBuilder::new()\n    ///     .from_der(ca_csr.to_der())?\n    ///     .signing_key(ca_csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// // Generate CRL\n    /// let crl = CrlBuilder::new()\n    ///     .issuer_key_from_pem(ca.private_key_pem().unwrap())?\n    ///     .build()?;\n    ///     \n    /// let der = crl.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.crl_der\n    }\n    \n    /// Returns the CRL in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::crl::CrlBuilder;\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let ca_csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .is_ca(true)\n    ///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n    ///     .build()?;\n    ///\n    /// let ca = CertificateBuilder::new()\n    ///     .from_der(ca_csr.to_der())?\n    ///     .signing_key(ca_csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let crl = CrlBuilder::new()\n    ///     .issuer_key_from_pem(ca.private_key_pem().unwrap())?\n    ///     .build()?;\n    ///     \n    /// let pem = crl.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN X509 CRL-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"X509 CRL\", self.crl_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n}","traces":[{"line":17,"address":[2838224],"length":1,"stats":{"Line":17}},{"line":54,"address":[3052384],"length":1,"stats":{"Line":15}},{"line":55,"address":[3052389],"length":1,"stats":{"Line":16}},{"line":89,"address":[3052568,3052400,3052574],"length":1,"stats":{"Line":2}},{"line":92,"address":[3052424],"length":1,"stats":{"Line":2}},{"line":93,"address":[3052496],"length":1,"stats":{"Line":3}}],"covered":6,"coverable":6},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","csr","builder.rs"],"content":"//! CSR Builder for constructing Certificate Signing Requests\n//!\n//! This module provides a type-safe builder API for creating CSRs with\n//! Key Usage and Extended Key Usage extensions.\n\nuse crate::error::CsrError;\nuse crate::types::{DistinguishedName, ExtendedKeyUsage, KeyUsage};\nuse super::Csr;\n\nuse rcgen::{\n    CertificateParams, DistinguishedName as RcgenDn, DnType, \n    KeyPair, KeyUsagePurpose, ExtendedKeyUsagePurpose, SanType\n};\n\n/// Builder for creating Certificate Signing Requests\n///\n/// This builder provides a fluent API for configuring and generating CSRs.\n/// It enforces the requirement that all CSRs must have a subject DN.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::csr::CsrBuilder;\n/// use mtls_at_lib::types::KeyUsage;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Create a CA CSR\n/// let ca_csr = CsrBuilder::new()\n///     .subject(\"CN=My Root CA,O=My Organization,C=US\")?\n///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n///     .is_ca(true)\n///     .build()?;\n///     \n/// // Create a server certificate CSR\n/// let server_csr = CsrBuilder::new()\n///     .subject(\"CN=server.example.com\")?\n///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n///     .build()?;\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug)]\npub struct CsrBuilder {\n    /// Subject Distinguished Name (required)\n    subject: Option\u003cDistinguishedName\u003e,\n    \n    /// Key Usage extension\n    key_usage: Option\u003cKeyUsage\u003e,\n    \n    /// Extended Key Usage extension\n    extended_key_usage: Vec\u003cExtendedKeyUsage\u003e,\n    \n    /// CA flag for BasicConstraints extension\n    is_ca: bool,\n    \n    /// Path length constraint for CA certificates\n    path_len_constraint: Option\u003cu8\u003e,\n    \n    /// Subject Alternative Names\n    subject_alt_names: Vec\u003cString\u003e,\n    \n    /// Optional custom key pair (if not provided, a new one will be generated)\n    key_pair: Option\u003cKeyPair\u003e,\n}\n\nimpl CsrBuilder {\n    /// Creates a new CSR builder\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// let builder = CsrBuilder::new();\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            subject: None,\n            key_usage: None,\n            extended_key_usage: Vec::new(),\n            is_ca: false,\n            path_len_constraint: None,\n            subject_alt_names: Vec::new(),\n            key_pair: None,\n        }\n    }\n    \n    /// Sets the subject Distinguished Name\n    ///\n    /// The subject is required for all CSRs.\n    ///\n    /// # Arguments\n    ///\n    /// * `dn` - Distinguished Name string (e.g., \"CN=example.com,O=My Org,C=US\")\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com,O=Example Inc,C=US\")?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn subject(mut self, dn: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        self.subject = Some(DistinguishedName::from_str(dn)?);\n        Ok(self)\n    }\n    \n    /// Sets a custom key pair to use for the CSR\n    ///\n    /// If not provided, a new ECDSA P-256 key pair will be generated automatically.\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - Private key in PKCS#8 PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use rcgen::KeyPair;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let key_pair = KeyPair::generate()?;\n    /// let key_pem = key_pair.serialize_pem();\n    ///\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .with_key(\u0026key_pem)?\n    ///     .build()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn with_key(mut self, key_pem: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        let key_pair = KeyPair::from_pem(key_pem)\n            .map_err(|e| CsrError::KeyGenerationFailed(format!(\"Invalid key: {}\", e)))?;\n        self.key_pair = Some(key_pair);\n        Ok(self)\n    }\n    \n    /// Sets the Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `usage` - KeyUsage flags (can be combined with `|`)\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn key_usage(mut self, usage: KeyUsage) -\u003e Self {\n        self.key_usage = Some(usage);\n        self\n    }\n    \n    /// Sets the Extended Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `ext_usage` - Vec of ExtendedKeyUsage values\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::ExtendedKeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH]);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn extended_key_usage(mut self, ext_usage: Vec\u003cExtendedKeyUsage\u003e) -\u003e Self {\n        self.extended_key_usage = ext_usage;\n        self\n    }\n    \n    /// Marks this CSR for a CA certificate\n    ///\n    /// This sets the CA flag in the BasicConstraints extension.\n    ///\n    /// # Arguments\n    ///\n    /// * `is_ca` - Whether this is for a CA certificate\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=My Root CA\")?\n    ///     .is_ca(true);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn is_ca(mut self, is_ca: bool) -\u003e Self {\n        self.is_ca = is_ca;\n        self\n    }\n    \n    /// Sets the path length constraint for CA certificates\n    ///\n    /// This restricts how many intermediate CAs can appear in a chain\n    /// below this CA.\n    ///\n    /// # Arguments\n    ///\n    /// * `path_len` - Maximum number of intermediate CAs\n    pub fn path_len_constraint(mut self, path_len: u8) -\u003e Self {\n        self.path_len_constraint = Some(path_len);\n        self\n    }\n    \n    /// Adds a Subject Alternative Name (SAN)\n    ///\n    /// # Arguments\n    ///\n    /// * `san` - DNS name, IP address, or URI\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .add_san(\"www.example.com\")\n    ///     .add_san(\"api.example.com\");\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn add_san(mut self, san: impl Into\u003cString\u003e) -\u003e Self {\n        self.subject_alt_names.push(san.into());\n        self\n    }\n    \n    /// Builds the CSR and generates a new key pair\n    ///\n    /// This generates a new ECDSA P-256 key pair, configures the certificate\n    /// parameters according to the builder settings, and creates a CSR.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - The subject DN is not set\n    /// - Key pair generation fails\n    /// - CSR serialization fails\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// // CSR is now ready to use\n    /// let pem = csr.to_pem();\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn build(self) -\u003e Result\u003cCsr, CsrError\u003e {\n        // Validate required fields\n        let subject = self.subject.ok_or_else(|| {\n            CsrError::InvalidSubjectName(\"Subject name is required\".to_string())\n        })?;\n        \n        // Use provided key pair or generate a new one (ECDSA P-256 for security and performance)\n        let key_pair = if let Some(kp) = self.key_pair {\n            kp\n        } else {\n            KeyPair::generate()\n                .map_err(|e| CsrError::KeyGenerationFailed(e.to_string()))?\n        };\n        \n        // Create certificate parameters\n        let mut params = CertificateParams::default();\n        \n        // Set subject DN - convert our DistinguishedName to rcgen format\n        params.distinguished_name = Self::convert_dn(\u0026subject)?;\n        \n        // Set Key Usage if specified\n        if let Some(ku) = self.key_usage {\n            params.key_usages = Self::convert_key_usage(ku);\n        }\n        \n        // Set Extended Key Usage if specified\n        if !self.extended_key_usage.is_empty() {\n            params.extended_key_usages = Self::convert_extended_key_usage(\u0026self.extended_key_usage);\n        }\n        \n        // Note: BasicConstraints (is_ca) is a certificate parameter, not a CSR parameter\n        // It will be set when the certificate is issued from this CSR\n        // We store it here for future use but don't include it in the CSR\n        \n        // Set Subject Alternative Names\n        if !self.subject_alt_names.is_empty() {\n            params.subject_alt_names = self.subject_alt_names.iter()\n                .map(|s| SanType::DnsName(s.clone().try_into().unwrap()))\n                .collect();\n        }\n        \n        // Generate CSR\n        let csr = params.serialize_request(\u0026key_pair)\n            .map_err(|e| CsrError::EncodingError(e.to_string()))?;\n        \n        Ok(Csr::new(csr.der().to_vec(), key_pair))\n    }\n    \n    /// Converts our DistinguishedName to rcgen's format\n    fn convert_dn(dn: \u0026DistinguishedName) -\u003e Result\u003cRcgenDn, CsrError\u003e {\n        let mut rcgen_dn = RcgenDn::new();\n        \n        // Parse the DN string and add components\n        // Our DistinguishedName stores raw string, so we need to parse it\n        let dn_str = dn.as_str();\n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {}, // Ignore unknown attributes\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n    \n    /// Converts our KeyUsage flags to rcgen's format\n    fn convert_key_usage(ku: KeyUsage) -\u003e Vec\u003cKeyUsagePurpose\u003e {\n        let mut purposes = Vec::new();\n        \n        if ku.contains(KeyUsage::digital_signature()) {\n            purposes.push(KeyUsagePurpose::DigitalSignature);\n        }\n        if ku.contains(KeyUsage::non_repudiation()) {\n            purposes.push(KeyUsagePurpose::ContentCommitment);\n        }\n        if ku.contains(KeyUsage::key_encipherment()) {\n            purposes.push(KeyUsagePurpose::KeyEncipherment);\n        }\n        if ku.contains(KeyUsage::data_encipherment()) {\n            purposes.push(KeyUsagePurpose::DataEncipherment);\n        }\n        if ku.contains(KeyUsage::key_agreement()) {\n            purposes.push(KeyUsagePurpose::KeyAgreement);\n        }\n        if ku.contains(KeyUsage::key_cert_sign()) {\n            purposes.push(KeyUsagePurpose::KeyCertSign);\n        }\n        if ku.contains(KeyUsage::crl_sign()) {\n            purposes.push(KeyUsagePurpose::CrlSign);\n        }\n        if ku.contains(KeyUsage::encipher_only()) {\n            purposes.push(KeyUsagePurpose::EncipherOnly);\n        }\n        if ku.contains(KeyUsage::decipher_only()) {\n            purposes.push(KeyUsagePurpose::DecipherOnly);\n        }\n        \n        purposes\n    }\n    \n    /// Converts our ExtendedKeyUsage to rcgen's format\n    fn convert_extended_key_usage(eku_list: \u0026[ExtendedKeyUsage]) -\u003e Vec\u003cExtendedKeyUsagePurpose\u003e {\n        eku_list.iter().map(|eku| {\n            if eku == \u0026ExtendedKeyUsage::SERVER_AUTH {\n                ExtendedKeyUsagePurpose::ServerAuth\n            } else if eku == \u0026ExtendedKeyUsage::CLIENT_AUTH {\n                ExtendedKeyUsagePurpose::ClientAuth\n            } else if eku == \u0026ExtendedKeyUsage::CODE_SIGNING {\n                ExtendedKeyUsagePurpose::CodeSigning\n            } else if eku == \u0026ExtendedKeyUsage::EMAIL_PROTECTION {\n                ExtendedKeyUsagePurpose::EmailProtection\n            } else if eku == \u0026ExtendedKeyUsage::TIME_STAMPING {\n                ExtendedKeyUsagePurpose::TimeStamping\n            } else {\n                ExtendedKeyUsagePurpose::OcspSigning\n            }\n        }).collect()\n    }\n}\n\nimpl Default for CsrBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::{KeyUsage, ExtendedKeyUsage};\n    use x509_parser::prelude::*;\n    \n    /// Helper to parse CSR DER\n    fn parse_csr(der: \u0026[u8]) -\u003e X509CertificationRequest\u003c'_\u003e {\n        let (_, csr) = X509CertificationRequest::from_der(der).expect(\"Failed to parse CSR\");\n        csr\n    }\n    \n    #[test]\n    fn test_basic_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n        assert!(!csr.to_der().is_empty());\n        \n        // Parse CSR and validate subject DN matches input\n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"test.example.com\", \"CN should match input\");\n    }\n    \n    #[test]\n    fn test_ca_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test Root CA,O=Test Org,C=US\").unwrap()\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .is_ca(true)\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        \n        // Parse CSR and validate subject DN matches input\n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        let cn = subject.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Test Root CA\");\n        let o = subject.iter_organization().next().unwrap().as_str().unwrap();\n        assert_eq!(o, \"Test Org\");\n        let c = subject.iter_country().next().unwrap().as_str().unwrap();\n        assert_eq!(c, \"US\");\n    }\n    \n    #[test]\n    fn test_server_csr_with_eku() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=server.example.com\").unwrap()\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(\"www.example.com\")\n            .add_san(\"api.example.com\")\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        assert!(!csr.private_key_pem().is_empty());\n    }\n    \n    #[test]\n    fn test_missing_subject_error() {\n        let result = CsrBuilder::new().build();\n        assert!(matches!(result, Err(CsrError::InvalidSubjectName(_))));\n    }\n    \n    #[test]\n    fn test_private_key_export() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.private_key_pem();\n        assert!(pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"));\n        \n        let der = csr.private_key_der();\n        assert!(!der.is_empty());\n    }\n    \n    #[test]\n    fn test_path_len_constraint() {\n        // Test CA CSR with path length constraint\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Intermediate CA,O=Test Org,C=US\").unwrap()\n            .is_ca(true)\n            .path_len_constraint(1)\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        \n        // Verify CSR was created successfully\n        let parsed = parse_csr(csr.to_der());\n        let cn = parsed.certification_request_info.subject\n            .iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Intermediate CA\");\n    }\n    \n    #[test]\n    fn test_path_len_constraint_zero() {\n        // Test CA CSR with path length constraint of 0 (no subordinate CAs allowed)\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Leaf CA,O=Test Org,C=US\").unwrap()\n            .is_ca(true)\n            .path_len_constraint(0)\n            .key_usage(KeyUsage::key_cert_sign())\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n    }\n    \n    #[test]\n    fn test_dn_state_and_locality_parsing() {\n        // Test parsing of State (ST and S) and Locality (L) DN components\n        let csr_st = CsrBuilder::new()\n            .subject(\"CN=Test Server,ST=California,L=San Francisco,O=Test Corp,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed_st = parse_csr(csr_st.to_der());\n        let subject_st = parsed_st.certification_request_info.subject;\n        \n        // Verify CN matches\n        let cn = subject_st.iter_common_name().next().unwrap().as_str().unwrap();\n        assert_eq!(cn, \"Test Server\");\n        \n        // Verify State (ST) matches\n        let state = subject_st.iter_state_or_province().next().unwrap().as_str().unwrap();\n        assert_eq!(state, \"California\", \"State (ST) should match input\");\n        \n        // Verify Locality (L) matches\n        let locality = subject_st.iter_locality().next().unwrap().as_str().unwrap();\n        assert_eq!(locality, \"San Francisco\", \"Locality (L) should match input\");\n        \n        // Test with 'S' instead of 'ST' for state\n        let csr_s = CsrBuilder::new()\n            .subject(\"CN=Test Server 2,S=New York,L=New York City,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed_s = parse_csr(csr_s.to_der());\n        let subject_s = parsed_s.certification_request_info.subject;\n        \n        let state_s = subject_s.iter_state_or_province().next().unwrap().as_str().unwrap();\n        assert_eq!(state_s, \"New York\", \"State (S) should match input\");\n        \n        let locality_s = subject_s.iter_locality().next().unwrap().as_str().unwrap();\n        assert_eq!(locality_s, \"New York City\", \"Locality should match input\");\n    }\n    \n    #[test]\n    fn test_dn_with_unknown_attributes_ignored() {\n        // Test that unknown DN attributes are ignored without causing errors\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test,UNKNOWN=Value,O=Org,C=US\").unwrap()\n            .build().unwrap();\n            \n        let parsed = parse_csr(csr.to_der());\n        let subject = parsed.certification_request_info.subject;\n        \n        // Verify known attributes are parsed correctly\n        let cn =
