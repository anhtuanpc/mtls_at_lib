er key management\n\nuse mtls_at_lib::cert::CertificateBuilder;\nuse mtls_at_lib::csr::CsrBuilder;\nuse mtls_at_lib::types::{KeyUsage, ExtendedKeyUsage};\nuse rcgen::KeyPair;\n\n/// Helper to verify certificate PEM format\nfn verify_cert_pem_format(pem: \u0026str) {\n    assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n    assert!(pem.contains(\"-----END CERTIFICATE-----\"));\n    assert!(pem.lines().count() \u003e 3); // Header + content + footer\n}\n\n/// Helper to verify certificate DER format\nfn verify_cert_der_format(der: \u0026[u8]) {\n    assert!(!der.is_empty());\n    // DER certificates start with SEQUENCE (0x30)\n    assert_eq!(der[0], 0x30);\n}\n\n#[test]\nfn test_e2e_self_signed_certificate_workflow() {\n    // Scenario: Generate a self-signed certificate for a web server\n    println!(\"\\n=== E2E Test: Self-Signed Certificate Workflow ===\");\n    \n    // Step 1: Create a CSR for the server\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=server.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"server.example.com\")\n        .add_san(\"www.example.com\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created for server.example.com\");\n    \n    // Step 2: Create a self-signed certificate from the CSR\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build self-signed certificate\");\n    \n    println!(\"✓ Step 2: Self-signed certificate created\");\n    \n    // Step 3: Verify the certificate properties\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    verify_cert_der_format(\u0026server_cert.to_der());\n    \n    // Should have private key (self-signed includes it)\n    assert!(server_cert.private_key_pem().is_some());\n    assert!(!server_cert.private_key_pem().unwrap().is_empty());\n    \n    println!(\"✓ Step 3: Certificate validated\");\n    \n    // Step 4: Save to files (simulated)\n    let cert_pem = server_cert.to_pem();\n    let key_pem = server_cert.private_key_pem().unwrap();\n    \n    assert!(cert_pem.len() \u003e 100);\n    assert!(key_pem.len() \u003e 100);\n    \n    println!(\"✓ Step 4: Certificate and key ready for deployment\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_ca_and_server_certificate_chain() {\n    // Scenario: Create a CA certificate and use it to sign a server certificate\n    println!(\"\\n=== E2E Test: CA Certificate Chain Workflow ===\");\n    \n    // Step 1: Create CA certificate (self-signed root CA)\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Example Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    println!(\"✓ Step 1: CA CSR created\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 2: Root CA certificate created (self-signed)\");\n    \n    // Step 2: Create a server CSR with a different key\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=api.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"api.example.com\")\n        .add_san(\"api-v2.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    println!(\"✓ Step 3: Server CSR created with different key\");\n    \n    // Step 3: Sign the server certificate with CA\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=Example Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate with CA\");\n    \n    println!(\"✓ Step 4: Server certificate signed by CA\");\n    \n    // Step 4: Verify the certificates\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    \n    // CA cert should have private key (it's self-signed)\n    assert!(ca_cert.private_key_pem().is_some());\n    \n    // Server cert should NOT have private key (CA-signed)\n    assert!(server_cert.private_key_pem().is_none());\n    \n    // Server still has its own private key from CSR\n    assert!(!server_csr.private_key_pem().is_empty());\n    \n    println!(\"✓ Step 5: Certificate chain validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_intermediate_ca_chain() {\n    // Scenario: Root CA -\u003e Intermediate CA -\u003e Server Certificate\n    println!(\"\\n=== E2E Test: Three-Level Certificate Chain ===\");\n    \n    // Step 1: Create Root CA\n    let root_ca_csr = CsrBuilder::new()\n        .subject(\"CN=Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set root CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build root CA CSR\");\n    \n    let root_ca_cert = CertificateBuilder::new()\n        .from_der(root_ca_csr.to_der())\n        .expect(\"Failed to load root CA CSR\")\n        .signing_key(root_ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build root CA certificate\");\n    \n    println!(\"✓ Step 1: Root CA created\");\n    \n    // Step 2: Create Intermediate CA CSR\n    let intermediate_ca_csr = CsrBuilder::new()\n        .subject(\"CN=Intermediate CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set intermediate CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build intermediate CA CSR\");\n    \n    println!(\"✓ Step 2: Intermediate CA CSR created\");\n    \n    // Step 3: Sign Intermediate CA with Root CA\n    let intermediate_ca_cert = CertificateBuilder::new()\n        .from_der(intermediate_ca_csr.to_der())\n        .expect(\"Failed to load intermediate CA CSR\")\n        .signing_key(root_ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=Root CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign intermediate CA with root CA\");\n    \n    println!(\"✓ Step 3: Intermediate CA signed by Root CA\");\n    \n    // Step 4: Create Server CSR\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=secure.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"secure.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    println!(\"✓ Step 4: Server CSR created\");\n    \n    // Step 5: Sign Server Certificate with Intermediate CA\n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(intermediate_ca_csr.private_key_pem().to_string())\n        .build_ca_signed(\"CN=Intermediate CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate with intermediate CA\");\n    \n    println!(\"✓ Step 5: Server certificate signed by Intermediate CA\");\n    \n    // Step 6: Verify the chain\n    verify_cert_pem_format(\u0026root_ca_cert.to_pem());\n    verify_cert_pem_format(\u0026intermediate_ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    \n    // Only root CA should have its private key in the cert object\n    assert!(root_ca_cert.private_key_pem().is_some());\n    assert!(intermediate_ca_cert.private_key_pem().is_none());\n    assert!(server_cert.private_key_pem().is_none());\n    \n    println!(\"✓ Step 6: Three-level certificate chain validated\");\n    println!(\"  - Root CA (self-signed)\");\n    println!(\"  - Intermediate CA (signed by Root CA)\");\n    println!(\"  - Server Certificate (signed by Intermediate CA)\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_multiple_servers_same_ca() {\n    // Scenario: One CA signing multiple server certificates\n    println!(\"\\n=== E2E Test: Multiple Servers with Same CA ===\");\n    \n    // Step 1: Create CA\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Shared CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 1: Shared CA created\");\n    \n    // Step 2: Create multiple server certificates\n    let servers = vec![\n        (\"server1.example.com\", \"Server 1\"),\n        (\"server2.example.com\", \"Server 2\"),\n        (\"server3.example.com\", \"Server 3\"),\n    ];\n    \n    let mut server_certs = Vec::new();\n    \n    for (domain, name) in servers {\n        // Create CSR for each server\n        let server_csr = CsrBuilder::new()\n            .subject(\u0026format!(\"CN={},O=Example Corp,C=US\", domain))\n            .expect(\"Failed to set server subject\")\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(domain)\n            .build()\n            .expect(\"Failed to build server CSR\");\n        \n        // Sign with CA\n        let server_cert = CertificateBuilder::new()\n            .from_der(server_csr.to_der())\n            .expect(\"Failed to load server CSR\")\n            .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n            .build_ca_signed(\"CN=Shared CA,O=Example Corp,C=US\")\n            .expect(\"Failed to sign server certificate\");\n        \n        verify_cert_pem_format(\u0026server_cert.to_pem());\n        assert!(server_cert.private_key_pem().is_none());\n        \n        server_certs.push((name, server_cert));\n        println!(\"✓ Step 2.{}: {} certificate signed\", server_certs.len(), name);\n    }\n    \n    // Step 3: Verify all certificates are valid\n    assert_eq!(server_certs.len(), 3);\n    for (name, cert) in \u0026server_certs {\n        assert!(!cert.to_pem().is_empty(), \"{} cert is empty\", name);\n        assert!(!cert.to_der().is_empty(), \"{} cert DER is empty\", name);\n    }\n    \n    println!(\"✓ Step 3: All server certificates validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_client_certificate_for_mtls() {\n    // Scenario: Generate client certificate for mutual TLS (mTLS)\n    println!(\"\\n=== E2E Test: Client Certificate for mTLS ===\");\n    \n    // Step 1: Create CA\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to set CA subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .build()\n        .expect(\"Failed to build CA CSR\");\n    \n    let ca_cert = CertificateBuilder::new()\n        .from_der(ca_csr.to_der())\n        .expect(\"Failed to load CA CSR\")\n        .signing_key(ca_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build CA certificate\");\n    \n    println!(\"✓ Step 1: CA certificate created\");\n    \n    // Step 2: Create server certificate\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=mtls.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set server subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"mtls.example.com\")\n        .build()\n        .expect(\"Failed to build server CSR\");\n    \n    let server_cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load server CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign server certificate\");\n    \n    println!(\"✓ Step 2: Server certificate created\");\n    \n    // Step 3: Create client certificate\n    let client_csr = CsrBuilder::new()\n        .subject(\"CN=client-app,O=Example Corp,C=US\")\n        .expect(\"Failed to set client subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_agreement())\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to build client CSR\");\n    \n    let client_cert = CertificateBuilder::new()\n        .from_der(client_csr.to_der())\n        .expect(\"Failed to load client CSR\")\n        .signing_key(ca_cert.private_key_pem().unwrap().to_string())\n        .build_ca_signed(\"CN=mTLS CA,O=Example Corp,C=US\")\n        .expect(\"Failed to sign client certificate\");\n    \n    println!(\"✓ Step 3: Client certificate created\");\n    \n    // Step 4: Verify mTLS setup\n    verify_cert_pem_format(\u0026ca_cert.to_pem());\n    verify_cert_pem_format(\u0026server_cert.to_pem());\n    verify_cert_pem_format(\u0026client_cert.to_pem());\n    \n    // Verify key management\n    assert!(ca_cert.private_key_pem().is_some(), \"CA should have private key\");\n    assert!(server_cert.private_key_pem().is_none(), \"Server cert shouldn't include private key\");\n    assert!(client_cert.private_key_pem().is_none(), \"Client cert shouldn't include private key\");\n    \n    // Server and client keep their own private keys from CSRs\n    assert!(!server_csr.private_key_pem().is_empty(), \"Server should have its private key\");\n    assert!(!client_csr.private_key_pem().is_empty(), \"Client should have its private key\");\n    \n    println!(\"✓ Step 4: mTLS certificate chain validated\");\n    println!(\"  - CA certificate\");\n    println!(\"  - Server certificate (for server authentication)\");\n    println!(\"  - Client certificate (for client authentication)\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_certificate_with_san_multiple_domains() {\n    // Scenario: Create certificate with multiple SANs (Subject Alternative Names)\n    println!(\"\\n=== E2E Test: Certificate with Multiple SANs ===\");\n    \n    // Step 1: Create CSR with multiple SANs\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=multi.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"multi.example.com\")\n        .add_san(\"www.multi.example.com\")\n        .add_san(\"api.multi.example.com\")\n        .add_san(\"admin.multi.example.com\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created with 4 SANs\");\n    \n    // Step 2: Create self-signed certificate\n    let cert = CertificateBuilder::new()\n        .from_der(server_csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(server_csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build certificate\");\n    \n    println!(\"✓ Step 2: Certificate created\");\n    \n    // Step 3: Verify certificate\n    verify_cert_pem_format(\u0026cert.to_pem());\n    assert!(cert.private_key_pem().is_some());\n    \n    println!(\"✓ Step 3: Multi-SAN certificate validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n\n#[test]\nfn test_e2e_error_same_key_for_ca_signed() {\n    // Scenario: Verify that using the same key for CA-signed cert fails\n    println!(\"\\n=== E2E Test: Error Handling - Same Key for CA-Signed ===\");\n    \n    // Step 1: Create a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Try to create CA-signed cert with the same key (should fail)\n    let result = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load CSR\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_ca_signed(\"CN=Test CA,O=Example Corp,C=US\");\n    \n    println!(\"✓ Step 2: Attempted to sign with same key\");\n    \n    // Step 3: Verify it fails with the correct error\n    assert!(result.is_err(), \"Should fail when using same key for CA-signed\");\n    \n    match result {\n        Err(mtls_at_lib::error::CertError::PublicKeyMismatch(msg)) =\u003e {\n            assert!(msg.contains(\"Public key in CSR matches CA signing key\"));\n            println!(\"✓ Step 3: Correctly rejected with PublicKeyMismatch error\");\n            println!(\"  Error message: {}\", msg);\n        }\ n!(\"\\n=== E2E Test: Load CSR from PEM and DER ===\");\n    \n    // Step 1: Create a CSR\n    let csr = CsrBuilder::new()\n        .subject(\"CN=format-test.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to build CSR\");\n    \n    println!(\"✓ Step 1: CSR created\");\n    \n    // Step 2: Load from DER\n    let cert_from_der = CertificateBuilder::new()\n        .from_der(csr.to_der())\n        .expect(\"Failed to load from DER\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build cert from DER\");\n    \n    println!(\"✓ Step 2: Certificate built from DER format\");\n    \n    // Step 3: Load from PEM\n    let cert_from_pem = CertificateBuilder::new()\n        .from_pem(\u0026csr.to_pem())\n        .expect(\"Failed to load from PEM\")\n        .signing_key(csr.private_key_pem().to_string())\n        .build_self_signed()\n        .expect(\"Failed to build cert from PEM\");\n    \n    println!(\"✓ Step 3: Certificate built from PEM format\");\n    \n    // Step 4: Verify both certificates are valid\n    verify_cert_pem_format(\u0026cert_from_der.to_pem());\n    verify_cert_pem_format(\u0026cert_from_pem.to_pem());\n    \n    assert!(!cert_from_der.to_der().is_empty());\n    assert!(!cert_from_pem.to_der().is_empty());\n    \n    println!(\"✓ Step 4: Both certificates validated\");\n    println!(\"=== Test Passed ===\\n\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","tests","csr_generation.rs"],"content":"//! Integration tests for CSR generation\n//!\n//! These tests verify that CSR generation meets all qualification requirements.\n\nuse mtls_at_lib::csr::CsrBuilder;\nuse mtls_at_lib::types::{ExtendedKeyUsage, KeyUsage};\n\n#[test]\nfn test_csr_generation_with_ku_and_eku_for_ca() {\n    // Qualification requirement 1.1: Create X509 CSR with KU and EKU extensions (CA)\n    let ca_csr = CsrBuilder::new()\n        .subject(\"CN=Test Root CA,O=Test Organization,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n        .is_ca(true)\n        .build()\n        .expect(\"Failed to generate CA CSR\");\n\n    // Verify CSR was generated\n    let der = ca_csr.to_der();\n    assert!(!der.is_empty(), \"CSR DER should not be empty\");\n\n    // Verify PEM encoding\n    let pem = ca_csr.to_pem();\n    assert!(\n        pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"),\n        \"PEM should start with CSR header\"\n    );\n    assert!(\n        pem.contains(\"-----END CERTIFICATE REQUEST-----\"),\n        \"PEM should contain CSR footer\"\n    );\n\n    // Verify private key was generated\n    let private_key_der = ca_csr.private_key_der();\n    assert!(\n        !private_key_der.is_empty(),\n        \"Private key DER should not be empty\"\n    );\n\n    let private_key_pem = ca_csr.private_key_pem();\n    assert!(\n        private_key_pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"),\n        \"Private key PEM should start with key header\"\n    );\n\n    println!(\"✓ CA CSR generated successfully with Key Usage extensions\");\n}\n\n#[test]\nfn test_csr_generation_with_ku_and_eku_for_standard_cert() {\n    // Qualification requirement 1.2: Create X509 CSR with KU and EKU extensions (standard)\n    let server_csr = CsrBuilder::new()\n        .subject(\"CN=server.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n        .add_san(\"www.example.com\")\n        .add_san(\"api.example.com\")\n        .build()\n        .expect(\"Failed to generate server CSR\");\n\n    // Verify CSR was generated\n    let der = server_csr.to_der();\n    assert!(!der.is_empty(), \"CSR DER should not be empty\");\n\n    // Verify PEM encoding\n    let pem = server_csr.to_pem();\n    assert!(\n        pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"),\n        \"PEM should start with CSR header\"\n    );\n\n    // Verify private key\n    assert!(\n        !server_csr.private_key_der().is_empty(),\n        \"Private key should be generated\"\n    );\n\n    println!(\"✓ Server CSR generated successfully with Key Usage and Extended Key Usage\");\n}\n\n#[test]\nfn test_csr_generation_for_client_auth() {\n    // Create a client authentication CSR\n    let client_csr = CsrBuilder::new()\n        .subject(\"CN=client.example.com,O=Example Corp,C=US\")\n        .expect(\"Failed to set subject\")\n        .key_usage(KeyUsage::digital_signature())\n        .extended_key_usage(vec![ExtendedKeyUsage::CLIENT_AUTH])\n        .build()\n        .expect(\"Failed to generate client CSR\");\n\n    // Verify CSR was generated\n    assert!(!client_csr.to_der().is_empty(), \"Client CSR should be generated\");\n\n    println!(\"✓ Client CSR generated successfully for mTLS client authentication\");\n}\n\n#[test]\nfn test_csr_generation_without_optional_extensions() {\n    // Generate a basic CSR without Key Usage or Extended Key Usage\n    let basic_csr = CsrBuilder::new()\n        .subject(\"CN=basic.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate basic CSR\");\n\n    // Verify CSR was generated\n    assert!(!basic_csr.to_der().is_empty(), \"Basic CSR should be generated\");\n    assert!(\n        basic_csr.to_pem().contains(\"CERTIFICATE REQUEST\"),\n        \"Should be a valid CSR\"\n    );\n\n    println!(\"✓ Basic CSR generated successfully without extensions\");\n}\n\n#[test]\nfn test_csr_generation_with_multiple_eku() {\n    // Generate CSR with multiple Extended Key Usage values\n    let multi_eku_csr = CsrBuilder::new()\n        .subject(\"CN=multi.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![\n            ExtendedKeyUsage::SERVER_AUTH,\n            ExtendedKeyUsage::CLIENT_AUTH,\n        ])\n        .build()\n        .expect(\"Failed to generate multi-EKU CSR\");\n\n    assert!(!multi_eku_csr.to_der().is_empty(), \"Multi-EKU CSR should be generated\");\n\n    println!(\"✓ CSR generated successfully with multiple Extended Key Usage values\");\n}\n\n#[test]\nfn test_csr_missing_subject_returns_error() {\n    // Verify that CSR generation fails without a subject\n    let result = CsrBuilder::new().build();\n\n    assert!(result.is_err(), \"CSR generation should fail without subject\");\n    if let Err(e) = result {\n        println!(\"✓ Error correctly returned for missing subject: {}\", e);\n    }\n}\n\n#[test]\nfn test_csr_invalid_subject_returns_error() {\n    // Verify that invalid subject format returns an error\n    let result = CsrBuilder::new().subject(\"\");\n\n    assert!(result.is_err(), \"Empty subject should return an error\");\n    if let Err(e) = result {\n        println!(\"✓ Error correctly returned for empty subject: {}\", e);\n    }\n}\n\n#[test]\nfn test_key_pair_is_different_for_each_csr() {\n    // Generate two CSRs and verify they have different key pairs\n    let csr1 = CsrBuilder::new()\n        .subject(\"CN=test1.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR 1\");\n\n    let csr2 = CsrBuilder::new()\n        .subject(\"CN=test2.example.com\")\n        .expect(\"Failed to set subject\")\n        .build()\n        .expect(\"Failed to generate CSR 2\");\n\n    // Verify that the private keys are different\n    assert_ne!(\n        csr1.private_key_der(),\n        csr2.private_key_der(),\n        \"Each CSR should have a unique private key\"\n    );\n\n    println!(\"✓ Each CSR generates a unique key pair\");\n}\n\n#[test]\nfn test_csr_with_all_key_usage_flags() {\n    // Test CSR with all Key Usage flags ge::CODE_SIGNING])\n        .build()\n        .expect(\"Failed to generate CSR with CODE_SIGNING\");\n    assert!(!code_signing_csr.to_der().is_empty(), \"CODE_SIGNING CSR should be generated\");\n    println!(\"✓ CSR generated with CODE_SIGNING\");\n\n    // Test EMAIL_PROTECTION\n    let email_csr = CsrBuilder::new()\n        .subject(\"CN=email-protection.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::EMAIL_PROTECTION])\n        .build()\n        .expect(\"Failed to generate CSR with EMAIL_PROTECTION\");\n    assert!(!email_csr.to_der().is_empty(), \"EMAIL_PROTECTION CSR should be generated\");\n    println!(\"✓ CSR generated with EMAIL_PROTECTION\");\n\n    // Test TIME_STAMPING\n    let time_stamping_csr = CsrBuilder::new()\n        .subject(\"CN=time-stamping.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::TIME_STAMPING])\n        .build()\n        .expect(\"Failed to generate CSR with TIME_STAMPING\");\n    assert!(!time_stamping_csr.to_der().is_empty(), \"TIME_STAMPING CSR should be generated\");\n    println!(\"✓ CSR generated with TIME_STAMPING\");\n\n    // Test OCSP_SIGNING\n    let ocsp_csr = CsrBuilder::new()\n        .subject(\"CN=ocsp-signing.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![ExtendedKeyUsage::OCSP_SIGNING])\n        .build()\n        .expect(\"Failed to generate CSR with OCSP_SIGNING\");\n    assert!(!ocsp_csr.to_der().is_empty(), \"OCSP_SIGNING CSR should be generated\");\n    println!(\"✓ CSR generated with OCSP_SIGNING\");\n\n    // Test combination of all EKU types\n    let all_eku_csr = CsrBuilder::new()\n        .subject(\"CN=all-eku.example.com\")\n        .expect(\"Failed to set subject\")\n        .extended_key_usage(vec![\n            ExtendedKeyUsage::SERVER_AUTH,\n            ExtendedKeyUsage::CLIENT_AUTH,\n            ExtendedKeyUsage::CODE_SIGNING,\n            ExtendedKeyUsage::EMAIL_PROTECTION,\n            ExtendedKeyUsage::TIME_STAMPING,\n            ExtendedKeyUsage::OCSP_SIGNING,\n        ])\n        .build()\n        .expect(\"Failed to generate CSR with all EKU types\");\n    assert!(!all_eku_csr.to_der().is_empty(), \"CSR with all EKU types should be generated\");\n    println!(\"✓ CSR generated successfully with all Extended Key Usage types combined\");\n}\n\n#[test]\nfn test_csr_with_custom_key() {\n    use rcgen::KeyPair;\n    \n    // Generate a key pair first\n    let key_pair = KeyPair::generate().expect(\"Failed to generate key pair\");\n    let key_pem = key_pair.serialize_pem();\n    \n    // Create a CSR using the custom key\n    let csr = CsrBuilder::new()\n        .subject(\"CN=custom-key.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\u0026key_pem)\n        .expect(\"Failed to set custom key\")\n        .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n        .build()\n        .expect(\"Failed to generate CSR with custom key\");\n    \n    // Verify the CSR was created\n    assert!(!csr.to_der().is_empty(), \"CSR with custom key should be generated\");\n    \n    // Verify the private key matches the one we provided\n    let csr_key_pem = csr.private_key_pem();\n    assert_eq!(key_pem, csr_key_pem, \"CSR private key should match the provided key\");\n    \n    println!(\"✓ CSR generated successfully with custom key pair\");\n}\n\n#[test]\nfn test_csr_with_invalid_key_returns_error() {\n    // Try to create a CSR with an invalid key\n    let result = CsrBuilder::new()\n        .subject(\"CN=invalid-key.example.com\")\n        .expect(\"Failed to set subject\")\n        .with_key(\"invalid key format\");\n    \n    assert!(result.is_err(), \"CSR with invalid key should return error\");\n    println!(\"✓ Invalid key correctly rejected\");\n}\n\n#[test]\nfn test_multiple_csrs_with_same_key() {\n    use rcgen::KeyPair;\n    \n    // Generate u003e {\n        let csr_der_ref = csr_der.into();\n        let csr_params = CertificateSigningRequestParams::from_der(\u0026csr_der_ref)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR DER: {}\", e)))?;\n        \n        self.csr_params = Some(csr_params);\n        Ok(self)\n    }\n    \n    /// Loads certificate parameters from a CSR in PEM format\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_pem` - The CSR in PEM format\n    pub fn from_pem(self, csr_pem: \u0026str) -\u003e Result\u003cSelf, CertError\u003e {\n        // Parse PEM to get DER\n        let pem_data = pem::parse(csr_pem)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR PEM: {}\", e)))?;\n        \n        self.from_der(\u0026pem_data.contents())\n    }\n    \n    /// Convenience method for from_der\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_der` - The CSR in DER format\n    pub fn from_csr(self, csr_der: \u0026[u8]) -\u003e Result\u003cSelf, CertError\u003e {\n        self.from_der(csr_der)\n    }\n    \n    /// Sets the signing key for the certificate\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - The private key in PKCS#8 PEM format\n    pub fn signing_key(mut self, key_pem: String) -\u003e Self {\n        self.signing_key = Some(key_pem);\n        self\n    }\n    \n    /// Builds a self-signed certificate\n    ///\n    /// For self-signed certificates, the public key in the CSR and the public key\n    /// extracted from the signing key must be identical.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys don't match\n    pub fn build_self_signed(self) -\u003e Result\u003cCertificate, CertError\u003e {\n        let (csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // Note: For self-signed certificates, the caller must ensure that the signing_key\n        // provided is the same key that was used to create the CSR. The CSR contains\n        // the public key, and the signing_key must have the matching private key.\n        // rcgen will use the CSR's public key in the certificate.\n        \n        // Create issuer with the same DN as the subject (self-signed)\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = csr_params.params.distinguished_name.clone();\n        let issuer = Issuer::new(issuer_params, \u0026signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026signing_key_pair) == false {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR does not match signing key\".to_string()\n            ));\n        }\n        \n        // Sign the certificate\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate with the private key\n        Ok(Certificate::new(cert_der, Some(signing_key_pem)))\n    }\n    \n    /// Builds a CA-signed or ICA-signed certificate\n    ///\n    /// For CA/ICA-signed certificates, the public key in the CSR and the public key\n    /// extracted from the CA/ICA signing key must be different.\n    ///\n    /// # Arguments\n    ///\n    /// * `ca_issuer_dn` - The issuer Distinguished Name (from CA certificate)\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys are identical (would be self-signed)\n    pub fn build_ca_signed(self, ca_issuer_dn: \u0026str) -\u003e Result\u003cCertificate, CertError\u003e {\n        let (csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let ca_signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // For CA-signed certificates, the CSR's public key should be different from CA's key\n        // Since rcgen doesn't expose direct public key comparison from CSR, we rely on\n        // the signing process which will use the CSR's embedded public key\n        \n        // Parse CA's distinguished name and create issuer\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = Self::parse_dn_string(ca_issuer_dn)?;\n        let issuer = Issuer::new(issuer_params, \u0026ca_signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026ca_signing_key_pair) {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR matches CA signing key; expected different keys for CA-signed cert\".to_string()\n            ));\n        }\n        \n        // Sign the certificate with CA's key\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate without private key (it stays with CSR creator)\n        Ok(Certificate::new(cert_der, None))\n    }\n\n    fn is_identical_pubkey(k1: \u0026impl PublicKeyData, k2: \u0026impl PublicKeyData) -\u003e bool {\n        let pk1 = k1.der_bytes();\n        let pk2 = k2.der_bytes();\n        pk1 == pk2\n    }\n    \n    /// Validates required fields and extracts CSR params and signing key\n    fn validate_and_extract(self) -\u003e Result\u003c(CertificateSigningRequestParams, String), CertError\u003e {\n        let csr_params = self.csr_params\n            .ok_or_else(|| CertError::MissingField(\"CSR parameters required\".to_string()))?;\n        \n        let signing_key_pem = self.signing_key\n            .ok_or_else(|| CertError::MissingField(\"Signing key required\".to_string()))?;\n        \n        Ok((csr_params, signing_key_pem))\n    }\n    \n    /// Parses a P d key\n    fn create_ca_cert() -\u003e Result\u003c(String, String), Box\u003cdyn std::error::Error\u003e\u003e {\n        let ca_csr = CsrBuilder::new()\n            .subject(\"CN=Test CA,O=Test CA Org,C=US\")?\n            .build()?;\n        \n        let ca_cert = CertificateBuilder::new()\n            .from_csr(ca_csr.to_der())?\n            .signing_key(ca_csr.private_key_pem().to_string())\n            .build_self_signed()?;\n        \n        Ok((ca_csr.private_key_pem().to_string(), ca_cert.to_pem()))\n    }\n    \n    #[test]\n    fn test_new_builder() {\n        let builder = CertificateBuilder::new();\n        assert!(builder.signing_key.is_none());\n        assert!(builder.csr_params.is_none());\n    }\n    \n    #[test]\n    fn test_from_der_valid() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_der(\u0026csr_der);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_der_invalid() {\n        let invalid_der = vec![0x00, 0x01, 0x02, 0x03];\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026invalid_der);\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::InvalidName(msg)) =\u003e {\n                assert!(msg.contains(\"Failed to parse CSR DER\"));\n            }\n            _ =\u003e panic!(\"Expected InvalidName error\"),\n        }\n    }\n    \n    #[test]\n    fn test_from_pem_valid() {\n        let (_, _, csr_pem) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_pem(\u0026csr_pem);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_pem_invalid() {\n        let invalid_pe assert!(builder_from_pem.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_validate_and_extract_success() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem.clone());\n        \n        let result = builder.validate_and_extract();\n        assert!(result.is_ok());\n        \n        let (csr_params, extracted_key) = result.unwrap();\n        assert_eq!(extracted_key, key_pem);\n        // CSR params should be valid\n        assert!(!csr_params.params.distinguished_name.iter().collect::\u003cVec\u003c_\u003e\u003e().is_empty());\n    }\n    \n    #[test]\n    fn test_certificate_pem_format() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed()\n            .unwrap();\n        \n        let pem = cert.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n        assert!(pem.contains(\"-----END CERTIFICATE-----\"));\n    }\n    \n    #[test]\n    fn test_certificate_der_format() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed()\n            .unwrap();\n        \n        let der = cert.to_der();\n        assert!(!der.is_empty());\n        // DER format typically starts with 0x30 (SEQUENCE tag)\n        assert_eq!(der[0], 0x30);\n    }\n}\n","traces":[{"line":71,"address":[3966114,3966151,3965536],"length":1,"stats":{"Line":10}},{"line":76,"address":[3965578],"length":1,"stats":{"Line":10}},{"line":79,"address":[3965627],"length":1,"stats":{"Line":12}},{"line":82,"address" \n//! supporting both self-signed certificates and CA-signed certificates from CSRs.\n\npub mod builder;\n\npub use builder::CertificateBuilder;\n\nuse rcgen::KeyPair;\n\n/// Represents an X.509 certificate\n///\n/// This structure holds the certificate in DER format and optionally the private key.\n#[derive(Debug)]\npub struct Certificate {\n    /// The certificate in DER format\n    cert_der: Vec\u003cu8\u003e,\n    \n    /// The private key in PKCS#8 PEM format (only for self-signed certs)\n    key_pem: Option\u003cString\u003e,\n}\n\nimpl Certificate {\n    /// Creates a new certificate\n    pub(crate) fn new(cert_der: Vec\u003cu8\u003e, key_pem: Option\u003cString\u003e) -\u003e Self {\n        Self { cert_der, key_pem }\n    }\n    \n    /// Returns the certificate in DER format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let der = cert.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.cert_der\n    }\n    \n    /// Returns the certificate in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let pem = cert.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"CERTIFICATE\", self.cert_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n    \n    /// Returns the private key in PKCS#8 DER format (if available)\n    pub fn private_key_der(\u0026self) -\u003e Option\u003cVec\u003cu8\u003e\u003e {\n        self.key_pem.as_ref().and_then(|pem| {\n            KeyPair::from_pem(pem).ok().map(|kp| kp.serialize_der())\n        })\n    }\n    \n    /// Returns the private key in PKCS#8 PEM format (if available)\n    pub fn private_key_pem(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        self.key_pem.as_deref()\n    }\n}\n","traces":[{"line":26,"address":[3859888],"length":1,"stats":{"Line":2}},{"line":47,"address":[4189584],"length":1,"stats":{"Line":2}},{"line":48,"address":[4189589],"length":1,"stats":{"Line":5}},{"line":68,"address":[4189768,4189600,4189774],"length":1,"stats":{"Line":4}},{"line":71,"address":[4189624],"length":1,"stats":{"Line":2}},{"line":72,"address":[4189696],"length":1,"stats":{"Line":2}},{"line":76,"address":[4189792],"length":1,"stats":{"Line":1}},{"line":77,"address":[4262048],"length":1,"stats":{"Line":2}},{"line":78,"address":[4262176,4262084,4262160],"length":1,"stats":{"Line":3}},{"line":83,"address":[4189872],"length":1,"stats":{"Line":2}},{"line":84,"address":[4189877],"length":1,"stats":{"Line":2}}],"covered":11,"coverable":11},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","csr","builder.rs"],"content":"//! CSR Builder for constructing Certificate Signing Requests\n//!\n//! This module provides a type-safe builder API for creating CSRs with\n//! Key Usage and Extended Key Usage extensions.\n\nuse crate::error::CsrError;\nuse crate::types::{DistinguishedName, ExtendedKeyUsage, KeyUsage};\nuse super::Csr;\n\nuse rcgen::{\n    CertificateParams, DistinguishedName as RcgenDn, DnType, \n    KeyPair, KeyUsagePurpose, ExtendedKeyUsagePurpose, SanType\n};\n\n/// Builder for creating Certificate Signing Requests\n///\n/// This builder provides a fluent API for configuring and generating CSRs.\n/// It enforces the requirement that all CSRs must have a subject DN.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::csr::CsrBuilder;\n/// use mtls_at_lib::types::KeyUsage;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Create a CA CSR\n/// let ca_csr = CsrBuilder::new()\n///     .subject(\"CN=My Root CA,O=My Organization,C=US\")?\n///     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n///     .is_ca(true)\n///     .build()?;\n///     \n/// // Create a server certificate CSR\n/// let server_csr = CsrBuilder::new()\n///     .subject(\"CN=server.example.com\")?\n///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n///     .build()?;\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug)]\npub struct CsrBuilder {\n    /// Subject Distinguished Name (required)\n    subject: Option\u003cDistinguishedName\u003e,\n    \n    /// Key Usage extension\n    key_usage: Option\u003cKeyUsage\u003e,\n    \n    /// Extended Key Usage extension\n    extended_key_usage: Vec\u003cExtendedKeyUsage\u003e,\n    \n    /// CA flag for BasicConstraints extension\n    is_ca: bool,\n    \n    /// Path length constraint for CA certificates\n    path_len_constraint: Option\u003cu8\u003e,\n    \n    /// Subject Alternative Names\n    subject_alt_names: Vec\u003cString\u003e,\n    \n    /// Optional custom key pair (if not provided, a new one will be generated)\n    key_pair: Option\u003cKeyPair\u003e,\n}\n\nimpl CsrBuilder {\n    /// Creates a new CSR builder\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// let builder = CsrBuilder::new();\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            subject: None,\n            key_usage: None,\n            extended_key_usage: Vec::new(),\n            is_ca: false,\n            path_len_constraint: None,\n            subject_alt_names: Vec::new(),\n            key_pair: None,\n        }\n    }\n    \n    /// Sets the subject Distinguished Name\n    ///\n    /// The subject is required for all CSRs.\n    ///\n    /// # Arguments\n    ///\n    /// * `dn` - Distinguished Name string (e.g., \"CN=example.com,O=My Org,C=US\")\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com,O=Example Inc,C=US\")?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn subject(mut self, dn: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        self.subject = Some(DistinguishedName::from_str(dn)?);\n        Ok(self)\n    }\n    \n    /// Sets a custom key pair to use for the CSR\n    ///\n    /// If not provided, a new ECDSA P-256 key pair will be generated automatically.\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - Private key in PKCS#8 PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use rcgen::KeyPair;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let key_pair = KeyPair::generate()?;\n    /// let key_pem = key_pair.serialize_pem();\n    ///\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .with_key(\u0026key_pem)?\n    ///     .build()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn with_key(mut self, key_pem: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        let key_pair = KeyPair::from_pem(key_pem)\n            .map_err(|e| CsrError::KeyGenerationFailed(format!(\"Invalid key: {}\", e)))?;\n        self.key_pair = Some(key_pair);\n        Ok(self)\n    }\n    \n    /// Sets the Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `usage` - KeyUsage flags (can be combined with `|`)\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn key_usage(mut self, usage: KeyUsage) -\u003e Self {\n        self.key_usage = Some(usage);\n        self\n    }\n    \n    /// Sets the Extended Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `ext_usage` - Vec of ExtendedKeyUsage values\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::ExtendedKeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH]);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn extended_key_usage(mut self, ext_usage: Vec\u003cExtendedKeyUsage\u003e) -\u003e Self {\n        self.extended_key_usage = ext_usage;\n        self\n    }\n    \n    /// Marks this CSR for a CA certificate\n    ///\n    /// This sets the CA flag in the BasicConstraints extension.\n    ///\n    /// # Arguments\n    ///\n    /// * `is_ca` - Whether this is for a CA certificate\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=My Root CA\")?\n    ///     .is_ca(true);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn is_ca(mut self, is_ca: bool) -\u003e Self {\n        self.is_ca = is_ca;\n        self\n    }\n    \n    /// Sets the path length constraint for CA certificates\n    ///\n    /// This restricts how many intermediate CAs can appear in a chain\n    /// below this CA.\n    ///\n    /// # Arguments\n    ///\n    /// * `path_len` - Maximum number of intermediate CAs\n    pub fn path_len_constraint(mut self, path_len: u8) -\u003e Self {\n        self.path_len_constraint = Some(path_len);\n        self\n    }\n    \n    /// Adds a Subject Alternative Name (SAN)\n    ///\n    /// # Arguments\n    ///\n    /// * `san` - DNS name, IP address, or URI\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .add_san(\"www.example.com\")\n    ///     .add_san(\"api.example.com\");\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn add_san(mut self, san: impl Into\u003cString\u003e) -\u003e Self {\n        self.subject_alt_names.push(san.into());\n        self\n    }\n    \n    /// Builds the CSR and generates a new key pair\n    ///\n    /// This generates a new ECDSA P-256 key pair, configures the certificate\n    /// parameters according to the builder settings, and creates a CSR.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - The subject DN is not set\n    /// - Key pair generation fails\n    /// - CSR serialization fails\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// // CSR is now ready to use\n    /// let pem = csr.to_pem();\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn build(self) -\u003e Result\u003cCsr, CsrError\u003e {\n        // Validate required fields\n        let subject = self.subject.ok_or_else(|| {\n            CsrError::InvalidSubjectName(\"Subject name is required\".to_string())\n        })?;\n        \n        // Use provided key pair or generate a new one (ECDSA P-256 for security and performance)\n        let key_pair = if let Some(kp) = self.key_pair {\n            kp\n        } else {\n            KeyPair::generate()\n                .map_err(|e| CsrError::KeyGenerationFailed(e.to_string()))?\n        };\n        \n        // Create certificate parameters\n        let mut params = CertificateParams::default();\n        \n        // Set subject DN - convert our DistinguishedName to rcgen format\n        params.distinguished_name = Self::convert_dn(\u0026subject)?;\n        \n        // Set Key Usage if specified\n        if let Some(ku) = self.key_usage {\n            params.key_usages = Self::convert_key_usage(ku);\n        }\n        \n        // Set Extended Key Usage if specified\n        if !self.extended_key_usage.is_empty() {\n            params.extended_key_usages = Self::convert_extended_key_usage(\u0026self.extended_key_usage);\n        }\n        \n        // Note: BasicConstraints (is_ca) is a certificate parameter, not a CSR parameter\n        // It will be set when the certificate is issued from this CSR\n        // We store it here for future use but don't include it in the CSR\n        \n        // Set Subject Alternative Names\n        if !self.subject_alt_names.is_empty() {\n            params.subject_alt_names = self.subject_alt_names.iter()\n                .map(|s| SanType::DnsName(s.clone().try_into().unwrap()))\n                .collect();\n        }\n        \n        // Generate CSR\n        let csr = params.serialize_request(\u0026key_pair)\n            .map_err(|e| CsrError::EncodingError(e.to_string()))?;\n        \n        Ok(Csr::new(csr.der().to_vec(), key_pair))\n    }\n    \n    /// Converts our DistinguishedName to rcgen's format\n    fn convert_dn(dn: \u0026DistinguishedName) -\u003e Result\u003cRcgenDn, CsrError\u003e {\n        let mut rcgen_dn = RcgenDn::new();\n        \n        // Parse the DN string and add components\n        // Our DistinguishedName stores raw string, so we need to parse it\n        let dn_str = dn.as_str();\n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {}, // Ignore unknown attributes\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n    \n    /// Converts our KeyUsage flags to rcgen's format\n    fn convert_key_usage(ku: KeyUsage) -\u003e Vec\u003cKeyUsagePurpose\u003e {\n        let mut purposes = Vec::new();\n        \n        if ku.contains(KeyUsage::digital_signature()) {\n            purposes.push(KeyUsagePurpose::DigitalSignature);\n        }\n        if ku.contains(KeyUsage::non_repudiation()) {\n            purposes.push(KeyUsagePurpose::ContentCommitment);\n        }\n        if ku.contains(KeyUsage::key_encipherment()) {\n            purposes.push(KeyUsagePurpose::KeyEncipherment);\n        }\n        if ku.contains(KeyUsage::data_encipherment()) {\n            purposes.push(KeyUsagePurpose::DataEncipherment);\n        }\n        if ku.contains(KeyUsage::key_agreement()) {\n            purposes.push(KeyUsagePurpose::KeyAgreement);\n        }\n        if ku.contains(KeyUsage::key_cert_sign()) {\n            purposes.push(KeyUsagePurpose::KeyCertSign);\n        }\n        if ku.contains(KeyUsage::crl_sign()) {\n            purposes.push(KeyUsagePurpose::CrlSign);\n        }\n        if ku.contains(KeyUsage::encipher_only()) {\n            purposes.push(KeyUsagePurpose::EncipherOnly);\n        }\n        if ku.contains(KeyUsage::decipher_only()) {\n            purposes.push(KeyUsagePurpose::DecipherOnly);\n        }\n        \n        purposes\n    }\n    \n    /// Converts our ExtendedKeyUsage to rcgen's format\n    fn convert_extended_key_usage(eku_list: \u0026[ExtendedKeyUsage]) -\u003e Vec\u003cExtendedKeyUsagePurpose\u003e {\n        eku_list.iter().map(|eku| {\n            match eku {\n                _ if eku == \u0026ExtendedKeyUsage::SERVER_AUTH =\u003e ExtendedKeyUsagePurpose::ServerAuth,\n                _ if eku == \u0026ExtendedKeyUsage::CLIENT_AUTH =\u003e ExtendedKeyUsagePurpose::ClientAuth,\n                _ if eku == \u0026ExtendedKeyUsage::CODE_SIGNING =\u003e ExtendedKeyUsagePurpose::CodeSigning,\n                _ if eku == \u0026ExtendedKeyUsage::EMAIL_PROTECTION =\u003e ExtendedKeyUsagePurpose::EmailProtection,\n                _ if eku == \u0026ExtendedKeyUsage::TIME_STAMPING =\u003e ExtendedKeyUsagePurpose::TimeStamping,\n                _ if eku == \u0026ExtendedKeyUsage::OCSP_SIGNING =\u003e ExtendedKeyUsagePurpose::OcspSigning,\n                _ =\u003e ExtendedKeyUsagePurpose::ServerAuth, // Fallback\n            }\n        }).collect()\n    }\n}\n\nimpl Default for CsrBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::KeyUsage;\n    \n    #[test]\n    fn test_basic_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n        assert!(!csr.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_ca_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test Root CA,O=Test Org,C=US\").unwrap()\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .is_ca(true)\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_server_csr_with_eku() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=server.example.com\").unwrap()\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(\"www.example.com\")\n            .add_san(\"api.example.com\")\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        assert!(!csr.private_key_pem().is_empty());\n    }\n    \n    #[test]\n    fn test_missing_subject_error() {\n        let result = CsrBuilder::new().build();\n        assert!(matches!(result, Err(CsrError::InvalidSubjectName(_))));\n    }\n    \n    #[test]\n    fn test_private_key_export() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.private_key_pem();\n        assert!(pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"));\n c usage is set\n/// assert!(server_usage.contains(KeyUsage::digital_signature()));\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct KeyUsage(u16);\n\nimpl KeyUsage {\n    /// Digital signature (bit 0)\n    ///\n    /// Used for verifying digital signatures (excluding certificates and CRLs).\n    /// Required for TLS client and server authentication.\n    pub const fn digital_signature() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 0)\n    }\n\n    /// Non-repudiation / Content commitment (bit 1)\n    ///\n    /// Used for non-repudiation services which protect against false denial of actions.\n    pub const fn non_repudiation() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 1)\n    }\n\n    /// Key encipherment (bit 2)\n    ///\n    /// Used for encrypting keys for key transport.\n    /// Required for RSA key exchange in TLS 1.2.\n    pub const fn key_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 2)\n    }\n\n    /// Data encipherment (bit 3)\n    ///\n    /// Used for encrypting user data (rare in practice).\n    pub const fn data_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 3)\n    }\n\n    /// Key agreement (bit 4)\n    ///\n    /// Used for key agreement protocols like ECDH.\n    pub const fn key_agreement() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 4)\n    }\n\n    /// Key certificate sign (bit 5)\n    ///\n    /// **Required for CA certificates** to sign other certificates.\n    /// Must be marked as critical.\n    pub const fn key_cert_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 5)\n    }\n\n    /// CRL sign (bit 6)\n    ///\n    /// Required for certificates that sign Certificate Revocation Lists.\n    /// Typically used by CA certificates.\n    pub const fn crl_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 6)\n    }\n\n    /// Encipher only (bit 7)\n    ///\n    /// Only used with keyAgreement. Key is only used for enciphering data.\n    pub const fn encipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 7)\n    }\n\n    /// Decipher only (bit 8)\n    ///\n    /// Only used with keyAgreement. Key is only used for deciphering data.\n    pub const fn decipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 8)\n    }\n\n    /// Checks if this KeyUsage contains the specified usage\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// let usage = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n    /// assert!(usage.contains(KeyUsage::digital_signature()));\n    /// assert!(!usage.contains(KeyUsage::key_cert_sign()));\n    /// ```\n    pub const fn contains(self, other: KeyUsage) -\u003e bool {\n        (self.0 \u0026 other.0) == other.0\n    }\n\n    /// Returns the raw bit flags\n    pub const fn bits(self) -\u003e u16 {\n        self.0\n    }\n\n    /// Creates KeyUsage from raw bits\n    pub const fn from_bits(bits: u16) -\u003e Self {\n        KeyUsage(bits)\n    }\n}\n\n// Implement bitwise OR for combining key usage flags\nimpl std::ops::BitOr for KeyUsage {\n    type Output = Self;\n\n    fn bitor(self, rhs: Self) -\u003e Self::Output {\n        KeyUsage(self.0 | rhs.0)\n    }\n}\n\n/// Extended Key Usage extension (RFC 5280, Section 4.2.1.12)\n///\n/// Specifies the purposes for which the certified public key may be used.\n/// This provides more specific usage restrictions than Key Usage.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::ExtendedKeyUsage;\n///\n/// // For a server certificate\n/// let server_eku = vec![ExtendedKeyUsage::SERVER_AUTH];\n///\n/// // For a client certificate\n/// let client_eku = vec![ExtendedKeyUsage::CLIENT_AUTH];\n///\n/// // For both client and server\n/// let both_eku = vec![\n///     ExtendedKeyUsage::SERVER_AUTH,\n///     ExtendedKeyUsage::CLIENT_AUTH,\n/// ];\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ExtendedKeyUsage {\n    oid: \u0026'static str,\n    name: \u0026'static str, istinguishedName::from_str(\"CN=example.com,O=Example Corp,C=US\")?;\n/// assert_eq!(dn.common_name(), Some(\"example.com\"));\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct DistinguishedName {\n    // Internal representation - to be implemented\n    raw: String,\n}\n\nimpl DistinguishedName {\n    /// Parses a Distinguished Name from string format\n    ///\n    /// # Format\n    ///\n    /// The string should be in the format: \"CN=name,O=org,C=country\"\n    ///\n    /// Supported attributes:\n    /// - CN: Common Name\n    /// - O: Organization\n    /// - OU: Organizational Unit\n    /// - C: Country\n    /// - ST: State/Province\n    /// - L: Locality\n    ///\n    /// # Errors\n    ///\n    /// Returns error if the DN string is malformed.\n    pub fn from_str(s: \u0026str) -\u003e Result\u003cSelf, crate::error::CsrError\u003e {\n        // Basic validation - detailed parsing to be implemented\n        if s.is_empty() {\n            return Err(crate::error::CsrError::InvalidSubjectName(\n                \"Distinguished name cannot be empty\".to_string(),\n            ));\n        }\n\n        Ok(DistinguishedName {\n            raw: s.to_string(),\n        })\n    }\n\n    /// Returns the Common Name (CN) if present\n    pub fn common_name(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        // Simplified extraction - to be properly implemented\n        self.raw\n            .split(',')\n            .find(|part| part.trim().starts_with(\"CN=\"))\n            .and_then(|cn_part| cn_part.split('=').nth(1))\n            .map(|s| s.trim())\n    }\n\n    /// Returns the raw DN string\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.raw\n    }\n}\n\nimpl fmt::Display for DistinguishedName {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.raw)\n    }\n}\n\n/// X.509 Certificate Serial Number\n///\n/// A unique positive integer assigned to each certificate by the CA.\n/// Must be unique within the CA's scope and should be unpredictable.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::SerialNumber;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Generate a random serial number\n/// let serial = SerialNumber::generate()?;\n///\n/// // Create from bytes\n/// let serial = SerialNumber::from_bytes(\u0026[0x01, 0x02, 0x03]);\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct SerialNumber {\n    bytes: Vec\u003cu8\u003e,\n}\n\nimpl SerialNumber {\n    /// Generates a cryptographically secure random serial number\n    ///\n    /// The serial number is:\n    /// - 20 bytes (160 bits) as per RFC 5280 maximum\n    /// - Positive (high bit cleared)\n    /// - Cryptographically random\n    ///\n    /// # Security\n    ///\n    /// Uses a cryptographically secure random number generator.\n    /// Serial numbers are unpredictable to prevent enumeration attacks.\n    pub fn generate() -\u003e Result\u003cSelf, crate::error::CertError\u003e {\n        use sha2::{Digest, Sha256};\n\n        // Get current timestamp\n        let timestamp = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .map_err(|e| {\n                crate::error::CertError::SerialNumberError(format!(\"Time error: {}\", e))\n            })?\n            .as_secs();\n\n        // Generate random bytes\n        let random_bytes: [u8; 16] = rand::random();\n\n        // Combine timestamp and random bytes, then hash\n        let mut hasher = Sha256::new();\n        hasher.update(\u0026timestamp.to_be_bytes());\n        hasher.update(\u0026random_bytes);\n        let hash = hasher.finalize();\n\n        // Take first 20 bytes\n        let mut serial = hash[..20].to_vec();\n\n        // Ensure positive (clear high bit)\n        serial[0] \u0026= 0x7F;\n\n        Ok(SerialNumber { bytes: serial })\n    }\n\n    /// Creates a serial number from bytes\n    ///\n    /// # Arguments\n    ///\n    /// * `bytes` - Raw bytes of the serial number\n    ///\n    /// # Note\n    ///\n    /// The serial number should be positive. If the high bit is set,\n    /// it will be interpreted as negative in ASN.1 encoding.\n    pub fn from_bytes(bytes: \u0026[u8]) -\u003e Self {\n        SerialNumber {\n            bytes: bytes.to_vec(),\n        }\n    }\n\n    /// Returns the serial number as bytes\n    pub fn as_bytes(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.bytes\n    }\n\n    /// Returns the serial number as a hex string\n    pub fn to_hex(\u0026self) -\u003e String {\n        self.bytes\n            .iter()\n            .map(|b| format!(\"{:02x}\", b))\n            .collect::\u003cString\u003e()\n    }\n}\n\nimpl fmt::Display for SerialNumber {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.to_hex())\n    }\n}","traces":[{"line":109,"address":[4253408],"length":1,"stats":{"Line":6}},{"line":110,"address":[3793328],"length":1,"stats":{"Line":3}},{"line":114,"address":[4147536],"length":1,"stats":{"Line":0}},{"line":119,"address":[4147552],"length":1,"stats":{"Line":0}},{"line":128,"address":[3793376],"length":1,"stats":{"Line":3}},{"line":129,"address":[4253488],"length":1,"stats":{"Line":3}},{"line":205,"address":[3793408],"length":1,"stats":{"Line":0}},{"line":206,"address":[4253509],"length":1,"stats":{"Line":0}},{"line":210,"address":[4253520],"length":1,"stats":{"Line":0}},{"line":211,"address":[3793429],"length":1,"stats":{"Line":0}},{"line":216,"address":[4253536],"length":1,"stats":{"Line":0}},{"line":217,"address":[4147665],"length":1,"stats":{"Line":0}},{"line":260,"address":[4253712],"length":1,"stats":{"Line":15}},{"line":262,"address":[4253769],"length":1,"stats":{"Line":26}},{"line":263,"address":[4253900],"length":1,"stats":{"Line":1}},{"line":264,"address":[4147968],"length":1,"stats
