<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        var data = {"files":[{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","cert","builder.rs"],"content":"//! Certificate Builder for constructing X.509 certificates\n//!\n//! This module provides a type-safe builder API for creating both self-signed\n//! certificates and CA-signed certificates from CSRs.\n\nuse crate::error::CertError;\nuse super::Certificate;\n\nuse rcgen::{\n    CertificateParams, CertificateSigningRequestParams, Issuer, KeyPair, PublicKeyData\n};\n\n/// Builder for creating certificates from CSRs\n///\n/// This builder allows creating either self-signed certificates or CA-signed certificates\n/// from Certificate Signing Requests (CSRs). The builder maintains CSR parameters and\n/// signing key information.\n#[derive(Debug)]\npub struct CertificateBuilder {\n    signing_key: Option\u003cString\u003e,\n    csr_params: Option\u003cCertificateSigningRequestParams\u003e,\n}\n\nimpl CertificateBuilder {\n    /// Creates a builder for a certificate from a CSR\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            signing_key: None,\n            csr_params: None,\n        }\n    }\n    \n    /// Loads certificate parameters from a CSR in DER format\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_der` - The CSR in DER format\n    pub fn from_der(mut self, csr_der: \u0026[u8]) -\u003e Result\u003cSelf, CertError\u003e {\n        let csr_der_ref = csr_der.into();\n        let csr_params = CertificateSigningRequestParams::from_der(\u0026csr_der_ref)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR DER: {}\", e)))?;\n        \n        self.csr_params = Some(csr_params);\n        Ok(self)\n    }\n    \n    /// Loads certificate parameters from a CSR in PEM format\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_pem` - The CSR in PEM format\n    pub fn from_pem(self, csr_pem: \u0026str) -\u003e Result\u003cSelf, CertError\u003e {\n        // Parse PEM to get DER\n        let pem_data = pem::parse(csr_pem)\n            .map_err(|e| CertError::InvalidName(format!(\"Failed to parse CSR PEM: {}\", e)))?;\n        \n        self.from_der(\u0026pem_data.contents())\n    }\n    \n    /// Convenience method for from_der\n    ///\n    /// # Arguments\n    ///\n    /// * `csr_der` - The CSR in DER format\n    pub fn from_csr(self, csr_der: \u0026[u8]) -\u003e Result\u003cSelf, CertError\u003e {\n        self.from_der(csr_der)\n    }\n    \n    /// Sets the signing key for the certificate\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - The private key in PKCS#8 PEM format\n    pub fn signing_key(mut self, key_pem: String) -\u003e Self {\n        self.signing_key = Some(key_pem);\n        self\n    }\n    \n    /// Builds a self-signed certificate\n    ///\n    /// For self-signed certificates, the public key in the CSR and the public key\n    /// extracted from the signing key must be identical.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys don't match\n    pub fn build_self_signed(self) -\u003e Result\u003cCertificate, CertError\u003e {\n        let (csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // Note: For self-signed certificates, the caller must ensure that the signing_key\n        // provided is the same key that was used to create the CSR. The CSR contains\n        // the public key, and the signing_key must have the matching private key.\n        // rcgen will use the CSR's public key in the certificate.\n        \n        // Create issuer with the same DN as the subject (self-signed)\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = csr_params.params.distinguished_name.clone();\n        let issuer = Issuer::new(issuer_params, \u0026signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026signing_key_pair) == false {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR does not match signing key\".to_string()\n            ));\n        }\n        \n        // Sign the certificate\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate with the private key\n        Ok(Certificate::new(cert_der, Some(signing_key_pem)))\n    }\n    \n    /// Builds a CA-signed or ICA-signed certificate\n    ///\n    /// For CA/ICA-signed certificates, the public key in the CSR and the public key\n    /// extracted from the CA/ICA signing key must be different.\n    ///\n    /// # Arguments\n    ///\n    /// * `ca_issuer_dn` - The issuer Distinguished Name (from CA certificate)\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - CSR parameters are not loaded\n    /// - Signing key is not provided\n    /// - Public keys are identical (would be self-signed)\n    pub fn build_ca_signed(self, ca_issuer_dn: \u0026str) -\u003e Result\u003cCertificate, CertError\u003e {\n        let (csr_params, signing_key_pem) = self.validate_and_extract()?;\n        let ca_signing_key_pair = Self::parse_key(\u0026signing_key_pem)?;\n        \n        // For CA-signed certificates, the CSR's public key should be different from CA's key\n        // Since rcgen doesn't expose direct public key comparison from CSR, we rely on\n        // the signing process which will use the CSR's embedded public key\n        \n        // Parse CA's distinguished name and create issuer\n        let mut issuer_params = CertificateParams::default();\n        issuer_params.distinguished_name = Self::parse_dn_string(ca_issuer_dn)?;\n        let issuer = Issuer::new(issuer_params, \u0026ca_signing_key_pair);\n        if Self::is_identical_pubkey(\u0026csr_params.public_key, \u0026ca_signing_key_pair) {\n            return Err(CertError::PublicKeyMismatch(\n                \"Public key in CSR matches CA signing key; expected different keys for CA-signed cert\".to_string()\n            ));\n        }\n        \n        // Sign the certificate with CA's key\n        let cert_der = csr_params.signed_by(\u0026issuer)\n            .map_err(|e| CertError::SigningError(e.to_string()))?\n            .der().to_vec();\n        \n        // Return certificate without private key (it stays with CSR creator)\n        Ok(Certificate::new(cert_der, None))\n    }\n\n    fn is_identical_pubkey(k1: \u0026impl PublicKeyData, k2: \u0026impl PublicKeyData) -\u003e bool {\n        let pk1 = k1.der_bytes();\n        let pk2 = k2.der_bytes();\n        pk1 == pk2\n    }\n    \n    /// Validates required fields and extracts CSR params and signing key\n    fn validate_and_extract(self) -\u003e Result\u003c(CertificateSigningRequestParams, String), CertError\u003e {\n        let csr_params = self.csr_params\n            .ok_or_else(|| CertError::MissingField(\"CSR parameters required\".to_string()))?;\n        \n        let signing_key_pem = self.signing_key\n            .ok_or_else(|| CertError::MissingField(\"Signing key required\".to_string()))?;\n        \n        Ok((csr_params, signing_key_pem))\n    }\n    \n    /// Parses a PEM-encoded private key\n    fn parse_key(key_pem: \u0026str) -\u003e Result\u003cKeyPair, CertError\u003e {\n        KeyPair::from_pem(key_pem)\n            .map_err(|e| CertError::SigningError(format!(\"Invalid signing key: {}\", e)))\n    }\n    \n    /// Helper function to parse DN string into rcgen format\n    fn parse_dn_string(dn_str: \u0026str) -\u003e Result\u003crcgen::DistinguishedName, CertError\u003e {\n        use rcgen::{DistinguishedName as RcgenDn, DnType};\n        \n        let mut rcgen_dn = RcgenDn::new();\n        \n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {},\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::csr::CsrBuilder;\n    \n    /// Helper function to create a test CSR with its key\n    fn create_test_csr() -\u003e Result\u003c(Vec\u003cu8\u003e, String, String), Box\u003cdyn std::error::Error\u003e\u003e {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com,O=Test Org,C=US\")?\n            .build()?;\n        \n        Ok((csr.to_der().to_vec(), csr.private_key_pem().to_string(), csr.to_pem()))\n    }\n    \n    /// Helper function to create a CA certificate and key\n    fn create_ca_cert() -\u003e Result\u003c(String, String), Box\u003cdyn std::error::Error\u003e\u003e {\n        let ca_csr = CsrBuilder::new()\n            .subject(\"CN=Test CA,O=Test CA Org,C=US\")?\n            .build()?;\n        \n        let ca_cert = CertificateBuilder::new()\n            .from_csr(ca_csr.to_der())?\n            .signing_key(ca_csr.private_key_pem().to_string())\n            .build_self_signed()?;\n        \n        Ok((ca_csr.private_key_pem().to_string(), ca_cert.to_pem()))\n    }\n    \n    #[test]\n    fn test_new_builder() {\n        let builder = CertificateBuilder::new();\n        assert!(builder.signing_key.is_none());\n        assert!(builder.csr_params.is_none());\n    }\n    \n    #[test]\n    fn test_from_der_valid() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_der(\u0026csr_der);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_der_invalid() {\n        let invalid_der = vec![0x00, 0x01, 0x02, 0x03];\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026invalid_der);\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::InvalidName(msg)) =\u003e {\n                assert!(msg.contains(\"Failed to parse CSR DER\"));\n            }\n            _ =\u003e panic!(\"Expected InvalidName error\"),\n        }\n    }\n    \n    #[test]\n    fn test_from_pem_valid() {\n        let (_, _, csr_pem) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_pem(\u0026csr_pem);\n        \n        assert!(builder.is_ok());\n        let builder = builder.unwrap();\n        assert!(builder.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_from_pem_invalid() {\n        let invalid_pem = \"-----BEGIN CERTIFICATE REQUEST-----\\nInvalidData\\n-----END CERTIFICATE REQUEST-----\";\n        \n        let result = CertificateBuilder::new()\n            .from_pem(invalid_pem);\n        \n        assert!(result.is_err());\n    }\n    \n    #[test]\n    fn test_from_csr_valid() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_csr(\u0026csr_der);\n        \n        assert!(builder.is_ok());\n        assert!(builder.unwrap().csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_signing_key() {\n        let test_key = \"test_key_pem\".to_string();\n        let builder = CertificateBuilder::new()\n            .signing_key(test_key.clone());\n        \n        assert_eq!(builder.signing_key, Some(test_key));\n    }\n    \n    #[test]\n    fn test_build_self_signed_success() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed();\n        \n        assert!(cert.is_ok());\n        let cert = cert.unwrap();\n        \n        // Verify the certificate has a private key (self-signed includes private key)\n        assert!(cert.private_key_pem().is_some());\n        \n        // Verify we can get PEM and DER formats\n        assert!(!cert.to_pem().is_empty());\n        assert!(!cert.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_build_self_signed_missing_csr() {\n        let key_pair = KeyPair::generate().unwrap();\n        let key_pem = key_pair.serialize_pem();\n        \n        let result = CertificateBuilder::new()\n            .signing_key(key_pem)\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"CSR parameters required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_missing_key() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"Signing key required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_key_mismatch() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        // Generate a different key\n        let different_key = KeyPair::generate().unwrap();\n        let different_key_pem = different_key.serialize_pem();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(different_key_pem)\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::PublicKeyMismatch(msg)) =\u003e {\n                assert!(msg.contains(\"Public key in CSR does not match signing key\"));\n            }\n            _ =\u003e panic!(\"Expected PublicKeyMismatch error, got: {:?}\", result),\n        }\n    }\n    \n    #[test]\n    fn test_build_self_signed_invalid_key() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(\"invalid_key\".to_string())\n            .build_self_signed();\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::SigningError(msg)) =\u003e {\n                assert!(msg.contains(\"Invalid signing key\"));\n            }\n            _ =\u003e panic!(\"Expected SigningError\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_ca_signed_success() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        let (ca_key_pem, _) = create_ca_cert().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(ca_key_pem)\n            .build_ca_signed(\"CN=Test CA,O=Test CA Org,C=US\");\n        \n        assert!(cert.is_ok());\n        let cert = cert.unwrap();\n        \n        // CA-signed cert should not include the private key\n        assert!(cert.private_key_pem().is_none());\n        \n        // Verify we can get PEM and DER formats\n        assert!(!cert.to_pem().is_empty());\n        assert!(!cert.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_build_ca_signed_missing_csr() {\n        let key_pair = KeyPair::generate().unwrap();\n        let key_pem = key_pair.serialize_pem();\n        \n        let result = CertificateBuilder::new()\n            .signing_key(key_pem)\n            .build_ca_signed(\"CN=Test CA\");\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"CSR parameters required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_ca_signed_missing_key() {\n        let (csr_der, _, _) = create_test_csr().unwrap();\n        \n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .build_ca_signed(\"CN=Test CA\");\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::MissingField(msg)) =\u003e {\n                assert!(msg.contains(\"Signing key required\"));\n            }\n            _ =\u003e panic!(\"Expected MissingField error\"),\n        }\n    }\n    \n    #[test]\n    fn test_build_ca_signed_same_key_error() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        // Try to sign with the same key (should fail)\n        let result = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_ca_signed(\"CN=Test CA,O=Test Org,C=US\");\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::PublicKeyMismatch(msg)) =\u003e {\n                assert!(msg.contains(\"Public key in CSR matches CA signing key\"));\n            }\n            _ =\u003e panic!(\"Expected PublicKeyMismatch error, got: {:?}\", result),\n        }\n    }\n    \n    #[test]\n    fn test_parse_dn_string_simple() {\n        let dn_str = \"CN=test.example.com\";\n        let result = CertificateBuilder::parse_dn_string(dn_str);\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_parse_dn_string_complex() {\n        let dn_str = \"CN=test.example.com,O=Test Org,OU=IT Department,C=US,ST=California,L=San Francisco\";\n        let result = CertificateBuilder::parse_dn_string(dn_str);\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_parse_dn_string_with_spaces() {\n        let dn_str = \"CN = test.example.com , O = Test Org , C = US\";\n        let result = CertificateBuilder::parse_dn_string(dn_str);\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_parse_dn_string_empty() {\n        let dn_str = \"\";\n        let result = CertificateBuilder::parse_dn_string(dn_str);\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_parse_key_valid() {\n        let key_pair = KeyPair::generate().unwrap();\n        let key_pem = key_pair.serialize_pem();\n        \n        let result = CertificateBuilder::parse_key(\u0026key_pem);\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_parse_key_invalid() {\n        let invalid_key = \"not a valid key\";\n        let result = CertificateBuilder::parse_key(invalid_key);\n        \n        assert!(result.is_err());\n        match result {\n            Err(CertError::SigningError(msg)) =\u003e {\n                assert!(msg.contains(\"Invalid signing key\"));\n            }\n            _ =\u003e panic!(\"Expected SigningError\"),\n        }\n    }\n    \n    #[test]\n    fn test_is_identical_pubkey_same() {\n        let key_pair = KeyPair::generate().unwrap();\n        let key_pem = key_pair.serialize_pem();\n        let key_pair2 = KeyPair::from_pem(\u0026key_pem).unwrap();\n        \n        assert!(CertificateBuilder::is_identical_pubkey(\u0026key_pair, \u0026key_pair2));\n    }\n    \n    #[test]\n    fn test_is_identical_pubkey_different() {\n        let key_pair1 = KeyPair::generate().unwrap();\n        let key_pair2 = KeyPair::generate().unwrap();\n        \n        assert!(!CertificateBuilder::is_identical_pubkey(\u0026key_pair1, \u0026key_pair2));\n    }\n    \n    #[test]\n    fn test_builder_chain() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        // Test chaining methods\n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed();\n        \n        assert!(cert.is_ok());\n    }\n    \n    #[test]\n    fn test_from_pem_and_from_der_equivalence() {\n        let (csr_der, _, csr_pem) = create_test_csr().unwrap();\n        \n        let builder_from_der = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap();\n        \n        let builder_from_pem = CertificateBuilder::new()\n            .from_pem(\u0026csr_pem)\n            .unwrap();\n        \n        // Both should have CSR params loaded\n        assert!(builder_from_der.csr_params.is_some());\n        assert!(builder_from_pem.csr_params.is_some());\n    }\n    \n    #[test]\n    fn test_validate_and_extract_success() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let builder = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem.clone());\n        \n        let result = builder.validate_and_extract();\n        assert!(result.is_ok());\n        \n        let (csr_params, extracted_key) = result.unwrap();\n        assert_eq!(extracted_key, key_pem);\n        // CSR params should be valid\n        assert!(!csr_params.params.distinguished_name.iter().collect::\u003cVec\u003c_\u003e\u003e().is_empty());\n    }\n    \n    #[test]\n    fn test_certificate_pem_format() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed()\n            .unwrap();\n        \n        let pem = cert.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n        assert!(pem.contains(\"-----END CERTIFICATE-----\"));\n    }\n    \n    #[test]\n    fn test_certificate_der_format() {\n        let (csr_der, key_pem, _) = create_test_csr().unwrap();\n        \n        let cert = CertificateBuilder::new()\n            .from_der(\u0026csr_der)\n            .unwrap()\n            .signing_key(key_pem)\n            .build_self_signed()\n            .unwrap();\n        \n        let der = cert.to_der();\n        assert!(!der.is_empty());\n        // DER format typically starts with 0x30 (SEQUENCE tag)\n        assert_eq!(der[0], 0x30);\n    }\n}\n","traces":[{"line":45,"address":[4269744],"length":1,"stats":{"Line":7}},{"line":57,"address":[3844661,3844595,3843808],"length":1,"stats":{"Line":4}},{"line":58,"address":[4269920],"length":1,"stats":{"Line":4}},{"line":59,"address":[4270113,4  .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let der = cert.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.cert_der\n    }\n    \n    /// Returns the certificate in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::cert::CertificateBuilder;\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=Test CA\")?\n    ///     .build()?;\n    ///\n    /// let cert = CertificateBuilder::new()\n    ///     .from_csr(csr.to_der())?\n    ///     .signing_key(csr.private_key_pem().to_string())\n    ///     .build_self_signed()?;\n    ///     \n    /// let pem = cert.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN CERTIFICATE-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"CERTIFICATE\", self.cert_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n    \n    /// Returns the private key in PKCS#8 DER format (if available)\n    pub fn private_key_der(\u0026self) -\u003e Option\u003cVec\u003cu8\u003e\u003e {\n        self.key_pem.as_ref().and_then(|pem| {\n            KeyPair::from_pem(pem).ok().map(|kp| kp.serialize_der())\n        })\n    }\n    \n    /// Returns the private key in PKCS#8 PEM format (if available)\n    pub fn private_key_pem(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        self.key_pem.as_deref()\n    }\n}\n","traces":[{"line":26,"address":[3959888],"length":1,"stats":{"Line":7}},{"line":53,"address":[4299968],"length":1,"stats":{"Line":2}},{"line":54,"address":[4299973],"length":1,"stats":{"Line":2}},{"line":80,"address":[4300158,4299984,4300152],"length":1,"sta Debug)]\npub struct CsrBuilder {\n    /// Subject Distinguished Name (required)\n    subject: Option\u003cDistinguishedName\u003e,\n    \n    /// Key Usage extension\n    key_usage: Option\u003cKeyUsage\u003e,\n    \n    /// Extended Key Usage extension\n    extended_key_usage: Vec\u003cExtendedKeyUsage\u003e,\n    \n    /// CA flag for BasicConstraints extension\n    is_ca: bool,\n    \n    /// Path length constraint for CA certificates\n    path_len_constraint: Option\u003cu8\u003e,\n    \n    /// Subject Alternative Names\n    subject_alt_names: Vec\u003cString\u003e,\n    \n    /// Optional custom key pair (if not provided, a new one will be generated)\n    key_pair: Option\u003cKeyPair\u003e,\n}\n\nimpl CsrBuilder {\n    /// Creates a new CSR builder\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// let builder = CsrBuilder::new();\n    /// ```\n    pub fn new() -\u003e Self {\n        Self {\n            subject: None,\n            key_usage: None,\n            extended_key_usage: Vec::new(),\n            is_ca: false,\n            path_len_constraint: None,\n            subject_alt_names: Vec::new(),\n            key_pair: None,\n        }\n    }\n    \n    /// Sets the subject Distinguished Name\n    ///\n    /// The subject is required for all CSRs.\n    ///\n    /// # Arguments\n    ///\n    /// * `dn` - Distinguished Name string (e.g., \"CN=example.com,O=My Org,C=US\")\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com,O=Example Inc,C=US\")?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn subject(mut self, dn: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        self.subject = Some(DistinguishedName::from_str(dn)?);\n        Ok(self)\n    }\n    \n    /// Sets a custom key pair to use for the CSR\n    ///\n    /// If not provided, a new ECDSA P-256 key pair will be generated automatically.\n    ///\n    /// # Arguments\n    ///\n    /// * `key_pem` - Private key in PKCS#8 PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use rcgen::KeyPair;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let key_pair = KeyPair::generate()?;\n    /// let key_pem = key_pair.serialize_pem();\n    ///\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .with_key(\u0026key_pem)?\n    ///     .build()?;\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn with_key(mut self, key_pem: \u0026str) -\u003e Result\u003cSelf, CsrError\u003e {\n        let key_pair = KeyPair::from_pem(key_pem)\n            .map_err(|e| CsrError::KeyGenerationFailed(format!(\"Invalid key: {}\", e)))?;\n        self.key_pair = Some(key_pair);\n        Ok(self)\n    }\n    \n    /// Sets the Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `usage` - KeyUsage flags (can be combined with `|`)\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn key_usage(mut self, usage: KeyUsage) -\u003e Self {\n        self.key_usage = Some(usage);\n        self\n    }\n    \n    /// Sets the Extended Key Usage extension\n    ///\n    /// # Arguments\n    ///\n    /// * `ext_usage` - Vec of ExtendedKeyUsage values\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    /// use mtls_at_lib::types::ExtendedKeyUsage;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH]);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn extended_key_usage(mut self, ext_usage: Vec\u003cExtendedKeyUsage\u003e) -\u003e Self {\n        self.extended_key_usage = ext_usage;\n        self\n    }\n    \n    /// Marks this CSR for a CA certificate\n    ///\n    /// This sets the CA flag in the BasicConstraints extension.\n    ///\n    /// # Arguments\n    ///\n    /// * `is_ca` - Whether this is for a CA certificate\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=My Root CA\")?\n    ///     .is_ca(true);\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn is_ca(mut self, is_ca: bool) -\u003e Self {\n        self.is_ca = is_ca;\n        self\n    }\n    \n    /// Sets the path length constraint for CA certificates\n    ///\n    /// This restricts how many intermediate CAs can appear in a chain\n    /// below this CA.\n    ///\n    /// # Arguments\n    ///\n    /// * `path_len` - Maximum number of intermediate CAs\n    pub fn path_len_constraint(mut self, path_len: u8) -\u003e Self {\n        self.path_len_constraint = Some(path_len);\n        self\n    }\n    \n    /// Adds a Subject Alternative Name (SAN)\n    ///\n    /// # Arguments\n    ///\n    /// * `san` - DNS name, IP address, or URI\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let builder = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .add_san(\"www.example.com\")\n    ///     .add_san(\"api.example.com\");\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn add_san(mut self, san: impl Into\u003cString\u003e) -\u003e Self {\n        self.subject_alt_names.push(san.into());\n        self\n    }\n    \n    /// Builds the CSR and generates a new key pair\n    ///\n    /// This generates a new ECDSA P-256 key pair, configures the certificate\n    /// parameters according to the builder settings, and creates a CSR.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if:\n    /// - The subject DN is not set\n    /// - Key pair generation fails\n    /// - CSR serialization fails\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// // CSR is now ready to use\n    /// let pem = csr.to_pem();\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn build(self) -\u003e Result\u003cCsr, CsrError\u003e {\n        // Validate required fields\n        let subject = self.subject.ok_or_else(|| {\n            CsrError::InvalidSubjectName(\"Subject name is required\".to_string())\n        })?;\n        \n        // Use provided key pair or generate a new one (ECDSA P-256 for security and performance)\n        let key_pair = if let Some(kp) = self.key_pair {\n            kp\n        } else {\n            KeyPair::generate()\n                .map_err(|e| CsrError::KeyGenerationFailed(e.to_string()))?\n        };\n        \n        // Create certificate parameters\n        let mut params = CertificateParams::default();\n        \n        // Set subject DN - convert our DistinguishedName to rcgen format\n        params.distinguished_name = Self::convert_dn(\u0026subject)?;\n        \n        // Set Key Usage if specified\n        if let Some(ku) = self.key_usage {\n            params.key_usages = Self::convert_key_usage(ku);\n        }\n        \n        // Set Extended Key Usage if specified\n        if !self.extended_key_usage.is_empty() {\n            params.extended_key_usages = Self::convert_extended_key_usage(\u0026self.extended_key_usage);\n        }\n        \n        // Note: BasicConstraints (is_ca) is a certificate parameter, not a CSR parameter\n        // It will be set when the certificate is issued from this CSR\n        // We store it here for future use but don't include it in the CSR\n        \n        // Set Subject Alternative Names\n        if !self.subject_alt_names.is_empty() {\n            params.subject_alt_names = self.subject_alt_names.iter()\n                .map(|s| SanType::DnsName(s.clone().try_into().unwrap()))\n                .collect();\n        }\n        \n        // Generate CSR\n        let csr = params.serialize_request(\u0026key_pair)\n            .map_err(|e| CsrError::EncodingError(e.to_string()))?;\n        \n        Ok(Csr::new(csr.der().to_vec(), key_pair))\n    }\n    \n    /// Converts our DistinguishedName to rcgen's format\n    fn convert_dn(dn: \u0026DistinguishedName) -\u003e Result\u003cRcgenDn, CsrError\u003e {\n        let mut rcgen_dn = RcgenDn::new();\n        \n        // Parse the DN string and add components\n        // Our DistinguishedName stores raw string, so we need to parse it\n        let dn_str = dn.as_str();\n        for part in dn_str.split(',') {\n            let part = part.trim();\n            if let Some((key, value)) = part.split_once('=') {\n                let key = key.trim();\n                let value = value.trim();\n                \n                match key {\n                    \"CN\" =\u003e rcgen_dn.push(DnType::CommonName, value),\n                    \"O\" =\u003e rcgen_dn.push(DnType::OrganizationName, value),\n                    \"OU\" =\u003e rcgen_dn.push(DnType::OrganizationalUnitName, value),\n                    \"C\" =\u003e rcgen_dn.push(DnType::CountryName, value),\n                    \"ST\" | \"S\" =\u003e rcgen_dn.push(DnType::StateOrProvinceName, value),\n                    \"L\" =\u003e rcgen_dn.push(DnType::LocalityName, value),\n                    _ =\u003e {}, // Ignore unknown attributes\n                }\n            }\n        }\n        \n        Ok(rcgen_dn)\n    }\n    \n    /// Converts our KeyUsage flags to rcgen's format\n    fn convert_key_usage(ku: KeyUsage) -\u003e Vec\u003cKeyUsagePurpose\u003e {\n        let mut purposes = Vec::new();\n        \n        if ku.contains(KeyUsage::digital_signature()) {\n            purposes.push(KeyUsagePurpose::DigitalSignature);\n        }\n        if ku.contains(KeyUsage::non_repudiation()) {\n            purposes.push(KeyUsagePurpose::ContentCommitment);\n        }\n        if ku.contains(KeyUsage::key_encipherment()) {\n            purposes.push(KeyUsagePurpose::KeyEncipherment);\n        }\n        if ku.contains(KeyUsage::data_encipherment()) {\n            purposes.push(KeyUsagePurpose::DataEncipherment);\n        }\n        if ku.contains(KeyUsage::key_agreement()) {\n            purposes.push(KeyUsagePurpose::KeyAgreement);\n        }\n        if ku.contains(KeyUsage::key_cert_sign()) {\n            purposes.push(KeyUsagePurpose::KeyCertSign);\n        }\n        if ku.contains(KeyUsage::crl_sign()) {\n            purposes.push(KeyUsagePurpose::CrlSign);\n        }\n        if ku.contains(KeyUsage::encipher_only()) {\n            purposes.push(KeyUsagePurpose::EncipherOnly);\n        }\n        if ku.contains(KeyUsage::decipher_only()) {\n            purposes.push(KeyUsagePurpose::DecipherOnly);\n        }\n        \n        purposes\n    }\n    \n    /// Converts our ExtendedKeyUsage to rcgen's format\n    fn convert_extended_key_usage(eku_list: \u0026[ExtendedKeyUsage]) -\u003e Vec\u003cExtendedKeyUsagePurpose\u003e {\n        eku_list.iter().map(|eku| {\n            match eku {\n                _ if eku == \u0026ExtendedKeyUsage::SERVER_AUTH =\u003e ExtendedKeyUsagePurpose::ServerAuth,\n                _ if eku == \u0026ExtendedKeyUsage::CLIENT_AUTH =\u003e ExtendedKeyUsagePurpose::ClientAuth,\n                _ if eku == \u0026ExtendedKeyUsage::CODE_SIGNING =\u003e ExtendedKeyUsagePurpose::CodeSigning,\n                _ if eku == \u0026ExtendedKeyUsage::EMAIL_PROTECTION =\u003e ExtendedKeyUsagePurpose::EmailProtection,\n                _ if eku == \u0026ExtendedKeyUsage::TIME_STAMPING =\u003e ExtendedKeyUsagePurpose::TimeStamping,\n                _ if eku == \u0026ExtendedKeyUsage::OCSP_SIGNING =\u003e ExtendedKeyUsagePurpose::OcspSigning,\n                _ =\u003e ExtendedKeyUsagePurpose::ServerAuth, // Fallback\n            }\n        }).collect()\n    }\n}\n\nimpl Default for CsrBuilder {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::KeyUsage;\n    \n    #[test]\n    fn test_basic_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.to_pem();\n        assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n        assert!(!csr.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_ca_csr_generation() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=Test Root CA,O=Test Org,C=US\").unwrap()\n            .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n            .is_ca(true)\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n    }\n    \n    #[test]\n    fn test_server_csr_with_eku() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=server.example.com\").unwrap()\n            .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n            .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n            .add_san(\"www.example.com\")\n            .add_san(\"api.example.com\")\n            .build().unwrap();\n            \n        assert!(!csr.to_der().is_empty());\n        assert!(!csr.private_key_pem().is_empty());\n    }\n    \n    #[test]\n    fn test_missing_subject_error() {\n        let result = CsrBuilder::new().build();\n        assert!(matches!(result, Err(CsrError::InvalidSubjectName(_))));\n    }\n    \n    #[test]\n    fn test_private_key_export() {\n        let csr = CsrBuilder::new()\n            .subject(\"CN=test.example.com\").unwrap()\n            .build().unwrap();\n            \n        let pem = csr.private_key_pem();\n        assert!(pem.starts_with(\"-----BEGIN PRIVATE KEY-----\"));\n        \n        let der = csr.private_key_der();\n        assert!(!der.is_empty());\n    }\n}\n","traces":[{"line":76,"address":[4140781,4140464,4140775],"length":1,"stats":{"Line":35}},{"line":80,"address":[4170816],"length":1,"stats":{"Line":35}},{"line":83,"address":[4140553],"length":1,"stats":{"Line":36}},{"line":107,"address":[4141257,4140800],"length":1,"stats":{"Line":35}},{"line":108,"address":[4140921,4140864],"length":1,"stats":{"Line":70}},{"line":109,"address":[4171510],"length":1,"stats":{"Line":21}},{"line":137,"address":[4141907,4141280,4141934],"length":1,"stats":{"Line":3}},{"line":138,"address":[4005527,4005608,4005424],"length":1,"stats":{"Line":6}},{"line":139,"address":[4171732,4171828],"length":1,"stats":{"Line":6}},{"line":140,"address":[4172119,4171982],"length":1,"stats":{"Line":4}},{"line":141,"address":[4141826],"length":1,"stats":{"Line":2}},{"line":163,"address":[4006016],"length":1,"stats":{"Line":8}},{"line":164,"address":[4006036],"length":1,"stats":{"Line":8}},{"line":165,"address":[4141988],"length":1,"stats":{"Line":11}},{"line":187,"address":[4142016,4142167],"length":1,"stats":{"Line":4}},{"line":188,"address":[4006181,4006112],"length":1,"stats":{"Line":9}},{"line":189,"address":[4142147] d the associated private key.\n/// The private key is needed for signing the CSR and later for creating\n/// certificates from this CSR.\n///\n/// # Security\n///\n/// The private key is stored in memory and should be handled carefully.\n/// Consider using secure memory wiping when the key is no longer needed.\n#[derive(Debug)]\npub struct Csr {\n    /// The certificate signing request in DER format\n    csr_der: Vec\u003cu8\u003e,\n    \n    /// The private key associated with this CSR\n    key_pair: KeyPair,\n}\n\nimpl Csr {\n    /// Creates a new CSR from DER bytes and key pair\n    pub(crate) fn new(csr_der: Vec\u003cu8\u003e, key_pair: KeyPair) -\u003e Self {\n        Self { csr_der, key_pair }\n    }\n    \n    /// Returns the CSR in DER format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// let der = csr.to_der();\n    /// assert!(!der.is_empty());\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_der(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.csr_der\n    }\n    \n    /// Returns the CSR in PEM format\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::csr::CsrBuilder;\n    ///\n    /// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    /// let csr = CsrBuilder::new()\n    ///     .subject(\"CN=example.com\")?\n    ///     .build()?;\n    ///     \n    /// let pem = csr.to_pem();\n    /// assert!(pem.starts_with(\"-----BEGIN CERTIFICATE REQUEST-----\"));\n    /// # Ok(())\n    /// # }\n    /// ```\n    pub fn to_pem(\u0026self) -\u003e String {\n        use pem::Pem;\n        \n        let pem_obj = Pem::new(\"CERTIFICATE REQUEST\", self.csr_der.clone());\n        pem::encode(\u0026pem_obj)\n    }\n    \n    /// Returns a reference to the private key\n    ///\n    /// # Security Warning\n    ///\n    /// The private key should be kept secure and never transmitted or logged.\n    pub fn private_key(\u0026self) -\u003e \u0026KeyPair {\n        \u0026self.key_pair\n    }\n    \n    /// Serializes the private key to PKCS#8 DER format\n    ///\n    /// # Security Warning\n    ///\n    /// This exports the private key. Use only when necessary and ensure\n    /// the output is properly protected.\n    pub fn private_key_der(\u0026self) -\u003e Vec\u003cu8\u003e {\n        self.key_pair.serialize_der()\n    }\n    \n    /// Serializes the private key to PKCS#8 PEM format\n    ///\n    /// # Security Warning\n    ///\n    /// This exports the private key. Use only when necessary and ensure\n    /// the output is properly protected.\n    pub fn private_key_pem(\u0026self) -\u003e String {\n        self.key_pair.serialize_pem()\n    }\n}\n","traces":[{"line":33,"address":[4288176],"length":1,"stats":{"Line":23}},{"line":54,"address":[4247248],"length":1,"stats":{"Line":20}},{"line":55,"address":[4247253],"length":1,"stats":{"Line":20}},{"line":75,"address":[4247438,4247432,4247264],"length":1,"stats":{"Line":3}},{"line":78,"address":[4288296],"length":1,"stats":{"Line":3}},{"line":79,"address":[4247360],"length":1,"stats":{"Line":18}},{"line":87,"address":[4247456],"length":1,"stats":{"Line":0}},{"line":88,"address":[4288472],"length":1,"stats":{"Line":0}},{"line":97,"address":[4247472],"length":1,"stats":{"Line":2}},{"line":98,"address":[4247489],"length":1,"stats":{"Line":2}},{"line":107,"address":[4247520],"length":1,"stats":{"Line":7}},{"line":108,"address":[4247537],"length":1,"stats":{"Line":3}}],"covered":10,"coverable":12},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","error.rs"],"content":"//! Error types for the mtls_at_lib library\n//!\n//! This module defines all error types used throughout the library,\n//! using `thiserror` for ergonomic error handling.\n\nuse thiserror::Error;\n\n/// Errors that can occur during CSR (Certificate Signing Request) operations\n#[derive(Error, Debug)]\npub enum CsrError {\n    /// Invalid subject distinguished name format\n    #[error(\"Invalid subject name: {0}\")]\n    InvalidSubjectName(String),\n\n    /// Key generation failed\n    #[error(\"Key generation failed: {0}\")]\n    KeyGenerationFailed(String),\n\n    /// Encoding error (ASN.1 DER encoding)\n    #[error(\"Encoding error: {0}\")]\n    EncodingError(String),\n}\n\n/// Errors that can occur during certificate operations\n#[derive(Error, Debug)]\npub enum CertError {\n    /// Invalid subject or issuer name\n    #[error(\"Invalid name: {0}\")]\n    InvalidName(String),\n\n    /// Missing required field\n    #[error(\"Missing required field: {0}\")]\n    MissingField(String),\n\n    /// Certificate signing failed\n    #[error(\"Certificate signing failed: {0}\")]\n    SigningError(String),\n\n    /// Serial number generation failed\n    #[error(\"Serial number generation failed: {0}\")]\n    SerialNumberError(String),\n\n    /// Public key mismatch error\n    #[error(\"Public key mismatch: {0}\")]\n    PublicKeyMismatch(String),\n}","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","lib.rs"],"content":"//! # mtls_at_lib\n//!\n//! A safe, memory-safe Rust library for mTLS operations with comprehensive certificate management.\n//!\n//! This library provides fail-safe utilities for:\n//! - X.509 Certificate Signing Request (CSR) generation with Key Usage and Extended Key Usage extensions\n//! - Certificate issuance (both CA-signed and self-signed)\n//! - Certificate Revocation List (CRL) generation and validation\n//! - Certificate chain verification with CRL Distribution Point (CDP) support\n//! - Mutual TLS (mTLS) connections with comprehensive validation\n//!\n//! ## Design Principles\n//!\n//! - **Memory Safety**: 100% safe Rust with minimal FFI usage\n//! - **Type Safety**: Leverage Rust's type system to prevent misuse\n//! - **Fail-Safe Defaults**: Secure by default, explicit opt-in for weaker security\n//! - **Comprehensive Validation**: All certificates validated for expiry, revocation, key usage, and signatures\n//!\n//! ## Quick Start\n//!\n//! ### Creating a Certificate Signing Request\n//!\n//! ```rust\n//! use mtls_at_lib::csr::CsrBuilder;\n//! use mtls_at_lib::types::{KeyUsage, ExtendedKeyUsage};\n//!\n//! # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n//! // Create a CSR for a server certificate\n//! let csr = CsrBuilder::new()\n//!     .subject(\"CN=example.com,O=Example Corp,C=US\")?\n//!     .key_usage(KeyUsage::digital_signature() | KeyUsage::key_encipherment())\n//!     .extended_key_usage(vec![ExtendedKeyUsage::SERVER_AUTH])\n//!     .build()?;\n//! # Ok(())\n//! # }\n//! ```\n//!\n//! ### Creating a Self-Signed CA Certificate\n//!\n//! ```rust\n//! use mtls_at_lib::cert::CertificateBuilder;\n//! use mtls_at_lib::csr::CsrBuilder;\n//! use mtls_at_lib::types::KeyUsage;\n//!\n//! # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n//! // Create a CSR for root CA certificate\n//! let ca_csr = CsrBuilder::new()\n//!     .subject(\"CN=Root CA,O=Example Corp,C=US\")?\n//!     .is_ca(true)\n//!     .key_usage(KeyUsage::key_cert_sign() | KeyUsage::crl_sign())\n//!     .build()?;\n//!\n//! // Create self-signed certificate from CSR\n//! let ca_cert = CertificateBuilder::new()\n//!     .from_csr(ca_csr.to_der())?\n//!     .signing_key(ca_csr.private_key_pem().to_string())\n//!     .build_self_signed()?;\n//! # Ok(())\n//! # }\n//! ```\n//!\n//! ## Features\n//!\n//! - `cdp-fetch`: Enable CRL fetching from distribution points (requires network access)\n//!\n//! ## Safety Guarantees\n//!\n//! All cryptographic operations use pure Rust implementations:\n//! - `rustls` for TLS 1.3\n//! - `rcgen` for certificate generation\n//! - `x509-parser` for certificate parsing\n//!\n//! No unsafe code in the public API surface. Any FFI usage is:\n//! - Minimal and well-documented\n//! - Memory-safety verified\n//! - Thoroughly tested\n\n#![deny(unsafe_code)]\n#![warn(missing_docs)]\n#![warn(clippy::all)]\npub mod error;\npub mod types;\npub mod csr;\npub mod cert;\n\npub use error::*;\npub use types::*;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ubat","Desktop","Projects","Personal","rust_project","mtls_at_lib","src","types.rs"],"content":"//! Common types used throughout the library\n//!\n//! This module defines type-safe wrappers for cryptographic concepts\n//! like Key Usage, Extended Key Usage, Distinguished Names, and Serial Numbers.\n\nuse std::fmt;\n\n/// Key Usage extension flags (RFC 5280, Section 4.2.1.3)\n///\n/// Defines the cryptographic operations for which a certificate's public key may be used.\n/// This is a critical extension for CA certificates.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::KeyUsage;\n///\n/// // For a server certificate\n/// let server_usage = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n///\n/// // For a CA certificate\n/// let ca_usage = KeyUsage::key_cert_sign() | KeyUsage::crl_sign();\n///\n/// // Check if a specific usage is set\n/// assert!(server_usage.contains(KeyUsage::digital_signature()));\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct KeyUsage(u16);\n\nimpl KeyUsage {\n    /// Digital signature (bit 0)\n    ///\n    /// Used for verifying digital signatures (excluding certificates and CRLs).\n    /// Required for TLS client and server authentication.\n    pub const fn digital_signature() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 0)\n    }\n\n    /// Non-repudiation / Content commitment (bit 1)\n    ///\n    /// Used for non-repudiation services which protect against false denial of actions.\n    pub const fn non_repudiation() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 1)\n    }\n\n    /// Key encipherment (bit 2)\n    ///\n    /// Used for encrypting keys for key transport.\n    /// Required for RSA key exchange in TLS 1.2.\n    pub const fn key_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 2)\n    }\n\n    /// Data encipherment (bit 3)\n    ///\n    /// Used for encrypting user data (rare in practice).\n    pub const fn data_encipherment() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 3)\n    }\n\n    /// Key agreement (bit 4)\n    ///\n    /// Used for key agreement protocols like ECDH.\n    pub const fn key_agreement() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 4)\n    }\n\n    /// Key certificate sign (bit 5)\n    ///\n    /// **Required for CA certificates** to sign other certificates.\n    /// Must be marked as critical.\n    pub const fn key_cert_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 5)\n    }\n\n    /// CRL sign (bit 6)\n    ///\n    /// Required for certificates that sign Certificate Revocation Lists.\n    /// Typically used by CA certificates.\n    pub const fn crl_sign() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 6)\n    }\n\n    /// Encipher only (bit 7)\n    ///\n    /// Only used with keyAgreement. Key is only used for enciphering data.\n    pub const fn encipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 7)\n    }\n\n    /// Decipher only (bit 8)\n    ///\n    /// Only used with keyAgreement. Key is only used for deciphering data.\n    pub const fn decipher_only() -\u003e Self {\n        KeyUsage(1 \u003c\u003c 8)\n    }\n\n    /// Checks if this KeyUsage contains the specified usage\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use mtls_at_lib::types::KeyUsage;\n    ///\n    /// let usage = KeyUsage::digital_signature() | KeyUsage::key_encipherment();\n    /// assert!(usage.contains(KeyUsage::digital_signature()));\n    /// assert!(!usage.contains(KeyUsage::key_cert_sign()));\n    /// ```\n    pub const fn contains(self, other: KeyUsage) -\u003e bool {\n        (self.0 \u0026 other.0) == other.0\n    }\n\n    /// Returns the raw bit flags\n    pub const fn bits(self) -\u003e u16 {\n        self.0\n    }\n\n    /// Creates KeyUsage from raw bits\n    pub const fn from_bits(bits: u16) -\u003e Self {\n        KeyUsage(bits)\n    }\n}\n\n// Implement bitwise OR for combining key usage flags\nimpl std::ops::BitOr for KeyUsage {\n    type Output = Self;\n\n    fn bitor(self, rhs: Self) -\u003e Self::Output {\n        KeyUsage(self.0 | rhs.0)\n    }\n}\n\n/// Extended Key Usage extension (RFC 5280, Section 4.2.1.12)\n///\n/// Specifies the purposes for which the certified public key may be used.\n/// This provides more specific usage restrictions than Key Usage.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::ExtendedKeyUsage;\n///\n/// // For a server certificate\n/// let server_eku = vec![ExtendedKeyUsage::SERVER_AUTH];\n///\n/// // For a client certificate\n/// let client_eku = vec![ExtendedKeyUsage::CLIENT_AUTH];\n///\n/// // For both client and server\n/// let both_eku = vec![\n///     ExtendedKeyUsage::SERVER_AUTH,\n///     ExtendedKeyUsage::CLIENT_AUTH,\n/// ];\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ExtendedKeyUsage {\n    oid: \u0026'static str,\n    name: \u0026'static str,\n}\n\nimpl ExtendedKeyUsage {\n    /// TLS server authentication (OID: 1.3.6.1.5.5.7.3.1)\n    ///\n    /// Required for TLS server certificates.\n    pub const SERVER_AUTH: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.1\",\n        name: \"serverAuth\",\n    };\n\n    /// TLS client authentication (OID: 1.3.6.1.5.5.7.3.2)\n    ///\n    /// Required for TLS client certificates in mTLS.\n    pub const CLIENT_AUTH: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.2\",\n        name: \"clientAuth\",\n    };\n\n    /// Code signing (OID: 1.3.6.1.5.5.7.3.3)\n    pub const CODE_SIGNING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.3\",\n        name: \"codeSigning\",\n    };\n\n    /// Email protection (OID: 1.3.6.1.5.5.7.3.4)\n    ///\n    /// Used for S/MIME email encryption and signing.\n    pub const EMAIL_PROTECTION: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.4\",\n        name: \"emailProtection\",\n    };\n\n    /// Time stamping (OID: 1.3.6.1.5.5.7.3.8)\n    pub const TIME_STAMPING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.8\",\n        name: \"timeStamping\",\n    };\n\n    /// OCSP signing (OID: 1.3.6.1.5.5.7.3.9)\n    pub const OCSP_SIGNING: Self = Self {\n        oid: \"1.3.6.1.5.5.7.3.9\",\n        name: \"ocspSigning\",\n    };\n\n    /// Returns the OID string\n    pub fn oid(\u0026self) -\u003e \u0026str {\n        self.oid\n    }\n\n    /// Returns the human-readable name\n    pub fn name(\u0026self) -\u003e \u0026str {\n        self.name\n    }\n}\n\nimpl fmt::Display for ExtendedKeyUsage {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{} ({})\", self.name, self.oid)\n    }\n}\n\n/// X.509 Distinguished Name\n///\n/// Represents an X.500 Distinguished Name used in certificate subjects and issuers.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::DistinguishedName;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// let dn = DistinguishedName::from_str(\"CN=example.com,O=Example Corp,C=US\")?;\n/// assert_eq!(dn.common_name(), Some(\"example.com\"));\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct DistinguishedName {\n    // Internal representation - to be implemented\n    raw: String,\n}\n\nimpl DistinguishedName {\n    /// Parses a Distinguished Name from string format\n    ///\n    /// # Format\n    ///\n    /// The string should be in the format: \"CN=name,O=org,C=country\"\n    ///\n    /// Supported attributes:\n    /// - CN: Common Name\n    /// - O: Organization\n    /// - OU: Organizational Unit\n    /// - C: Country\n    /// - ST: State/Province\n    /// - L: Locality\n    ///\n    /// # Errors\n    ///\n    /// Returns error if the DN string is malformed.\n    pub fn from_str(s: \u0026str) -\u003e Result\u003cSelf, crate::error::CsrError\u003e {\n        // Basic validation - detailed parsing to be implemented\n        if s.is_empty() {\n            return Err(crate::error::CsrError::InvalidSubjectName(\n                \"Distinguished name cannot be empty\".to_string(),\n            ));\n        }\n\n        Ok(DistinguishedName {\n            raw: s.to_string(),\n        })\n    }\n\n    /// Returns the Common Name (CN) if present\n    pub fn common_name(\u0026self) -\u003e Option\u003c\u0026str\u003e {\n        // Simplified extraction - to be properly implemented\n        self.raw\n            .split(',')\n            .find(|part| part.trim().starts_with(\"CN=\"))\n            .and_then(|cn_part| cn_part.split('=').nth(1))\n            .map(|s| s.trim())\n    }\n\n    /// Returns the raw DN string\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.raw\n    }\n}\n\nimpl fmt::Display for DistinguishedName {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.raw)\n    }\n}\n\n/// X.509 Certificate Serial Number\n///\n/// A unique positive integer assigned to each certificate by the CA.\n/// Must be unique within the CA's scope and should be unpredictable.\n///\n/// # Examples\n///\n/// ```\n/// use mtls_at_lib::types::SerialNumber;\n///\n/// # fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n/// // Generate a random serial number\n/// let serial = SerialNumber::generate()?;\n///\n/// // Create from bytes\n/// let serial = SerialNumber::from_bytes(\u0026[0x01, 0x02, 0x03]);\n/// # Ok(())\n/// # }\n/// ```\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct SerialNumber {\n    bytes: Vec\u003cu8\u003e,\n}\n\nimpl SerialNumber {\n    /// Generates a cryptographically secure random serial number\n    ///\n    /// The serial number is:\n    /// - 20 bytes (160 bits) as per RFC 5280 maximum\n    /// - Positive (high bit cleared)\n    /// - Cryptographically random\n    ///\n    /// # Security\n    ///\n    /// Uses a cryptographically secure random number generator.\n    /// Serial numbers are unpredictable to prevent enumeration attacks.\n    pub fn generate() -\u003e Result\u003cSelf, crate::error::CertError\u003e {\n        use sha2::{Digest, Sha256};\n\n        // Get current timestamp\n        let timestamp = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .map_err(|e| {\n                crate::error::CertError::SerialNumberError(format!(\"Time error: {}\", e))\n            })?\n            .as_secs();\n\n        // Generate random bytes\n        let random_bytes: [u8; 16] = rand::random();\n\n        // Combine timestamp and random bytes, then hash\n        let mut hasher = Sha256::new();\n        hasher.update(\u0026timestamp.to_be_bytes());\n        hasher.update(\u0026random_bytes);\n        let hash = hasher.finalize();\n\n        // Take first 20 bytes\n        let mut serial = hash[..20].to_vec();\n\n        // Ensure positive (clear high bit)\n        serial[0] \u0026= 0x7F;\n\n        Ok(SerialNumber { bytes: serial })\n    }\n\n    /// Creates a serial number from bytes\n    ///\n    /// # Arguments\n    ///\n    /// * `bytes` - Raw bytes of the serial number\n    ///\n    /// # Note\n    ///\n    /// The serial number should be positive. If the high bit is set,\n    /// it will be interpreted as negative in ASN.1 encoding.\n    pub fn from_bytes(bytes: \u0026[u8]) -\u003e Self {\n        SerialNumber {\n            bytes: bytes.to_vec(),\n        }\n    }\n\n    /// Returns the serial number as bytes\n    pub fn as_bytes(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.bytes\n    }\n\n    /// Returns the serial number as a hex string\n    pub fn to_hex(\u0026self) -\u003e String {\n        self.bytes\n            .iter()\n            .map(|b| format!(\"{:02x}\", b))\n            .collect::\u003cString\u003e()\n    }\n}\n\nimpl fmt::Display for SerialNumber {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.to_hex())\n    }\n}","traces":[{"line":109,"address":[4178624],"length":1,"stats":{"Line":8}},{"line":110,"address":[3965408],"length":1,"stats":{"Line":12}},{"line":114,"address":[4148336],"length":1,"stats":{"Line":0}},{"line":119,"address":[4148352],"length":1,"stats":{"Line":0}},{"line":128,"address":[3965456],"length":1,"stats":{"Line":8}},{"line":129,"address":[4178704],"length":1,"stats":{"Line":8}},{"line":205,"address":[3965488],"length":1,"stats":{"Line":0}},{"line":206,"address":[4178725],"length":1,"stats":{"Line":0}},{"line":210,"address":[4178736],"length":1,"stats":{"Line":0}},{"line":211,"address":[3965509],"length":1,"stats":{"Line":0}},{"line":216,"address":[4178752],"length":1,"stats":{"Line":0}},{"line":217,"address":[4148465],"length":1,"stats":{"Line":0}},{"line":260,"address":[4178928],"length":1,"stats":{"Line":35}},{"line":262,"address":[4178985],"length":1,"stats":{"Line":35}},{"line":263,"address":[4179116],"length":1,"stats":{"Line":1}},{"line":264,"address":[4148768],"length":1,"stats":{"Line":1}},{"line":268,"address":[3965787],"length":1,"stats":{"Line":34}},{"line":269,"address":[4148683],"length":1,"stats":{"Line":34}},{"line":274,"address":[4179216],"length":1,"stats":{"Line":0}},{"line":276,"address":[4148905],"length":1,"stats":{"Line":0}},{"line":278,"address":[4148940],"length":1,"stats":{"Line":0}},{"line":279,"address":[4168528,4168548],"length":1,"stats":{"Line":0}},{"line":280,"address":[3966050],"length":1,"stats":{"Line":0}},{"line":284,"address":[4179312],"length":1,"stats":{"Line":33}},{"line":285,"address":[3966069],"length":1,"stats":{"Line":34}},{"line":290,"address":[4179328],"length":1,"stats":{"Line":0}},{"line":291,"address":[39
