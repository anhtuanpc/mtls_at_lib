[package]
name = "mtls_at_lib"
version = "0.1.0"
edition = "2024"
authors = ["Tony Dao <anhtuanpcipho@gmail.com>"]
description = "A safe, memory-safe Rust library for mTLS operations with comprehensive certificate management"
keywords = ["mtls", "x509", "certificate", "csr", "crl"]
categories = ["cryptography", "network-programming"]

[dependencies]
rcgen = { version = "0.14.5", features = ["x509-parser"] }
pem = "3.0"
x509-parser = "0.18"

# Eror handling
thiserror = "2.0"
anyhow = "1.0"

# Time handling for certificate validity
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Cryptographic randomness and hashing
rand = "0.9.2"
sha2 = "0.10"